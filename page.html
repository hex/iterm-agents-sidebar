<!doctype html>
<meta charset="utf-8">
<title>Agents</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f2f2f7; --fg: #1c1c1e; --dim: #6c6c70; --rule: #e5e5ea;
    /* A session is a card on the canvas; the one that needs you turns amber. */
    --card: #ffffff; --card-hover: #f9f9fb; --card-border: #e5e5ea;
    /* The words of an agent's tag: its colour, deepened until it reads on its own tint. */
    --ink-claude: #a15840; --ink-openai: #0c795e; --ink-omp: #6655d8;
    --blocked-bg: #fff3dc; --blocked-border: #ff9500; --blocked-text: #7a4100;
    --hot: #2a6fd6; --warn: #a8420a; --warn-bg: #fdf1e7;
    /* Ink on a filled accent (hot, alert, the Switch pill) and on the amber
       badge: white only where white reads; the dark theme's fills are pale. */
    --accent-ink: #ffffff; --badge-ink: #5c3000; --switch-bg: #b5573a;
    /* Lamp states. Named for what they are on the board, not for a
       generic scale -- these belong to this panel and nothing else. */
    --lit: #2f8f4e; --alert: #c2410c;
    /* The lamp green reads at 4.07:1 on a white card, which a 2px tick does
       not care about and 11px words do. */
    --lit-ink: #2a7d45;
    --lit-bg: #2f8f4e1f; --alert-bg: #c2410c1f;
    /* Limit bars: headroom, climbing, near the limit. claude-swap's bands, with
       an amber and a red that still read as amber and red on a light panel. */
    --sev-ok: #3d6b3d; --sev-warn: #c98a0b; --sev-crit: #dc2626;
    /* Two hovers: a row tint for anything list-shaped, a control tint for
       buttons; and one focus ring. */
    --tint-row: color-mix(in srgb, var(--hot) 12%, transparent);
    --tint-ctl: color-mix(in srgb, var(--fg) 9%, transparent);
    /* A card's edge is light, not a line: two soft drops and a pale ring.
       On a dark ground a drop shadow is invisible, so there the ring alone
       carries the edge. */
    --card-edge: 0 2px 4px rgb(35 35 35 / .03), 0 1px 2px rgb(35 35 35 / .04),
                 0 0 0 2px rgb(205 205 205 / .14);
    --ease-power2: cubic-bezier(.33, 1, .68, 1);
    --scale: 1;
  }
  html { zoom: var(--scale); }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e; --fg: #f2f2f7; --dim: #98989d; --rule: #3a3a3c;
      --card: #2c2c2e; --card-hover: #323236; --card-border: #3a3a3c;
      --ink-claude: #e08f75; --ink-openai: #3bb496; --ink-omp: #9f92ee;
      --blocked-bg: #3a2500; --blocked-border: #ff9f0a; --blocked-text: #ffd60a;
      --hot: #81a2be; --warn: #de935f; --warn-bg: #2c2118;
      --accent-ink: #1c1c1e; --badge-ink: #3a2500; --switch-bg: #d97757;
      --lit: #8ec07c; --alert: #fb8b5e; --lit-ink: #8ec07c;
      --lit-bg: #8ec07c26; --alert-bg: #fb8b5e2b;
      --sev-ok: #87af87; --sev-warn: #d7af5f; --sev-crit: #d75f5f;
      --card-edge: 0 0 0 1px var(--card-border);
    }
  }
  * { box-sizing: border-box; }
  /* The hidden attribute only hides through a UA rule, which any author rule
     setting display beats. Without this, `.menu { display: flex }` kept every
     menu on screen no matter what el.hidden said. */
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-user-select: none; user-select: none;
    overflow-x: hidden;
    /* Column so the settings bar can sit at the foot of the panel rather
       than under the last row, wherever the list happens to end. */
    /* The body is exactly one viewport tall, so the footer sits at the true
       bottom. Divided by the scale because zoom renders the result: a plain
       100vh at 0.8 lands the footer at 80% of the panel's height, floating in
       the middle. position:fixed avoids the height question but computes its
       containing block inconsistently under zoom, and lost the controls. */
    display: flex; flex-direction: column;
    height: calc(100vh / var(--scale)); overflow: hidden;
  }
  #banner {
    display: none; padding: 6px 10px; background: var(--warn-bg);
    color: var(--warn); font-weight: 600; border-bottom: 1px solid var(--rule);
  }
  body.stale #banner { display: block; }
  /* Fail loud: every row dims at once, so stale data is never mistaken for
     current data. Opacity only -- compositor-friendly, no layout thrash. */
  body.stale #groups { opacity: .55; }
  @media (prefers-reduced-motion: no-preference) {
    #groups { transition: opacity .15s ease; }
  }
  /* Well clear of the last agent family: the heading divides two kinds of
     row, and at family spacing it read as one more family. */
  /* A heading is a label, not a shout: reading size, sentence case, and the
     count of what is under it. The count is muted -- a figure you read when
     you look for it -- unless it names something waiting, which is an alarm. */
  h2, #queue h3 {
    margin: 0; display: flex; align-items: baseline; gap: 6px;
    font-size: 11.5px; font-weight: 600; letter-spacing: -.02em; color: var(--fg);
  }
  h2 .n, #queue h3 .n {
    font-weight: 500; color: var(--dim); font-variant-numeric: tabular-nums;
  }
  h2 {
    padding: 22px 10px 4px;
  }
  ul { margin: 0; padding: 0; list-style: none; }

  /* Actions are siblings of the row, never inside it: a button inside a
     button is invalid, and the row itself is a button. */
  li.line { position: relative; }
  /* A session, its teammates and its shells are one card, so nothing inside
     it can be read as belonging to the session below. The card is the list
     item and holds no position of its own beyond the menu's anchor. */
  /* The same 8px of canvas above the first card as beside every card. */
  ul { padding: 0 8px; }
  #groups { padding-top: 8px; }
  /* Registered so the two depths can be animated: a plain custom property is
     a string to the animation engine and jumps rather than fades. */
  @property --fade-top { syntax: "<length>"; inherits: false; initial-value: 0px; }
  @property --fade-foot { syntax: "<length>"; inherits: false; initial-value: 24px; }
  @keyframes groups-scroll-fade {
    0%          { --fade-top: 0px;  --fade-foot: 24px; }
    8%, 92%     { --fade-top: 24px; --fade-foot: 24px; }
    100%        { --fade-top: 24px; --fade-foot: 0px; }
  }
  /* Scroll-driven: no listener, no frame work. Where the timeline is not
     understood the initial values stand, which is a crisp top and a faded
     foot -- true for a list at rest. */
  @supports (animation-timeline: scroll(self y)) {
    #groups { animation: groups-scroll-fade linear both; animation-timeline: scroll(self y); }
  }
  @media (prefers-reduced-motion: reduce) { #groups { animation: none; } }
  li.line.card {
    margin-bottom: 6px; border-radius: 8px;
    background: var(--card); box-shadow: var(--card-edge);
    transition: background-color .18s ease-out, box-shadow .15s var(--ease-power2);
  }
  /* Agent cards get more air above the name and below the last line. */
  li.line.card:has(> button.row.agent) { padding-block: 4px; }
  /* A card carrying a report is three or four lines tall; it needs the air a
     two-line card does not. */
  li.line.card:has(.task) > button.row { padding-block: 8px; }
  li.line.card:has(> button.row:hover) { background: var(--card-hover); }
  li.line.card > button.row { border-radius: 7px; }
  li.line.card > button.row:hover { background: none; }
  /* A session in a linked worktree of the card above: its own card, docked
     under that one with no gap and a dashed seam, so the pair reads as one
     object holding two sessions, washed lightly in the main session's
     colour. The seam is the elastic part: a dashed line drawn across the
     card's top edge, straight at rest, and plucked like a string whenever
     the pair moves, so it bows a few pixels and rings back flat. It is
     drawn (paintSeams) rather than being a border, since a border cannot
     bend. */
  li.line.card:has(+ li.line.card.worktree) {
    margin-bottom: 0; border-bottom-left-radius: 0; border-bottom-right-radius: 0;
  }
  li.line.card.worktree {
    margin-top: -1px; border-top-color: transparent;
    border-top-left-radius: 0; border-top-right-radius: 0;
  }
  li.line.card.worktree > svg.seam {
    position: absolute; z-index: 1; overflow: visible; pointer-events: none;
    left: 0; top: -1px; width: 100%; height: 1px; color: var(--card-border);
  }
  /* A light wash of the colour of the session it belongs to; its own colour
     stays on its mark and the band. A session without a colour leaves the
     card plain. */
  li.line.card.worktree[style*="--family"] {
    background: color-mix(in srgb, var(--family) 4%, var(--card));
  }
  li.line.card.worktree[style*="--family"]:has(> button.row:hover) {
    background: color-mix(in srgb, var(--family) 7%, var(--card-hover));
  }
  /* The one exception: amber across the whole card and a heavier edge all
     round, visible without reading a word. The extra weight is an inset ring
     rather than a wider border, so the card keeps its size and nothing shifts
     when a session starts or stops waiting. */
  li.line.card.blocked {
    background: var(--blocked-bg); border-color: var(--blocked-border);
    box-shadow: inset 0 0 0 2px var(--blocked-border);
  }
  li.line.card.blocked > button.row .label { color: var(--blocked-text); }
  /* Teammates, subagents and shells sit inside the card, one line each,
     each joined to the session by an elbow. */
  .children { margin: 0 0 4px; }
  .children button.row {
    /* A subagent's own subagent sits one step in: its elbow drops from the
       centre of the mark on the row above. */
    --nest: calc(var(--depth, 0) * (var(--elbow) + 6px + var(--mark) / 2));
    padding: 3px var(--row-pad) 3px calc(var(--child-indent) + var(--nest)); min-height: 22px;
    /* The dots' ink is two pixels in an eight-pixel slot, so the name sits
       closer than the session's own gap would put it. */
    gap: 6px;
    /* Where the name's line sits: the row's own top padding plus half a
       14px line. The mark and the elbow both meet it, so a child row that
       grows a second line does not leave them stranded in the middle. */
    --name-mid: 10px;
  }
  .children button.row > .busy,
  .children button.row > .swatch,
  .children button.row > .shell-mark {
    align-self: flex-start; margin-top: calc(var(--name-mid) - 3px - var(--mark) / 2);
  }
  /* The elbow joins two marks, so it is derived from where they are: it
     drops from the centre of the parent's branch icon and runs to the left
     edge of the child's mark. */
  .children button.row::before {
    content: ""; position: absolute; top: 0; bottom: calc(100% - var(--name-mid));
    left: calc(var(--child-drop) + var(--nest)); width: var(--elbow);
    border-left: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
    border-bottom-left-radius: 3px;
  }
  /* A blocked card's 3px edge moves the session's icons 2px in, and its
     own row pays that back; the children do the same. */
  /* Every child's mark keeps a hair of air from the edge the elbow ends
     on: the dots, a swatch, a tick and the shell glyph alike. */
  .children button.row > :is(.busy, .swatch, .done-mark, .mi):first-child { margin-left: 6px; }
  /* A finished subagent: kept in place until the next prompt, and quiet. */
  /* Drawn, not typed: a text tick's ink sits on its baseline, below the
     middle of the slot the elbow points at. */
  .done-mark { display: block; width: var(--mark); height: var(--mark); flex-shrink: 0; fill: var(--lit); }
  .children button.row.finished .stack { opacity: .5; }
  /* What a subagent is doing, in the activity's face, on its own line. */
  .children button.row .sub-doing {
    max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    font: 400 11px/1.3 -apple-system, sans-serif; color: var(--lit-ink);
  }
  li.line.card.blocked .children button.row { padding-left: calc(var(--child-indent) + var(--nest) - 2px); }
  li.line.card.blocked .children button.row::before { left: calc(var(--child-drop) + var(--nest) - 2px); }
  /* A card's background shells, folded into one line that opens them. */
  .shell-sum {
    display: flex; align-items: center; gap: 6px; width: calc(100% - 20px);
    margin: 0 10px 6px; padding: 5px 0 0; min-height: 24px;
    border: 0; border-top: 1px dotted var(--card-border); background: none;
    font: 400 11px/1 -apple-system, sans-serif; color: var(--dim);
    text-align: left; cursor: default;
  }
  .shell-sum:hover { color: var(--fg); }
  .shell-sum.quiet { opacity: .7; }
  .shell-sum.quiet:hover { color: var(--dim); }
  .shell-sum .mi { width: 10px; height: 10px; }
  .shell-sum .chev { margin-left: auto; transition: transform .15s ease-out; }
  .shell-sum[aria-expanded="true"] .chev { transform: rotate(90deg); }
  li.line.card.blocked .shell-sum { border-top-color: color-mix(in srgb, var(--blocked-border) 40%, transparent); }
  .shell-sum[aria-expanded="true"] { margin-bottom: 2px; }
  /* Shell rows hang off the summary line, so their elbow drops from its
     10px terminal icon, which sits 10px in. */
  .children.shell-rows {
    --child-drop: 15px; --child-indent: calc(var(--child-drop) + var(--elbow));
    margin-bottom: 6px;
  }
  li.line.card.blocked .children.shell-rows button.row { padding-left: var(--child-indent); }
  li.line.card.blocked .children.shell-rows button.row::before { left: var(--child-drop); }
  .children button.row .label { font-size: 12px; }
  /* A background shell sits under its session like a subagent, marked with
     the terminal glyph where a subagent has its dots, labelled with the
     command in the branch line's face. */
  /* A shell row is one line, so its elbow meets the middle of the row,
     where the glyph and the command both are; the glyph is narrower than
     the dots' slot, so the command sits closer to it. */
  .children button.row.bg-shell { --name-mid: 13px; gap: 4px; }
  /* The command's letters sit a hair below the row's middle in this face,
     so the glyph and the elbow both meet them there, not the middle. */
  .children button.row.bg-shell .mi { width: var(--mark); height: var(--mark); opacity: .55; margin-top: 2px; }
  .children button.row.bg-shell .label {
    font: 400 10px/1.2 ui-monospace, Menlo, monospace;
    color: var(--fg); opacity: .72;
  }

  /* Vibrancy, the way a native menu sits over its window: a translucent slab
     that samples what is behind it rather than a flat card pasted on top.
     Opened by a right-click, so `left` and `top` are set to the pointer. */
  .menu {
    position: absolute; z-index: 30;
    display: flex; flex-direction: column; min-width: 116px; padding: 4px;
    border-radius: 10px;
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    backdrop-filter: saturate(180%) blur(20px);
    border: .5px solid color-mix(in srgb, var(--fg) 14%, transparent);
    box-shadow:
      0 0 0 .5px color-mix(in srgb, var(--fg) 5%, transparent),
      0 8px 28px -6px color-mix(in srgb, var(--fg) 34%, transparent),
      0 2px 6px -2px color-mix(in srgb, var(--fg) 18%, transparent);
    transform-origin: top left;
  }
  @media (prefers-reduced-motion: no-preference) {
    /* Scale from the corner at the pointer, so it reads as unfolding from the
       click rather than appearing beside it. */
    .menu { animation: unfold .14s cubic-bezier(.32, .72, 0, 1); }
    .menu.kept { animation: none; }
    @keyframes unfold {
      from { opacity: 0; transform: scale(.92) translateY(-3px); }
      to   { opacity: 1; transform: none; }
    }
  }

  /* A shell's whole command, opened by clicking its row. The menu's slab,
     hung under the row and as wide as the indent allows, with text that can
     be selected, unlike the rest of the panel. */
  .shell-pop {
    left: 6px; right: 6px; min-width: 0;
    gap: 8px; padding: 8px;
  }
  .shell-pop .cmd { display: flex; flex-direction: column; gap: 4px; }
  .shell-pop .cmd + .cmd { border-top: .5px solid var(--rule); padding-top: 8px; }
  .shell-pop code {
    font: 400 10px/1.35 ui-monospace, Menlo, monospace; color: var(--fg);
    white-space: pre-wrap; word-break: break-all;
    max-height: 40vh; overflow-y: auto;
    -webkit-user-select: text; user-select: text;
  }
  .shell-pop button { align-self: flex-end; }

  /* The hover card. Same slab as the menu, so the panel keeps one vocabulary
     for "something floating above the list". */
  #card {
    /* top/left stay at zero and the transform does the moving, so following
       the pointer never triggers a layout. */
    position: fixed; top: 0; left: 0; will-change: transform;
    z-index: 60; width: 208px; padding: 8px 10px 7px;
    border-radius: 11px; pointer-events: none;
    background: color-mix(in srgb, var(--bg) 86%, transparent);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    backdrop-filter: saturate(180%) blur(20px);
    border: .5px solid color-mix(in srgb, var(--fg) 14%, transparent);
    box-shadow:
      0 0 0 .5px color-mix(in srgb, var(--fg) 5%, transparent),
      0 10px 30px -8px color-mix(in srgb, var(--fg) 36%, transparent),
      0 2px 6px -2px color-mix(in srgb, var(--fg) 18%, transparent);
  }
  @media (prefers-reduced-motion: no-preference) {
    /* Opacity only. A scale or slide on something that chases the pointer
       reads as the card struggling to keep up. */
    #card { animation: cardin .09s linear; }
    @keyframes cardin { from { opacity: 0; } to { opacity: 1; } }
  }
  #card .who {
    font: 600 12.5px/1.25 -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--fg); letter-spacing: -.02em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #card .sub {
    margin-top: 1px; font: 500 10px/1.3 ui-monospace, Menlo, monospace;
    color: var(--dim);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* Two columns of label/value. A table reads faster than sentences when
     every row is a measurement. */
  #card .grid {
    display: grid; grid-template-columns: 1fr auto; gap: 2px 10px;
    margin-top: 6px; padding-top: 6px;
    border-top: .5px solid color-mix(in srgb, var(--fg) 11%, transparent);
    font: 500 11px/1.5 -apple-system, BlinkMacSystemFont, sans-serif;
  }
  /* Label, then its note pushed to the right of the same cell. One line per
     row whether a note is there or not, so the rows keep a rhythm. */
  #card .grid dt {
    color: var(--dim); display: flex; align-items: center; gap: 4px;
    min-width: 0;
  }
  #card .grid dt svg { width: var(--meta-icon); height: var(--meta-icon); opacity: .75; }
  #card .grid dd {
    margin: 0; text-align: right; color: var(--fg);
    font-variant-numeric: tabular-nums; min-width: 58px;
  }
  /* A gauge, not a number. Context, the five-hour window and the week are all
     budgets being spent, and a bar answers "how much is left" before the
     digits are read. Everything else in the card is a fact, not a budget, and
     stays plain -- a bar behind a dollar amount would measure nothing. */
  /* The fill sits behind the figure rather than as a rule beneath it. A rule
     needed a row of its own, which pushed every note onto a second line and
     left the card ragged: rows with notes were twice the height of rows
     without, so nothing aligned. A fill occupies no height and still says
     how much is gone. */
  #card .gauge {
    position: relative; isolation: isolate;
    padding: 1px 4px; margin-right: -4px; border-radius: 3px;
  }
  #card .gauge::before {
    content: ""; position: absolute; inset: 0 auto 0 0; z-index: -1;
    width: var(--fill); border-radius: 3px; background: var(--tint);
  }
  #card .gauge.low  { --tint: color-mix(in srgb, var(--lit) 16%, transparent); }
  #card .gauge.mid  { --tint: color-mix(in srgb, var(--warn) 20%, transparent); }
  #card .gauge.high {
    --tint: color-mix(in srgb, var(--alert) 22%, transparent);
    color: var(--alert); font-weight: 700;
  }
  /* Its own column, between label and figure, so it qualifies the number
     without taking a line from it. */
  #card .grid .note {
    margin-left: auto; padding-left: 6px;
    font: 400 9px/1.5 -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--dim); opacity: .8; white-space: nowrap;
  }
  #card .grid .note.urgent { color: var(--alert); }
  /* Flags are on or they are absent. A row saying "Fast mode: off" spends a
     line to say nothing happened. */
  #card .flags {
    display: flex; flex-wrap: wrap; gap: 3px; margin-top: 7px;
  }
  #card .flag {
    padding: 2px 6px; border-radius: 5px;
    font: 600 10px/1.35 -apple-system, sans-serif; letter-spacing: .02em;
    text-transform: uppercase;
    color: var(--fg);
    background: color-mix(in srgb, var(--fg) 9%, transparent);
  }
  #card .flag.hot { color: var(--accent-ink); background: var(--hot); }
  #card .flag.warn { color: var(--warn); background: var(--warn-bg); }
  /* Effort is how much a turn spends, so it reads on the same ramp as the
     gauges: calm when it is cheap, warm when it is not. Soft tints, because
     this is a setting the user chose and not something going wrong. */
  #card .flag.effort.low {
    color: var(--lit); background: color-mix(in srgb, var(--lit) 14%, transparent);
  }
  #card .flag.effort.medium {
    color: var(--hot); background: color-mix(in srgb, var(--hot) 13%, transparent);
  }
  #card .flag.effort.high {
    color: var(--warn); background: color-mix(in srgb, var(--warn) 15%, transparent);
  }
  #card .flag.effort.max, #card .flag.effort.xhigh {
    color: var(--alert); background: color-mix(in srgb, var(--alert) 16%, transparent);
  }

  .menu button {
    font: 500 12.5px/1 -apple-system, BlinkMacSystemFont, sans-serif;
    text-align: left; color: var(--fg); background: none; border: 0;
    border-radius: 6px; padding: 6px 9px; cursor: default; min-height: 24px;
    letter-spacing: -.02em; white-space: nowrap;
  }
  .menu button:hover { background: var(--hot); color: var(--accent-ink); }
  .menu button:focus-visible {
    outline: 1px solid var(--hot); outline-offset: -1px;
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--hot) 22%, transparent);
  }
  .menu button.danger:hover { background: var(--alert); }
  /* /clear cannot be undone, so it takes a second, deliberate click. */
  .menu button.armed { color: var(--alert); font-weight: 700; }
  .menu button.armed:hover { background: var(--alert); color: var(--accent-ink); }
  .menu .sep {
    height: .5px; margin: 3px 6px;
    background: color-mix(in srgb, var(--fg) 13%, transparent);
  }
  button.row {
    /* center, not baseline: an SVG's baseline is its bottom edge, so an
       icon aligned that way rides high against the text's optical centre,
       and the 10px mono position and 12px sans label then compound it. */
    display: flex; gap: var(--row-gap); align-items: center; width: 100%;
    /* >=24px hit target even though the text is 12px. */
    min-height: 30px; padding: 5px var(--row-pad);
    background: none; border: 0; border-radius: 0;
    font: inherit; color: inherit; text-align: left;
    /* Arrow, not the pointing hand: this is a native list in a terminal's
       toolbelt, and macOS reserves the hand for links. */
    cursor: default;
    touch-action: manipulation;
  }
  button.row:hover { background: var(--tint-row); }
  button.row:focus-visible {
    outline: 1px solid var(--hot); outline-offset: -1px;
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--hot) 22%, transparent);
  }
  /* min-width:0 is what lets this shrink at all. A flex child defaults to
     min-width:auto, meaning content size, so flex:1 alone will not let the
     text truncate -- the row just grows and the panel scrolls sideways.
     Adding the status word pushed rows past 250px and did exactly that. */
  /* A name too long for the row fades out at the edge instead of ending in
     an ellipsis: the dots read as characters of the path, and a path cut at
     "sideb..." looks like a name nobody chose. */
  .label {
    max-width: 100%; line-height: 1.2;
    overflow: hidden; white-space: nowrap;
    -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 26px), transparent);
            mask-image: linear-gradient(90deg, #000 calc(100% - 26px), transparent);
  }
  /* The mask costs nothing when the text fits, but it would still fade the
     last word of a short name, so it only applies to a label that overflows. */
  .label:not(.clipped) { -webkit-mask-image: none; mask-image: none; }
  /* The model's mark is its provider's, in the provider's colour. */
  .model .provider { width: var(--meta-icon); height: var(--meta-icon); flex-shrink: 0; fill: currentColor; }
  .model .provider.claude { fill: #d97757; opacity: 1; }
  /* Which agent a card runs, after its name: a pill in a tint of the agent's
     colour. The glyph wears the colour itself; the words wear a deeper ink of
     it, since the brand orange and green sit near 3:1 on a white card. */
  .ptag {
    display: inline-flex; align-items: center; gap: 3px; margin-left: 7px; padding: 2px 6px 2px 4px;
    border-radius: 5px; vertical-align: 1.5px; letter-spacing: 0;
    font: 600 10px/1 -apple-system, sans-serif; color: var(--ink, var(--dim));
    background: color-mix(in srgb, var(--agent) 12%, transparent);
  }
  .ptag svg { width: 10px; height: 10px; flex: none; fill: var(--agent); }
  /* Or alone in the row's top corner, the one place every card has, however
     many lines it runs to. The name and the state badge move over for it. */
  button.row > .pcorner {
    position: absolute; right: 10px; top: 7px; width: 15px; height: 15px; fill: var(--agent);
  }
  button.row.cornered { --corner: 22px; }
  button.row.cornered .label { padding-right: var(--corner); }
  /* Or as a head over the cards of one agent. */
  #groups li.phead {
    display: flex; align-items: center; gap: 5px; margin: 10px 4px 5px; list-style: none;
  }
  #groups li.phead:first-child { margin-top: 0; }
  #groups li.phead svg { width: 11px; height: 11px; fill: var(--agent); }
  #groups li.phead h3 {
    margin: 0; font: 700 10px/1 -apple-system, sans-serif; letter-spacing: .06em;
    text-transform: uppercase; color: var(--dim);
  }
  #groups li.phead .n { font: 500 10px/1 -apple-system, sans-serif; color: var(--dim); }

  /* Silence, plus one exception. The panel is read from the corner of an eye,
     and its only question is "is anything waiting on me". So a row that needs
     nothing is quiet, and every channel that carries weight -- contrast, a
     coloured spine, a word, motion -- is spent on the rows that do. */
  button.row { position: relative; color: var(--dim); scroll-margin-block: 16px; }
  button.row.hot { color: var(--fg); }
  /* Blocked is the only state that wants you, so its name carries weight -- a
     row you can pick out without reading the badge. */
  button.row.hot .label { font-weight: 650; }
  /* A name carries the card: dark and semibold while the session is doing
     something, grey once it rests, so activity reads before any word does. */
  button.row .label {
    color: var(--fg); font-weight: 600; font-size: 13.5px;
    letter-spacing: -.02em;
  }
  button.row.quiet .label { color: var(--dim); font-weight: 500; }
  .children button.row .label { font-weight: 500; }

  /* Identity: a 5px swatch, never the ground. Hollow when the state is a claim
     nobody is alive to back, so fail-loud survives without a whole element. */
  /* Name over model, sharing one left edge. Removed by accident with a
     neighbouring rule, which concatenated the two into "symopus-5". */
  .stack {
    flex: 1; min-width: 0; display: flex; flex-direction: column;
    gap: 1px; align-items: flex-start;
  }
  .model {
    display: flex; align-items: center; gap: 5px; max-width: 100%;
    font: 400 10px/1 ui-monospace, Menlo, monospace; color: var(--dim);
    overflow: hidden; padding-block: .2em; margin-block: -.2em;
  }
  /* The mark belongs to the name, so on a card carrying a report it sits
     against the name and the task title rather than the middle of four
     lines: half of 15px name + 1px gap + 14px title, less half the mark. */
  button.row:has(.task) > .swatch,
  button.row:has(.task) > .busy,
  button.row:has(.task) > .shell-mark { align-self: flex-start; margin-top: 11px; }
  /* Air above the facts line, but only where a report stands between it and
     the name: a child row or a card with no report is two lines and needs
     none. Its own rule because `margin-block` above is a shorthand, so a
     margin-top set beside it is overwritten by the -.2em that cancels the
     padding, and the line ends up against what it follows. */
  button.row:has(.task) > .stack > .model { margin-top: 9px; }
  /* The tab's own title, in the panel's face rather than the terminal's. */
  .model > .title { font: 500 10px/1 -apple-system, sans-serif; }
  /* What the session says it is doing: its own words, so the panel's face
     rather than the monospace of the facts line; each line cut, not wrapped.
     A report nobody refreshed for five minutes reads as stale, greyed. */
  .task { max-width: 100%; align-self: stretch; display: flex; flex-direction: column; gap: 6px; }
  .task > span {
    max-width: 100%; display: flex; align-items: baseline; gap: 5px;
    font: 400 11px/1.3 -apple-system, sans-serif; color: var(--dim);
  }
  .task .task-title, .task .task-activity {
    flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .task .task-age, .task .task-stale, .task .task-done { flex: none; }
  /* The name leads; the task is what the name is busy with, so it reads a
     step back from it rather than as a second heading. */
  .task .task-title { color: var(--dim); font-weight: 500; }
  .task .task-status > * + *::before { content: "\00b7"; margin-right: 5px; }
  /* The estimate as a hairline under the report, in the session's own colour:
     a figure to glance at rather than read. Not the meters' green-amber-red,
     which would call being nearly finished a warning. */
  /* The estimate as a row of ticks, the done ones green: a count to glance
     at, not a gauge. The foot's limit meters are solid track-and-fill bars in
     a green-amber-red ramp, and this must not be read as one of those -- being
     nearly finished is not being near a limit. */
  .task .task-bar {
    display: block; height: 3px; margin-top: 2px; overflow: hidden;
    background: color-mix(in srgb, var(--fg) 16%, transparent);
    -webkit-mask-image: var(--tick-mask); mask-image: var(--tick-mask);
    --tick-mask: repeating-linear-gradient(90deg, #000 0 3px, transparent 3px 6px);
  }
  .task .task-bar-fill { display: block; height: 100%; background: var(--lit); }
  /* Only the mark is nudged onto the x-height; shifting the whole group
     took the age's digits off the line's baseline with it. */
  .task .task-age .mi {
    display: inline-block; width: var(--meta-icon); height: var(--meta-icon);
    vertical-align: -1px; margin-right: 3px;
  }
  /* What it is doing right now wears the same green as the ticks below it,
     so one accent carries one idea: this is the live part of the report. */
  .task .task-activity { color: var(--lit-ink); }
  .task.stale > span { opacity: .7; }
  .task .task-done { color: var(--sev-ok); font-weight: 600; }
  /* The ellipsis goes on the text, not the chip. A chip is a flex box, and
     text-overflow does nothing for the loose text inside a flex box -- the
     text was simply cut, "cs/unity-studi" with no sign anything was missing. */
  .mchip {
    display: inline-flex; align-items: center; gap: 3px;
    min-width: 0; white-space: nowrap;
  }
  /* overflow:hidden clips to the box, and at line-height 1 the box ends above
     the descenders ("gpt" lost its tails). The padding makes room for them and
     the negative margin keeps the line as tall as it was; the line above does
     the same, since it clips too. */
  .mchip > .mtext { min-width: 0; overflow: hidden; text-overflow: ellipsis;
                    padding-block: .2em; margin-block: -.2em; }
  /* The branch alone gives way when the line is too long. The model, the
     effort letter and the context figure never shrink: a model name is short
     and loses its meaning first ("Fable 5..." is which Fable?), and a clipped
     "8" is a different number. Weighted shrinking still took two pixels from
     the model, which is enough for a monospace name to earn its ellipsis. */
  /* Never down to a bare icon, which reads as a branch with no name. */
  /* Six characters at most: a name shorter than that needs no more room than
     it has. */
  .mchip.branch { flex-shrink: 1; min-width: calc(var(--meta-icon) + 3px + var(--floor, 6) * 1ch); }
  .mchip.model-name, .mchip.ctx, .mchip.heavy { flex-shrink: 0; }
  /* A dim middot opens every item after the first; the effort letter belongs
     to its model and gets none. Inside the chip, so it goes with its item. */
  .model > .mchip ~ .mchip::before { content: "\00b7"; margin-right: 2px; opacity: .6; }
  /* Slightly above the text's optical centre, where a 9px glyph sits level
     with lowercase rather than with the baseline. */
  /* Effort as one or two letters after the model, in the colours Claude
     Code's /effort picker uses, as cs-statusline draws them. Max takes the
     first and last stops of the picker's gradient, one per letter. */
  :root {
    --effort-low: #966c1e; --effort-medium: #2c7a39; --effort-high: #5769f7;
    --effort-xhigh: #8700ff; --effort-max-1: #82aadc; --effort-max-2: #c882b3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --effort-low: #bb9f6d; --effort-medium: #76a97e; --effort-high: #929efa;
      --effort-xhigh: #b159ff; --effort-max-1: #aec8e8; --effort-max-2: #dbaece;
    }
  }
  /* Sits against the model it qualifies: the line's 5px gap, less 1. */
  .effort { margin-left: -1px; font-weight: 600; flex-shrink: 0; }
  /* Brackets in the line's own faded grey, so only the letter carries the colour. */
  .effort::before { content: "["; color: var(--dim); font-weight: 400; }
  .effort::after { content: "]"; color: var(--dim); font-weight: 400; }
  .effort.low { color: var(--effort-low); }
  .effort.medium { color: var(--effort-medium); }
  .effort.high { color: var(--effort-high); }
  .effort.xhigh { color: var(--effort-xhigh); }
  .effort.max i { font-style: normal; color: var(--effort-max-1); }
  .effort.max i + i { color: var(--effort-max-2); }
  .mi { width: var(--meta-icon); height: var(--meta-icon); flex-shrink: 0; display: block; opacity: .85; }

  /* One slot, whatever it draws. The mark is the leftmost thing on a row, so
     its width sets where the label starts: an 11px box for all of them, with
     the square painted inside rather than by it. Measured before this: the
     label sat at 26.4px beside a swatch, 31.9 beside the working dots and 23.1
     beside a subagent's, so every row twitched sideways whenever a session
     changed state. */
  /* Every mark paints the same 8px square of ink, centred in the same slot.
     Choosing an alignment could not fix this on its own: a 6px square and a
     13px dot cluster share neither a left edge nor a midpoint, so lining up
     one guarantees the other is out. Equal widths make left, centre and right
     agree at once, which is the only way the column reads straight. Three dots
     need most of that width in gaps, so the dot is small and the square grew
     to meet it. */
  /* One place the row's horizontal rhythm is decided. The connector
     between a subagent and its parent is derived from these, so it
     cannot drift out of step with the marks it joins. */
  :root { --mark: 8px; --dot: 2px; --row-pad: 10px; --row-gap: 8px;
          --meta-icon: 9px; --elbow: 8px;
          --child-drop: calc(var(--row-pad) + var(--mark) + var(--row-gap) + var(--meta-icon) / 2);
          --child-indent: calc(var(--child-drop) + var(--elbow)); }
  .swatch, .busy {
    display: flex; align-items: center; justify-content: center;
    width: var(--mark); height: var(--mark); flex-shrink: 0;
  }
  .swatch { position: relative; }
  /* A command name, so it reads in the terminal's own face, as the branch and model do. */
  .job { font: 400 11px/1.2 ui-monospace, Menlo, monospace; }
  /* Takes the swatch's place. The glyph overflows the swatch-sized box by a
     few pixels to stay legible, and the box keeps the name where a swatch would. */
  .shell-mark { display: flex; width: var(--mark); height: var(--mark); flex-shrink: 0;
                align-items: center; justify-content: center; color: var(--hue, var(--dim)); }
  .shell-mark .mi { width: calc(var(--mark) + 3px); height: calc(var(--mark) + 3px); opacity: 1; }
  .swatch::before {
    content: ""; width: var(--mark); height: var(--mark); border-radius: 3px;
    background: var(--hue, var(--rule));
  }
  .busy { gap: calc((var(--mark) - 3 * var(--dot)) / 2); }
  /* Without flex-shrink the dots gave way to whatever box they were in, and
     the working indicator was quietly thinner than the stylesheet drew it. */
  .busy i {
    width: var(--dot); height: var(--dot); border-radius: 50%; flex-shrink: 0;
    background: var(--hue, var(--dim)); opacity: .55;
  }
  /* A subagent stacks its dots instead of laying them out in a row, so a
     working child reads as a child at a glance rather than only by its
     indent. Same footprint, different axis. */
  .busy.down { flex-direction: column; gap: 1.5px; width: var(--mark); }
  /* In a chip the dots stand for the teammates, not for this row, so they
     take the meta line's ink rather than the session's own colour. */
  .mchip.kids .busy i { background: currentColor; opacity: .75; }
  /* A teammate wears the badge colour Claude Code spawned it with, which is
     its own and not its parent's, so it names which teammate this is rather
     than repeating the session above. Grey when it was given none. */
  .busy i { background: var(--hue, var(--dim)); }
  button.row.child .swatch::before { background: var(--hue, var(--dim)); }
  button.row.child .swatch:not([style*="--hue"])::before { opacity: .55; }

  @media (prefers-reduced-motion: no-preference) {
    /* transform and opacity only: no layout work per frame. */
    .busy i { animation: bob 1.1s ease-in-out infinite; }
    /* Down the stack it only cascades: light running through the dots, with
       nothing moving. A child sits in a narrower slot than its parent, and
       travel there reads as a wobble. */
    .busy.down i { animation-name: cascade; }
    @keyframes cascade {
      0%, 100% { opacity: .2; }
      50%      { opacity: 1; }
    }
    .busy i:nth-child(2) { animation-delay: .14s; }
    .busy i:nth-child(3) { animation-delay: .28s; }
    @keyframes bob {
      0%, 100% { opacity: .25; transform: translateY(0); }
      50%      { opacity: 1;   transform: translateY(-2px); }
    }
  }

  .swatch.hollow::before {
    background: none; box-shadow: inset 0 0 0 1.5px var(--dim);
  }


  /* A word, not only a glyph: a glyph alone makes you learn a legend. */
  .word {
    font: 700 9px/1 ui-monospace, Menlo, monospace; letter-spacing: .07em;
    text-transform: uppercase; padding: 3px 5px; border-radius: 3px;
    flex-shrink: 0;
  }
  /* A solid amber badge, the one filled shape on the panel. It sits on the
     name's line only: as a flex column it took its width out of the details
     line too, and at larger text sizes that cut the context figure off. */
  .word.blocked { color: var(--badge-ink); background: var(--blocked-border); font-family: -apple-system, sans-serif; }
  button.row.hot > .word.blocked { position: absolute; top: 6px; right: calc(10px + var(--corner, 0px)); }
  button.row.hot .label { padding-right: calc(62px + var(--corner, 0px)); }
  /* Idle is the resting state, so its badge is an outline in the dim ink: it
     says the session is free for a prompt without competing with "waiting". */
  .word.idle { color: var(--dim); box-shadow: inset 0 0 0 .5px var(--dim);
    font-family: -apple-system, sans-serif; font-weight: 600; }
  button.row.resting > .word.idle { position: absolute; top: 6px; right: calc(10px + var(--corner, 0px)); }
  /* A highlight sweeps through the letters: the dim ink stays the base and a
     band of light passes over it, towards white in either theme. The page rebuilds rows on every
     update, so each badge starts at the point the clock says the sweep has
     reached, and every badge sweeps in step. */
  @media (prefers-reduced-motion: no-preference) {
    .word.idle, .shimmer {
      --spread: calc(3ch + 40px);
      --light: color-mix(in srgb, var(--dim) 35%, #fff);
      background: linear-gradient(110deg,
                  var(--dim) calc(50% - var(--spread)),
                  color-mix(in srgb, var(--light), var(--dim)) calc(50% - var(--spread) * .5),
                  var(--light) 50%,
                  color-mix(in srgb, var(--light), var(--dim)) calc(50% + var(--spread) * .5),
                  var(--dim) calc(50% + var(--spread)))
                  0 0 / calc(200% + var(--spread) * 2) 100% no-repeat;
      -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: idle-shimmer 2s linear infinite; animation-delay: var(--shimmer-delay, 0ms);
    }
    /* Glyph descenders sit below a line-height of 1, where the clipped
       background would cut them off. */
    .shimmer { line-height: normal; }
    @keyframes idle-shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }
    .shell-sum:hover .shimmer { animation: none; background: none; color: inherit; }
  }
  button.row.resting .label { padding-right: calc(40px + var(--corner, 0px)); }
  /* A turn that has run long enough to be worth a look: warm outline, no fill,
     so it stays below "waiting", which is the one state that needs you. */
  .word.long { color: var(--warn); box-shadow: inset 0 0 0 1px var(--warn);
    font-family: -apple-system, sans-serif; }
  button.row.long-turn > .word.long { position: absolute; top: 6px; right: calc(10px + var(--corner, 0px)); }
  button.row.long-turn .label { padding-right: calc(70px + var(--corner, 0px)); }


  /* Motion belongs to the exception. An earlier build spun the icon on
     "working", which is the state that means ignore me -- peripheral vision
     goes to movement first, so it pulled the eye to the rows needing nothing. */
  @media (prefers-reduced-motion: no-preference) {
    .word.blocked { animation: breathe 1.9s ease-in-out infinite; animation-delay: var(--breathe-delay, 0ms); }
  }
  @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }

  /* Context is a diagnosis, not a decision: nobody acts on 47% at a glance. */
  /* Context sits among the branch and the model, in their type, so the line
     reads as one sentence. Only the colour sets it apart, which is the whole
     point: it speaks at all only past the threshold, so its presence is
     already the signal and it does not need a second voice.
     flex-shrink: 0 because when the line runs out of room the branch is the
     part worth losing -- a number that only appears when it matters outranks
     a name you can read in the card. */
  .model .ctx { color: var(--alert); flex-shrink: 0;
                font-variant-numeric: tabular-nums; }
  .model .ctx.critical { font-weight: 700; }
  .model .heavy { color: var(--alert); }

  /* One timing scale, shared with the row menu, so the panel feels like one
     piece of software rather than parts that animate differently. */
  :root { --quick: 120ms; --enter: 180ms; --ease-out: cubic-bezier(.16,1,.3,1); }

  #bar {
    position: sticky; bottom: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
    margin: 14px 8px 0; padding: 4px 0 3px;
    border-top: .5px solid color-mix(in srgb, var(--fg) 14%, transparent);
    background: var(--bg);
  }
  #bar .tools { display: flex; gap: 2px; margin-left: auto; }
  /* The release this panel runs, and the one it could: the bar says nothing
     more than the number until the mirror has a newer one. */
  #release {
    display: flex; align-items: center; gap: 6px; min-width: 0;
    font: 400 10px/1 ui-monospace, Menlo, monospace; color: var(--dim);
    font-variant-numeric: tabular-nums; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  #release .take { flex: none; }
  #release .take {
    width: auto; height: 18px; padding: 0 7px; border-radius: 5px;
    font: 500 10px/1 -apple-system, sans-serif; color: #fff;
    background: color-mix(in srgb, AccentColor 92%, #000);
  }
  #release .take:hover { color: #fff; background: AccentColor; }
  #release .take:disabled { opacity: .5; }
  /* git's or install.sh's own words, one line of them: the rest is in the
     daemon's log. */
  #release .refused { color: var(--alert); min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  /* The list is the only thing that scrolls: the account meters and the bar
     are the panel's fixed foot, and a foot that scrolls away takes the
     numbers you are watching with it. */
  #groups {
    flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
    /* The fade says there is more list past the edge. It dissolves the rows
       themselves rather than laying a colour over them, so it works on any
       background; the depth of each edge follows the scroll position, and
       the edge you have reached goes crisp. */
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 var(--fade-top),
                                        #000 calc(100% - var(--fade-foot)), transparent 100%);
            mask-image: linear-gradient(to bottom, transparent 0, #000 var(--fade-top),
                                        #000 calc(100% - var(--fade-foot)), transparent 100%);
  }
  #groups::-webkit-scrollbar { width: 0; height: 0; }
  #bar button {
    width: 24px; height: 24px; padding: 0; cursor: default; border: 0;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 6px; background: none; color: var(--dim);
    font: 400 13px/1 -apple-system, sans-serif;
    transition: color var(--quick) ease, background var(--quick) ease;
  }
  #bar button svg { width: 14px; height: 14px; fill: currentColor; }
  #bar button:hover { color: var(--fg); background: var(--tint-ctl); }
  #bar button:focus-visible, .step button:focus-visible, .shell-sum:focus-visible,
  .shell-pop button:focus-visible, #budget .acct-name:focus-visible,
  #budget .acct-item-name:focus-visible, #budget .acct-add:focus-visible,
  #budget .acct-switch:focus-visible, #budget .acct-rename:focus-visible {
    outline: 1px solid var(--hot); outline-offset: 1px;
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--hot) 22%, transparent);
  }
  #gear[aria-expanded="true"] { color: var(--fg); background: var(--tint-ctl); }

  /* A drawer in the panel's foot, not a card floating over the list: edge to
     edge, no radius or shadow, one hairline where it meets the rows, and the
     gear bar below it in the same ground so the two read as one surface. */
  #settings {
    position: sticky; bottom: 28px; z-index: 19;
    max-height: calc(100vh / var(--scale) - 46px); overflow-y: auto;
    box-sizing: border-box; padding: 10px 12px 8px;
    background: color-mix(in srgb, var(--fg) 4%, var(--bg));
    border-top: .5px solid color-mix(in srgb, var(--fg) 14%, transparent);
    display: flex; flex-direction: column; gap: 9px;
  }
  /* With the drawer open the bar loses its margins, or the scrim shows
     through them: a dark frame at the sides, a dark band between the
     drawer's last line and the bar. */
  body:has(#settings:not([hidden])) #bar {
    background: color-mix(in srgb, var(--fg) 4%, var(--bg));

  /* Grid, not flex: the label column is minmax(0, 1fr), so it gives way
     instead of pushing the control off the panel. With flex the label kept a
     percentage basis and the row grew wider than the sheet at large text
     sizes. Three columns cover label, slider and read-out; a switch row
     leaves the last two empty and they collapse. */
  /* Each topic is a card, as each session is: the switch that governs it
     sits in the title, its options hang under a guide line and fold away
     when it is off. A plain row governs itself; one with options of its
     own folds them the same way. */
  .set-card {
    background: var(--card); border: 1px solid var(--card-border);
    border-radius: 8px; overflow: hidden;
  }
  .set-title {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px;
    font-size: 12.5px; font-weight: 600; color: var(--fg);
    letter-spacing: -.02em;
  }
  .set-title > span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .set-kids {

  }

  /* Grid, not flex: the label column is minmax(0, 1fr), so it gives way
     instead of pushing the control off the panel. With flex the label kept a
     percentage basis and the row grew wider than the sheet at large text
     sizes. Three columns cover label, slider and read-out; a switch row
     leaves the last two empty and they collapse. */
  .set {
    display: grid; grid-template-columns: minmax(0, 1fr) auto auto;
    align-items: center; gap: 4px 8px; font-size: 12px; position: relative;
  }

  .set > :not(span:first-child) { justify-self: end; }
  /* The last control reaches the final column, so a switch row does not
     keep the gap in front of an empty third column and its switch lines up
     with the one in the title. */
  .set > :last-child { grid-column-end: -1; }
  .set.plain {
    padding: 7px 10px;

  /* The guide: a line down from the title, an elbow into each option, in

  .set.child::before {
    content: ""; position: absolute; left: 12px; top: 0; bottom: 0;
    border-left: 1px solid color-mix(in srgb, var(--fg) 14%, transparent);
  }
  .set.child:last-child::before { bottom: 50%; }
  .set.child::after {
    content: ""; position: absolute; left: 12px; top: 50%; width: 6px;
    border-top: 1px solid color-mix(in srgb, var(--fg) 14%, transparent);
  }

  .set-kids > div > .set.child:last-child { padding-bottom: 8px; }

  /* One of a few words: the system's own menu, dressed as the stepper is. */

     whatever else is on the row. Under the grid that squeezed the label column
     past its own longest word, which overflow-wrap:anywhere then broke a

     row is a wrapping flex line instead: the label keeps its longest word and
     the control drops beneath it once the two no longer fit abreast, at any
     width and any text size, with no breakpoint to keep in step with the
     type scale.

     root stops @container matching at all above 1x in this WebKit -- measured

    -webkit-mask: repeating-linear-gradient(90deg, #000 0 3px, transparent 3px 6px);
    mask: repeating-linear-gradient(90deg, #000 0 3px, transparent 3px 6px);

    padding: 2px 5px; border-radius: 4px; background: var(--fg); color: var(--bg);
    font: 600 10px/1 ui-monospace, Menlo, monospace; opacity: 0; pointer-events: none;
    transition: opacity var(--quick);

  .val {
    font: 600 10px/1 ui-monospace, Menlo, monospace; color: var(--dim);
    min-width: 26px; text-align: right; font-variant-numeric: tabular-nums;
  }

  #empty { padding: 12px 10px; color: var(--dim); }

  /* Read, never seen. display:none would take it out of the accessibility
     tree along with the sight of it, and aria-describedby would say nothing. */

     takes its place while open. */
  #foot { position: sticky; bottom: 28px; z-index: 18; background: var(--bg); }
  body:has(#settings:not([hidden])) #foot { display: none; }

  /* The queue: who is waiting, oldest first, in the panel's foot where the
     eye lands after the list. Type only. The cards already carry the amber,
     so a second slab here would be the exception shouting twice. */
  #queue {

  .qrow {
    display: flex; align-items: center; gap: var(--row-gap); width: 100%;
    min-height: 24px; padding: 3px 2px; border: 0; border-radius: 5px;
    background: none; font: inherit; color: var(--fg); text-align: left;
    cursor: default;
  }
  .qrow:hover { background: var(--tint-row); }
  .qrow:focus-visible {
    outline: 1px solid var(--hot); outline-offset: -1px;
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--hot) 22%, transparent);
  }
  .qrow .label {
    flex: 1; min-width: 0; font-size: 12px; font-weight: 500;
    letter-spacing: -.02em;
  }
  .qrow .ago {
    flex-shrink: 0; font: 400 10px/1 ui-monospace, Menlo, monospace;
    color: var(--dim); font-variant-numeric: tabular-nums;
  }
  #queue .more {

  /* The account's budget, in the panel's foot. Quiet by default: grey

  #budget {
    margin: 0 8px; padding: 7px 0 1px;
    border-top: .5px solid color-mix(in srgb, var(--fg) 14%, transparent);
    background: var(--bg);

    font-variant-numeric: tabular-nums;

    align-items: center; gap: 6px; height: 15px;

  #budget .track {
    position: relative; height: 3px; border-radius: 1.5px;
    background: color-mix(in srgb, var(--fg) 12%, transparent);
  }
  #budget .fill {

    background: var(--sev-ok);

  /* claude-swap's bands: amber from 70%, red from 90%. */

  #budget .win.near .fill { background: var(--sev-crit); }
  #budget .win.near .pct, #budget .win.near.ahead .pct { color: var(--sev-crit); font-weight: 600; }

    margin-left: -.5px; background: var(--fg); opacity: .45;
  }

  #budget .acct-line {
    display: flex; align-items: center; justify-content: flex-start; gap: 6px;
    width: 100%; height: 17px; padding: 0; margin-bottom: 2px;
    border: 0; background: none; font: inherit; color: var(--dim); cursor: default;
  }
  #budget .acct-name { font-weight: 600; color: var(--fg); opacity: .85;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #budget .acct-name, #budget .acct-item-name {
    display: block; min-width: 0; max-width: 100%; padding: 0; border: 0; background: none;
    font: inherit; text-align: left; cursor: text; }
  #budget .acct-name { flex: 0 1 auto; font-weight: 600; }
  #budget button.acct-name:hover, #budget button.acct-item-name:hover { opacity: 1; }
  /* Brand colours: Claude's orange; OpenAI's mark is black, or white on dark. */
  #budget .provider { flex: none; width: 12px; height: 12px; }
  #budget .provider.claude { fill: #d97757; }
  #budget .provider.openai { fill: var(--fg); }
  #budget .acct-item-head { display: flex; align-items: center; gap: 6px; min-width: 0; height: 19px; }
  #budget .codex { margin-top: 10px; padding-top: 8px;
    border-top: .5px dotted color-mix(in srgb, var(--fg) 14%, transparent); }
  /* The login the sessions run on: a filled green check, not a word. */
  /* The brighter green of the ticks, not the meters' muted one: at 12px the

  #budget .acct-rename { width: 100%; height: 17px; box-sizing: border-box; padding: 0 3px;
    border: .5px solid color-mix(in srgb, var(--fg) 30%, transparent); border-radius: 3px;

  #budget .acct-status { height: 14px; line-height: 14px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }

     and the settings switch at two thirds, at the strip's right edge. */
  #budget .autosw { display: flex; align-items: center; justify-content: flex-end; gap: 5px;
    margin: 0 0 8px; font-size: 10.5px; line-height: 14px; color: var(--dim); }
  #budget .autosw .sw { width: 20px; height: 12px; border-radius: 6px; }

    color: var(--dim); font-variant-numeric: tabular-nums; }
  #budget .switched .sw-age .mi { width: 11px; height: 11px; }
  #budget .switched.pending { color: var(--dim); }
  #budget .switched.refused { color: var(--warn); }
  #budget .acct-list { margin-top: 10px; padding-top: 8px;
    border-top: .5px dotted color-mix(in srgb, var(--fg) 14%, transparent); }
  #budget .acct-item + .acct-item { margin-top: 12px; }

  #budget .acct-item .acct-status,

  #budget .acct-item-name { height: 15px; line-height: 15px; color: var(--fg); opacity: .75;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #budget .win .wl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #budget .acct-add {
    margin: 4px 0 2px; padding: 3px 7px; border-radius: 4px;
    border: .5px solid color-mix(in srgb, var(--fg) 22%, transparent);
    background: none; font: inherit; color: var(--fg); cursor: default;
  }

    display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px;

    background-image: linear-gradient(color-mix(in srgb, var(--switch-bg) 88%, #fff), var(--switch-bg));
    border: .5px solid color-mix(in srgb, var(--switch-bg) 70%, #000);
    /* The system accent is what every other button on this machine wears, so
       the panel wears it too wherever the keyword is understood. */

    border-color: color-mix(in srgb, AccentColor 60%, #000);

  #budget .acct-switch:hover { filter: brightness(1.06); }
  /* A push button darkens while held, it does not shrink. */

  /* Confirm is a different colour from Switch, not a darker one: the second

    background-image: linear-gradient(color-mix(in srgb, var(--switch-bg) 86%, #fff), var(--switch-bg));

// Rows are rebuilt on every update, so a shimmer starts where the clock says
// the sweep has reached; every shimmer on the page then sweeps in step.
// Matches the idle-shimmer animation duration in the CSS.
const SHIMMER_MS = 2000;
const BREATHE_MS = 1900;
function syncShimmer(el) {
  el.style.setProperty("--shimmer-delay", `-${Date.now() % SHIMMER_MS}ms`);
}

function syncBreathe(el) {

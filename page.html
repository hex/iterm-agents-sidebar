}
// Heartbeat is every 4s server-side. Two missed, plus a second of slack.
const STALE_AFTER_MS = 9000;
// Below this there is room to spare and nothing to decide.
// Overridden by the stored setting once it loads.
const CONTEXT_SPEAKS_AT = 40;
const speaksAt = () => SETTINGS?.context_threshold ?? CONTEXT_SPEAKS_AT;

// Everything in the panel is sized in px off one stylesheet, so one zoom on
// the root scales type, icons, gaps and hairlines together. Growing only the
// text would leave it rattling inside furniture that stayed put.
function applyScale(value) {
  const scale = Number(value);
  document.documentElement.style.setProperty(
    "--scale", Number.isFinite(scale) ? Math.max(0.8, Math.min(1.6, scale)) : 1);
}

let staleTimer = null;
let LATEST = {groups: []};

function markFresh() {
  document.body.classList.remove("stale");
  clearTimeout(staleTimer);
  staleTimer = setTimeout(() => document.body.classList.add("stale"), STALE_AFTER_MS);
}

function act(sessionId, verb, text) {
  fetch(`/action?token=${encodeURIComponent(TOKEN)}`, {
    method: "POST",
    body: JSON.stringify({session_id: sessionId, verb, text}),
  }).catch(err => console.log("sidebar: action failed", err));
}

// Offered only on a session that is idle and nearly full: a command typed into
// a session mid-turn lands in the middle of whatever it is doing, and on a
// session with room to spare there is nothing to fix.
const typed = cmd => row => act(row.session_id, "send", cmd + "\n");
// A command is typed as it stands, so each names the agents that have it.
const HOUSEKEEPING = [
  {label: "/compact", hint: "summarise the conversation and keep working",
   agents: ["claude", "openai", "omp"], run: typed("/compact")},
  {label: "/rotate", hint: "hand off to a fresh conversation", agents: ["claude"], run: typed("/rotate")},
  {label: "/clear", hint: "discard the conversation", destructive: true,
   agents: ["claude", "omp"], run: typed("/clear")},
];
// Every row can be closed, agent or not: it is the pane that goes.
const CLOSE = {label: "Close", hint: "close this pane", destructive: true,
               run: row => act(row.session_id, "close")};

// One menu at a time, and it closes on anything that means "not this". Two
// menus were open at once because opening one never told the others to shut.
let openMenu = null;
// Whose right-click menu is open, so a repaint can put that same menu back.
let openMenuKey = null;
function closeMenu() {
  if (!openMenu) return;
  openMenu.hidden = true;
  openMenu = null;
  openShellKey = null;
  openMenuKey = null;
}
document.addEventListener("pointerdown", () => { closeMenu(); hideCard(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeMenu(); });

// The hover card. One element reused by every row: a card per row would be
// dozens of blurred slabs in the layer tree for the one that is visible.
const card = Object.assign(document.createElement("div"), {id: "card"});
card.hidden = true;
document.body.append(card);
let cardTimer = null;

// Formatted here rather than in Python so they stay true between rebuilds:
// a countdown baked into a snapshot is wrong the moment it arrives.
function forHumans(seconds) {
  if (seconds == null) return null;
  const s = Math.max(0, Math.round(seconds));
  if (s < 60) return s + "s";
  if (s < 3600) return Math.round(s / 60) + "m";
  const hours = Math.floor(s / 3600);
  if (hours < 24) {
    const mins = Math.round((s % 3600) / 60);
    return mins ? `${hours}h ${mins}m` : `${hours}h`;
  }
  return Math.round(s / 86400) + "d";
}

const until = epoch =>
  epoch == null ? null : forHumans(epoch - Date.now() / 1000);

function fieldsFor(row) {
  const d = row.details || {};
  const pairs = [];
  const add = (icon, label, value) => {
    if (value === undefined || value === null) return;
    pairs.push({icon, label, value});
  };
  const gauge = (value, at) => value == null ? null : {
    percent: value,
    text: value + "%",
    // What the number is for: whether to wait for it or work around it.
    note: at ? "in " + until(at) : null,
  };
  add("gauge", "Context", gauge(row.context));
  add("clock", "5-hour", gauge(d.five_hour, d.five_hour_at));
  add("gauge", "Weekly", gauge(d.seven_day, d.seven_day_at));
  // Only a session that reads heavy carries these: the figure, and the
  // program in its tree that uses the most of it.
  const u = row.usage || {};
  if (u.cpu) add("cpu", "CPU", {percent: 100, text: u.cpu.percent + "%", note: u.cpu.top, alarm: true});
  if (u.memory) add("memory", "Memory", {percent: 100, text: u.memory.gb.toFixed(1) + " GB", note: u.memory.top, alarm: true});
  add("uptime", "Up", row.started_at == null ? null : forHumans(Date.now() / 1000 - row.started_at));
  add("shells", "Shells", row.shells?.length);
  add("model", "Subagents", row.agents);
  add("cost", "Cost", d.cost != null ? "$" + d.cost.toFixed(2) : null);
  // A warm cache is unremarkable. One about to expire, with a six-figure
  // rebuild behind it, is the most actionable number on the card.
  if (d.cache_hit != null) {
    const cold = d.cache_cold_at != null && d.cache_cold_at * 1000 < Date.now();
    add("cache", "Cache", {
      percent: d.cache_hit, text: d.cache_hit + "%", invert: true,
      note: cold ? (d.recache ? "cold, " + tokens(d.recache) + " to rebuild" : "cold")
                 : d.cache_cold_at ? "warm for " + until(d.cache_cold_at) : null,
      alarm: cold,
    });
  }
  if (d.lines_added || d.lines_removed) {
    add("lines", "Lines", `+${d.lines_added || 0} \u2212${d.lines_removed || 0}`);
  }
  return pairs;
}

const tokens = n =>
  n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? Math.round(n / 1e3) + "k" : String(n);

function showCard(row) {
  const d = row.details || {};
  const pairs = fieldsFor(row);
  // Nothing to say is better said by saying nothing.
  if (!pairs.length && !d.model) return;

  card.textContent = "";
  card.dataset.row = row.session_id;
  const who = Object.assign(document.createElement("div"), {className: "who"});
  who.textContent = d.session_name || row.label;
  card.append(who);

  if (d.model) {
    const sub = Object.assign(document.createElement("div"), {className: "sub"});
    sub.textContent = d.model;
    card.append(sub);
  }

  if (pairs.length) {
    const grid = Object.assign(document.createElement("dl"), {className: "grid"});
    for (const {icon, label, value} of pairs) {
      const dt = document.createElement("dt");
      if (icon) dt.append(metaIcon(icon));
      dt.append(document.createTextNode(label));

      // Inside the label cell, pushed right: a row stays one line whether it
      // carries a note or not.
      if (value && typeof value === "object" && value.note) {
        const note = document.createElement("span");
        note.className = "note" + (value.alarm ? " urgent" : "");
        note.textContent = value.note;
        dt.append(note);
      }

      const dd = document.createElement("dd");
      if (value && typeof value === "object") {
        // A budget: the bar carries how much is gone, the colour how much
        // that matters. Under 60 is nothing to look at.
        const pct = Math.max(0, Math.min(100, value.percent));
        // The cache reads the other way: a high hit ratio is the good end,
        // so its colours run in reverse.
        const heat = value.invert ? 100 - pct : pct;
        dd.className = "gauge " + (value.alarm || heat >= 90 ? "high"
                                 : heat >= 60 ? "mid" : "low");
        dd.style.setProperty("--fill", pct + "%");
        dd.textContent = value.text;
      } else {
        dd.textContent = value;
      }
      grid.append(dt, dd);
    }
    card.append(grid);
  }

  const flags = [];
  if (d.effort) flags.push([d.effort + " effort", "effort " + d.effort]);
  if (d.thinking) flags.push(["thinking", ""]);

  if (d.fast_mode) flags.push(["fast", "hot"]);
  // Says the conversation has passed 200k, not that the model has a big
  // window -- the subtitle already carries the model's size.
  if (d.beyond_200k) flags.push(["past 200k", "warn"]);
  if (flags.length) {
    const bar = Object.assign(document.createElement("div"), {className: "flags"});
    for (const [text, tone] of flags) {
      const f = Object.assign(document.createElement("span"),
                              {className: "flag" + (tone ? " " + tone : "")});
      f.textContent = text;
      bar.append(f);
    }
    card.append(bar);
  }

  card.hidden = false;
}

// Follows the pointer, but only downward-or-up and never sideways: the panel
// is 250px and the card is 208 of them, so horizontal freedom would just mean
// horizontal clipping. Vertical tracking is the part that helps, because it
// keeps the card next to the row being read rather than pinned to where the
// pointer first landed.
// Positioned by transform rather than top/left: the browser can move a
// composited layer without laying the page out again, which is what lets it
// keep up with the pointer instead of lagging a frame behind it.
function placeCard(x, y) {
  const w = card.offsetWidth;
  const h = card.offsetHeight;
  const pad = 4;
  // Below and to the right of the cursor, flipping to whichever side has
  // room. The card never covers the pointer, so the row stays readable.
  let left = x + 14;
  if (left + w > window.innerWidth - pad) left = x - w - 14;
  let top = y + 16;
  if (top + h > window.innerHeight - pad) top = y - h - 16;
  left = Math.max(pad, Math.min(left, window.innerWidth - w - pad));
  top = Math.max(pad, Math.min(top, window.innerHeight - h - pad));
  card.style.transform = `translate3d(${Math.round(left)}px, ${Math.round(top)}px, 0)`;
}

function hideCard() {
  clearTimeout(cardTimer);
  card.hidden = true;
}

function watchForCard(button, row) {
  // The row is carried on the element so one delegated listener can serve
  // every row. The old per-row version added a mousemove handler on each
  // mouseenter and removed none of them.
  button._row = row;
  button.addEventListener("focus", () => { showCard(row); atRow(button); });
  button.addEventListener("blur", hideCard);
}

// Anchored to a row rather than the pointer, for keyboard focus.
function atRow(button) {
  const box = button.getBoundingClientRect();
  placeCard(box.left + 12, box.bottom - 8);
}

// Which row the pointer is over right now, or null. The timer below reads it
// rather than trusting the row it was armed with: leaving the panel quickly
// used to let a card appear after the pointer had already gone, and since
// hiding depended on a further mousemove that was never coming, it stayed up
// until something else disturbed it.
let hoverRow = null;

// Long enough to need intent. A card that arrives while the pointer is merely
// passing over a row is noise, and at 110ms it arrived on every crossing --
// the panel is a list you scan, so most crossings mean nothing.
const CARD_DELAY_MS = 500;

function leaveRows() {
  hoverRow = null;
  hideCard();
}

// One listener for the whole list. Following the pointer means reading it on
// every move, so this must stay cheap: no layout reads beyond the card's own
// size, and no work at all when the pointer is not over a row.
document.addEventListener("mousemove", event => {
  const button = event.target.closest ? event.target.closest("button.row") : null;
  if (!button || !button._row) {
    leaveRows();
    return;
  }
  const row = button._row;
  hoverRow = row;

  if (!card.hidden && card.dataset.row === row.session_id) {
    placeCard(event.clientX, event.clientY);        // already up: just track
    return;
  }
  if (!card.hidden) {                               // sliding to another row
    showCard(row);                                  // swap contents, no wait
    placeCard(event.clientX, event.clientY);
    return;
  }
  clearTimeout(cardTimer);
  const {clientX, clientY} = event;
  cardTimer = setTimeout(() => {
    // Still the same row under the pointer, or the wait was for nothing.
    if (hoverRow !== row) return;
    showCard(row);
    placeCard(clientX, clientY);
  }, CARD_DELAY_MS);
}, true);

// Exit events, for when they arrive. mouseleave on document does not fire; it
// has to be the root element.
document.documentElement.addEventListener("mouseleave", leaveRows);
document.addEventListener("mouseout", event => {
  if (!event.relatedTarget) leaveRows();
}, true);
window.addEventListener("blur", leaveRows);
document.addEventListener("scroll", leaveRows, true);

// And the part that actually holds, because none of the above can be relied
// on. This page is a WKWebView embedded in a native toolbelt, and a pointer
// leaving that view often produces no event in the page at all -- the moves
// simply stop. A card shown on the way out then had nothing left to dismiss
// it and sat there until something else disturbed the page.
//
// So ask instead of waiting to be told: :hover is the browser's own hit test,
// which it maintains whether or not it sends us anything. Cheap enough to poll
// -- one selector match, and only while a card is actually up.
setInterval(() => {
  if (card.hidden) return;
  if (!document.querySelector("button.row:hover")) leaveRows();
}, 200);

// Returns the menu for a row. The row opens it on right-click, which
// also fires for Shift+F10 on a focused row, so the keyboard keeps a way in.
function menuFor(row, group) {
  // Every agent row carries the housekeeping commands, whatever it is doing.
  // The menu was once gated on idle and a high context figure, which meant
  // the control was missing at the moment you went looking for it. A shell
  // has no conversation to compact, so it gets Close alone.
  const items = group.name === "AGENTS"
    ? [...HOUSEKEEPING.filter(item => item.agents.includes(row.provider || "claude")), CLOSE]
    : [CLOSE];

  const menu = document.createElement("div");
  menu.hidden = true;
  menu.className = "menu";
  menu.setAttribute("role", "menu");

  items.forEach(({label, hint, destructive, run}, i) => {
    // A hairline before the destructive ones, so the pointer has to cross a
    // boundary to reach them rather than sliding into them.
    if (destructive && i && !items[i - 1].destructive) menu.append(Object.assign(
      document.createElement("div"), {className: "sep"}));

    const item = document.createElement("button");
    item.type = "button";
    item.setAttribute("role", "menuitem");
    item.textContent = label;
    item.title = hint;
    if (destructive) item.classList.add("danger");
    item.addEventListener("click", event => {
      event.stopPropagation();     // the row underneath focuses the session
      if (destructive && !item.classList.contains("armed")) {
        item.classList.add("armed");
        item.textContent = "click to confirm";
        setTimeout(() => {
          item.classList.remove("armed");
          item.textContent = label;
        }, 4000);
        return;
      }
      run(row);
      closeMenu();
    });
    menu.append(item);
  });

  menu.addEventListener("pointerdown", e => e.stopPropagation());
  return menu;
}

// Which shell's command is open, so a repaint can put it back. The list is
// rebuilt on every update, and a popover that vanished mid-read or mid-copy
// would be worse than having none.
let openShellKey = null;

function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(text);
  }
  const area = Object.assign(document.createElement("textarea"), {value: text});
  document.body.append(area);
  area.select();
  const ok = document.execCommand("copy");
  area.remove();
  return ok ? Promise.resolve() : Promise.reject(new Error("copy refused"));
}

// Every background shell of one session, each whole and each with its own
// Copy, under the card's summary line.
function shellPopover(shells) {
  const pop = document.createElement("div");
  pop.hidden = true;
  pop.className = "menu shell-pop";
  pop.setAttribute("role", "dialog");
  pop.setAttribute("aria-label", "background shell commands");
  for (const {command} of shells) {
    const entry = Object.assign(document.createElement("div"), {className: "cmd"});
    const code = document.createElement("code");
    code.textContent = command;
    const copy = document.createElement("button");
    copy.type = "button";
    copy.textContent = "Copy";
    copy.addEventListener("click", event => {
      event.stopPropagation();
      // Says what happened either way: a copy that silently failed would be
      // found out only at the paste.
      copyText(command).then(() => { copy.textContent = "Copied"; },
                             () => { copy.textContent = "Copy failed"; });
      setTimeout(() => { copy.textContent = "Copy"; }, 1500);
    });
    entry.append(code, copy);
    pop.append(entry);
  }
  pop.addEventListener("pointerdown", e => e.stopPropagation());
  return pop;
}

function openShell(pop, key) {
  closeMenu();
  hideCard();
  pop.classList.remove("kept");
  pop.hidden = false;
  openMenu = pop;
  openShellKey = key;
}

function openMenuAt(menu, li, event, key) {
  // Option-right-click keeps the WebView's own menu, for Reload and Inspect.
  if (event.altKey) return;
  event.preventDefault();
  closeMenu();
  hideCard();
  const box = li.getBoundingClientRect();
  // A keyboard-opened contextmenu reports no pointer; hang it off the row.
  const x = event.clientX || box.left + 12;
  const y = event.clientY || box.bottom;
  menu.hidden = false;
  // Clamp inside the panel, which is often narrower than row + menu.
  const maxX = document.documentElement.clientWidth - menu.offsetWidth - 4;
  menu.style.left = Math.max(4, Math.min(x, maxX)) - box.left + "px";
  menu.style.top = y - box.top + "px";
  menu.classList.remove("kept");
  openMenu = menu;
  openMenuKey = key;
  menu.querySelector("button").focus();
}

// The list is rebuilt whole on every update, so without this a row that
// appears shoves its neighbours down in one frame and one that leaves snaps
// them up. FLIP: measure every card and every line inside it before the
// rebuild, then play the change: what left fades out while cards resize and
// slide to where they are, and what arrived fades in as the move settles, so
// the eye reads one motion. Transform and opacity, plus a card's
// own height, which is the resize. Offsets, not client rects: the text-size
// control zooms the page, and engines disagree on whether a client rect is
// reported before or after that zoom.
const MOTION = window.matchMedia("(prefers-reduced-motion: no-preference)");
const MOVE = {duration: 180, easing: "cubic-bezier(.2,.8,.2,1)", id: "flip"};
const FADE = {duration: 120, easing: "ease-out", id: "flip"};

function measureRows() {
  // A snapshot that lands mid-motion would otherwise read heights and
  // offsets part way through the last change, and the next change would
  // start from there and jump. Settle the old one first.
  for (const a of document.getAnimations()) if (a.id === "flip") a.finish();
  const rows = new Map();
  for (const li of document.querySelectorAll("#groups li[data-key]")) {
    const lines = new Map();
    for (const el of li.querySelectorAll("[data-child-key]")) {
      lines.set(el.dataset.childKey, {el, top: el.offsetTop, holder: el.parentElement.className});
    }
    rows.set(li.dataset.key, {li, top: li.offsetTop, left: li.offsetLeft,
                              width: li.offsetWidth, height: li.offsetHeight, lines});
  }
  return rows;
}

function animateRows(before) {
  // The first paint has nothing to move from, and a list that fades in
  // row by row on open is ceremony.
  if (!MOTION.matches || !before.size) return;
  const cards = [...document.querySelectorAll("#groups li[data-key]")];
  const now = new Map(cards.map(li => [li.dataset.key, li]));

  // Plan first, so each beat knows whether the one before it happens at all.
  const leaving = [], entering = [], moving = [], resizing = [], lineMoves = [];
  for (const [key, old] of before) {
    const li = now.get(key);
    if (!li) { leaving.push({kind: "card", ...old}); continue; }
    const here = new Set();
    for (const el of li.querySelectorAll("[data-child-key]")) {
      const was = old.lines.get(el.dataset.childKey);
      here.add(el.dataset.childKey);
      if (!was) entering.push(el);
      else if (Math.abs(was.top - el.offsetTop) >= 1) lineMoves.push({el, dy: was.top - el.offsetTop});
    }
    for (const [childKey, line] of old.lines) {
      if (!here.has(childKey)) leaving.push({kind: "line", li, ...line});
    }
    const dy = old.top - li.offsetTop;
    if (Math.abs(dy) >= 1) moving.push({li, dy});
    if (Math.abs(old.height - li.offsetHeight) >= 1) resizing.push({li, from: old.height, to: li.offsetHeight});
  }
  for (const li of cards) if (!before.has(li.dataset.key)) entering.push(li);

  if (!leaving.length && !entering.length && !moving.length && !resizing.length && !lineMoves.length) return;
  // Beats overlap: what leaves fades while the rest is already moving, and
  // what arrives fades in over the move's last third, so one change reads
  // as one motion of about a quarter second rather than three in a row.
  const settleAt = 0;
  const shifts = moving.length || resizing.length || lineMoves.length;
  const arriveAt = shifts ? Math.round(MOVE.duration * 2 / 3) : (leaving.length ? FADE.duration / 2 : 0);

  // Beat one. A card that left is put back where it was, above the list; a
  // line that left is put back inside its card, in a holder with its old
  // parent's class so it keeps its indent. Both fade out there.
  for (const gone of leaving) {
    let node = gone.li;
    if (gone.kind === "card") {
      Object.assign(node.style, {position: "absolute", top: gone.top + "px", left: gone.left + "px",
                                 width: gone.width + "px", margin: 0, pointerEvents: "none", zIndex: 5});
      document.body.append(node);
    } else {
      // Out of the next measurement, or a repaint mid-fade would fade it twice.
      delete gone.el.dataset.childKey;
      node = Object.assign(document.createElement("div"), {className: gone.holder});
      Object.assign(node.style, {position: "absolute", top: gone.top + "px", left: 0, right: 0,
                                 margin: 0, pointerEvents: "none", zIndex: 1});
      node.append(gone.el);
      gone.li.append(node);
    }
    node.animate([{opacity: 1}, {opacity: 0}], {...FADE, fill: "forwards"})
      .finished.finally(() => node.remove());
  }

  // Beat two. Cards hold their old height through the fade, then ease to the
  // new one, clipped so a growing card never shows what has not arrived yet.
  // A worktree card's seam lies on and above its top edge, where overflow
  // would cut it, so that card is clipped by a shape open at the top.
  for (const {li, from, to} of resizing) {
    const clip = li.classList.contains("worktree") ? "clipPath" : "overflow";
    li.style[clip] = clip === "clipPath" ? "inset(-16px 0 0 0 round 0 0 8px 8px)" : "clip";
    li.animate([{height: from + "px"}, {height: to + "px"}], {...MOVE, delay: settleAt, fill: "backwards"})
      .finished.finally(() => { li.style[clip] = ""; });
  }
  for (const {li, dy} of moving) {
    li.animate([{transform: `translateY(${dy}px)`}, {transform: "none"}],
               {...MOVE, delay: settleAt, fill: "backwards"});
  }
  for (const {el, dy} of lineMoves) {
    el.animate([{transform: `translateY(${dy}px)`}, {transform: "none"}],
               {...MOVE, delay: settleAt, fill: "backwards"});
  }

  // The elastic seam: a docked worktree card whose pair moved, resized or
  // arrived has its dashed seam plucked.
  const stirred = new Set([...moving, ...resizing].map(m => m.li).concat(entering));
  for (const li of cards) {
    if (!li.classList.contains("worktree")) continue;
    if (stirred.has(li) || stirred.has(li.previousElementSibling)) pluck(li);
  }

  // Beat three.
  for (const el of entering) {
    el.animate([{opacity: 0}, {opacity: 1}], {...FADE, delay: arriveAt, fill: "backwards"});
  }
}

function render(snapshot) {
  const before = measureRows();
  paint(snapshot);
  paintQueue(snapshot);
  paintBudget(snapshot);
  fitMeta();
  paintSeams();
  paintVersion();
  animateRows(before);
}

// The dashed seam between a docked worktree card and the card it hangs
// from: a line across the card's top edge, bowed by `sag` pixels at its
// middle. Zero is the resting line, which looks like a dashed border.
function paintSeam(li, sag) {
  const svg = li.querySelector(":scope > svg.seam");
  if (!svg) return;
  const width = li.clientWidth + 2;                         // border to border
  svg.innerHTML = `<path d="M-1 .5 Q ${width / 2 - 1} ${.5 + sag * 2} ${width - 1} .5" fill="none" ` +
                  `stroke="currentColor" stroke-width="1" stroke-dasharray="4 3"/>`;
}
function paintSeams() {
  for (const li of document.querySelectorAll("li.card.worktree")) if (!li.dataset.plucked) paintSeam(li, 0);
}
// Plucked: displaced and let go, ringing down to flat in about half a second.
function pluck(li) {
  const began = performance.now(), LASTS = 560, REACH = 7;
  li.dataset.plucked = "1";
  (function frame(now) {
    const t = Math.min(1, (now - began) / LASTS);
    if (!li.isConnected) return;
    if (t >= 1) { delete li.dataset.plucked; paintSeam(li, 0); return; }
    paintSeam(li, REACH * Math.exp(-5.5 * t) * Math.cos(15 * t));
    requestAnimationFrame(frame);
  })(began);
}

// The session's own account of its work. Self-reported, so the age is
// part of the reading: a report over five minutes old is shown as stale.
const TASK_STALE_AFTER = 300;
// How long ago a report was stamped, in the page's own clock: seconds while
// it is fresh, then the coarser units waited() uses.
function reportAge(since) {
  const s = Date.now() / 1000 - since;
  return s < 60 ? `${Math.max(0, Math.round(s))}s` : waited(since);
}
function taskLine(task) {
  const since = task.reported_at;
  const stale = !task.done && (since == null || Date.now() / 1000 - since >= TASK_STALE_AFTER);
  const line = Object.assign(document.createElement("span"), {className: "task" + (stale ? " stale" : "")});
  const age = since == null ? null : reportAge(since);
  const el = (cls, text) => Object.assign(document.createElement("span"), {className: cls, textContent: text});
  const on = key => SETTINGS?.[key] !== false;
  const title = el("task-title", task.title || "");
  title.title = task.title || "";
  line.append(title);

  // What it is doing and how old that report is. Each piece is the session's
  // own claim and each can be turned off; what is off is never drawn, so the
  // separators fall to whatever is left.
  const status = el("task-status", "");
  const spoken = [];
  if (task.done) {
    status.append(el("task-done", "Done"));
    spoken.push("Done");
  } else {
    if (task.activity && on("show_task_activity")) {
      status.append(el("task-activity", task.activity));
      spoken.push(task.activity);
    }
    if (on("show_task_age") && age != null) {
      // The age wears a clock, so it reads as "reported this long ago" and
      // not as one more figure the session claimed. It keeps its stamp, and
      // ticks on from it between snapshots.
      const when = el("task-age", "");
      when.dataset.since = since;
      when.append(metaIcon("clock"), document.createTextNode(age));
      status.append(when);
      spoken.push(age);
    }
    // Staleness stays whatever else is hidden: it is the line's own warning
    // that nobody has refreshed what it says.
    if (stale) { status.append(el("task-stale", "stale")); spoken.push("stale"); }
  }
  status.title = task.done ? "The session reported this task finished"
    : `The session's own estimate, reported ${age} ago`;
  if (status.childElementCount) line.append(status);

  if (!task.done && typeof task.percent === "number" && on("show_task_bar")) {
    const pct = Math.max(0, Math.min(100, task.percent));
    const bar = el("task-bar", "");
    const fill = el("task-bar-fill", "");
    fill.style.width = pct + "%";
    bar.append(fill);
    bar.title = `about ${pct}% done, the session's own estimate`;
    line.append(bar);
    spoken.push(`about ${pct}% done`);
  }
  line.dataset.spoken = `task ${task.title || ""}: ${spoken.join(", ")}`;
  return line;
}

// What the agent itself calls the session and what it says it is on, in the
// task line's place and style. Both are read live off the agent, so the line
// has no age and no estimate.
function topicLine(topic, doing) {
  const line = Object.assign(document.createElement("span"), {className: "task"});
  const el = (cls, text) => Object.assign(document.createElement("span"), {className: cls, textContent: text, title: text});
  if (topic) line.append(el("task-title", topic));
  if (doing) {
    const status = Object.assign(document.createElement("span"), {className: "task-status"});
    status.append(el("task-activity", doing));
    line.append(status);
  }
  line.dataset.spoken = [topic && `about ${topic}`, doing && `doing ${doing}`].filter(Boolean).join(", ");
  return line;
}

// Coarse on purpose: the queue orders by how long, it does not time anyone.
// Recomputed only when a snapshot repaints, so nothing on it ticks.
function waited(since) {
  if (since == null) return null;
  const s = Math.round(Date.now() / 1000 - since);
  if (s < 60) return "<1m";
  if (s < 3600) return Math.floor(s / 60) + "m";
  if (s < 86400) return Math.floor(s / 3600) + "h";
  return Math.floor(s / 86400) + "d";
}

const QUEUE_ROWS = 3;

function paintQueue(snapshot) {
  const box = document.getElementById("queue");
  box.textContent = "";
  const waiting = snapshot.groups.flatMap(g => g.rows).filter(r => IS_EXCEPTION(r.state));
  // Nothing waiting is said by the section not being there.
  box.hidden = !waiting.length;
  if (!waiting.length) return;

  // Oldest first. A row with no start time cannot claim a place in the line,
  // so it goes to the back.
  waiting.sort((a, b) => (a.blocked_since ?? Infinity) - (b.blocked_since ?? Infinity));

  const h = document.createElement("h3");
  const n = Object.assign(document.createElement("span"),
                          {className: "n", textContent: waiting.length});
  h.append("Waiting on you", n);
  const ul = document.createElement("ul");
  for (const row of waiting.slice(0, QUEUE_ROWS)) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "qrow";
    const mark = Object.assign(document.createElement("span"), {className: "swatch"});
    if (SESSION_COLOURS[row.colour]) mark.style.setProperty("--hue", SESSION_COLOURS[row.colour]);
    const label = Object.assign(document.createElement("span"),
                                {className: "label", textContent: row.label});
    b.append(mark, label);
    const ago = waited(row.blocked_since);
    if (ago) b.append(Object.assign(document.createElement("span"),
                                    {className: "ago", textContent: ago}));
    b.setAttribute("aria-label", [row.label, "waiting", ago && `for ${ago}`]
                                   .filter(Boolean).join(" "));
    b.addEventListener("click", () => act(row.session_id, "focus"));
    const li = document.createElement("li");
    li.append(b);
    ul.append(li);
  }
  box.append(h, ul);
  const rest = waiting.length - QUEUE_ROWS;
  if (rest > 0) {
    box.append(Object.assign(document.createElement("div"),
                             {className: "more", textContent: `+${rest} more`}));
  }
}

const BUDGET_WINDOWS = [
  {label: "5-hour", used: "five_hour", at: "five_hour_at", seconds: 5 * 3600},
  {label: "Weekly", used: "seven_day", at: "seven_day_at", seconds: 7 * 86400},
];
let accountNotice = "";

const clock = at => {
  const when = new Date(at * 1000);
  return String(when.getHours()).padStart(2, "0") + ":" + String(when.getMinutes()).padStart(2, "0");
};

// One window as a labelled hairline: fill for what is used, an optional tick
// where an even spend would be, and the reset as a clock time or a weekday.
// A span of seconds in its largest whole unit: "5d", "2h", "14m", "<1m".
function duration(seconds) {
  if (seconds >= 86400) return `${Math.floor(seconds / 86400)}d`;
  if (seconds >= 3600) return `${Math.floor(seconds / 3600)}h`;
  if (seconds >= 60) return `${Math.floor(seconds / 60)}m`;
  return "<1m";
}

// How long until a reset: "5d", "2h", "14m", or "now" once it has passed.
function untilReset(at, now) {
  return at - now <= 0 ? "now" : duration(at - now);
}

function meterRow(label, used, at, {tick = null, ahead = false} = {}) {
  used = Math.max(0, Math.min(100, used));
  const row = document.createElement("div");
  row.className = "win";
  if (ahead) row.classList.add("ahead");
  const name = Object.assign(document.createElement("span"), {className: "wl", textContent: label});
  const track = Object.assign(document.createElement("span"), {className: "track"});
  const fill = Object.assign(document.createElement("span"), {className: "fill"});
  fill.style.width = used + "%";
  if (used >= 90) row.classList.add("near");
  else if (used >= 70) row.classList.add("climbing");
  track.append(fill);
  if (tick != null) {
    const mark = Object.assign(document.createElement("span"), {className: "tick"});
    mark.style.left = Math.max(0, Math.min(100, tick)) + "%";
    track.append(mark);
  }
  const pct = Object.assign(document.createElement("span"), {className: "pct", textContent: Math.round(used) + "%"});
  if (ahead) pct.setAttribute("aria-label", `${Math.round(used)}%, ahead of pace`);
  const reset = Object.assign(document.createElement("span"), {className: "at"});
  if (at) {
    const when = new Date(at * 1000);
    reset.textContent = untilReset(at, Date.now() / 1000);
    row.title = `${label}: ${Math.round(used)}% used${ahead ? ", ahead of pace" : ""}, resets `
      + when.toLocaleString(undefined, {weekday: "short", month: "short",
          day: "numeric", hour: "2-digit", minute: "2-digit"});
  }
  row.append(name, track, pct, reset);
  return row;
}

// An account's windows: the 5-hour with its reset time, then every weekly
// window, the overall one and each per-model limit, with cswap's pace rule.
function accountMeters(account) {
  const rows = [];
  if (account.five_hour) rows.push(meterRow("5-hour", account.five_hour.used, account.five_hour.resets_at));
  const weeklies = [];
  if (account.seven_day) weeklies.push(["Weekly", account.seven_day]);
  for (const m of account.models || []) weeklies.push([m.name, m]);
  for (const [label, w] of weeklies) {
    rows.push(meterRow(label, w.used, w.resets_at,
      {tick: w.pace?.expected ?? null, ahead: !!w.pace?.ahead}));
  }
  return rows;
}

// Why an account's figures are not current, in words, or "" when they are.
function accountStatus(account) {
  if (account.needs_login) return `log in to ${account.name} again`;
  if (account.fetched_at == null) return account.outcome ? "no reading yet" : "reading...";
  if (account.outcome && account.outcome !== "ok") return `as of ${clock(account.fetched_at)}`;
  return "";
}

function addAccount() {
  accountNotice = "adding...";
  paintBudget(lastSnapshot);
  fetch(`/accounts?token=${encodeURIComponent(TOKEN)}`, {method: "POST", body: JSON.stringify({op: "add"})})
    .then(r => r.json())
    .then(reply => { accountNotice = reply.error ? `could not add: ${reply.error}` : `added ${reply.account.name}`; })
    .catch(() => { accountNotice = "could not add: the panel lost its daemon"; })
    .finally(() => paintBudget(lastSnapshot));
}

let armedSwitch = null;
let disarmTimer = null;
// The inactive account the pointer is over. WebKit leaves a rebuilt element
// without :hover until the mouse moves, so the page keeps the state itself.
let hoveredAccount = null;

// Arms on the first click and switches on the second, like Close: a switch
// changes the login of every running session. Arming changes the button in
// place; a repaint from a snapshot rebuilds it in the same state.
function switchButton(account) {
  const button = Object.assign(document.createElement("button"),
    {className: "acct-switch", type: "button"});
  const label = document.createTextNode("");
  button.append(metaIcon("switch"));
  button.append(label);
  const show = () => {
    const armed = armedSwitch === account.id;
    label.textContent = armed ? "Confirm switch" : "Switch";
    button.setAttribute("aria-label", armed ? `confirm switching to ${account.name}` : `switch to ${account.name}`);
    button.classList.toggle("armed", armed);
  };
  show();
  button.addEventListener("click", () => {
    clearTimeout(disarmTimer);
    if (armedSwitch !== account.id) {
      armedSwitch = account.id;
      disarmTimer = setTimeout(() => { armedSwitch = null; show(); }, 4000);
      show();
      return;
    }
    armedSwitch = null;
    localSwitch = {kind: "pending", text: `switching to ${account.name}...`};
    paintBudget(lastSnapshot);
    fetch(`/accounts?token=${encodeURIComponent(TOKEN)}`,
          {method: "POST", body: JSON.stringify({op: "switch", account_id: account.id})})
      .then(r => r.json())
      .then(reply => {
        // A made switch is the daemon's to report; its next snapshot carries it.
        localSwitch = reply.error ? {kind: "refused", text: `not switched: ${reply.error}`}
          : {kind: "switched", to: reply.account.name, at: Date.now() / 1000, why: null};
      })
      .catch(() => { localSwitch = {kind: "refused", text: "not switched: the panel lost its daemon"}; })
      .finally(() => paintBudget(lastSnapshot));
  });
  return button;
}

// Which account's name is being edited. A repaint leaves the strip alone
// while its field has focus, so a snapshot arriving mid-typing keeps the text.
let renamingAccount = null;

function renameAccount(account, text) {
  renamingAccount = null;
  accountNotice = "renaming...";
  paintBudget(lastSnapshot);
  fetch(`/accounts?token=${encodeURIComponent(TOKEN)}`,
        {method: "POST", body: JSON.stringify({op: "rename", account_id: account.id, alias: text})})
    .then(r => r.json())
    .then(reply => { accountNotice = reply.error ? `not renamed: ${reply.error}` : `renamed to ${reply.account.name}`; })
    .catch(() => { accountNotice = "not renamed: the panel lost its daemon"; })
    .finally(() => paintBudget(lastSnapshot));
}

// An account's name; clicking it turns it into a field. Enter saves, Escape
// or leaving the field cancels, and an empty name goes back to the default.
function accountName(account, className, suffix = "") {
  if (renamingAccount === account.id) {
    const field = Object.assign(document.createElement("input"),
      {className: `${className} acct-rename`, type: "text", value: account.alias ?? "",
       placeholder: account.default_name, maxLength: 40});
    field.setAttribute("aria-label", `nickname for ${account.name}`);
    field.addEventListener("keydown", event => {
      event.stopPropagation();
      if (event.key === "Enter") renameAccount(account, field.value);
      else if (event.key === "Escape") { renamingAccount = null; paintBudget(lastSnapshot); }
    });
    field.addEventListener("blur", () => {
      if (renamingAccount !== account.id) return;
      renamingAccount = null;
      paintBudget(lastSnapshot);
    });
    requestAnimationFrame(() => { field.focus(); field.select(); });
    return field;
  }
  const name = Object.assign(document.createElement("button"),
    {className, type: "button", textContent: account.name + suffix, title: "Click to rename"});
  name.addEventListener("click", event => {
    event.stopPropagation();
    renamingAccount = account.id;
    paintBudget(lastSnapshot);
  });
  return name;
}

// The button names the login it would store, since "this account" names
// nothing a person can check. Without a login there is nothing to add.
function addButton(live) {
  const add = Object.assign(document.createElement("button"), {className: "acct-add", type: "button"});
  if (live) {
    add.textContent = `Add ${live}`;
    add.title = `Store the login Claude Code is using now, ${live}, so the panel can meter it`;
    add.addEventListener("click", addAccount);
  } else {
    add.textContent = "Log in to Claude Code first";
    add.title = "Claude Code has no login to store; run claude and log in";
    add.disabled = true;
  }
  return add;
}

// The account the sessions run on, then every other stored account with its
// own meters. Figures come from the daemon's own readings.
// The switch this page asked for, until the daemon's snapshot says the same:
// {kind: "pending"|"refused", text} or {kind: "switched", to, at, why}.
let localSwitch = null;

// The last switch as one line: arrows, where to, why, a chip when the daemon
// chose, and how long ago. A switch this page is making, or that was
// refused, wins over the snapshot's.
function switchLine(last) {
  if (localSwitch && (localSwitch.kind !== "switched" || !last || last.at < localSwitch.at)) {
    last = localSwitch;
  } else {
    localSwitch = null;
  }
  if (!last) return null;
  const line = Object.assign(document.createElement("div"), {className: "switched"});
  const text = Object.assign(document.createElement("span"), {className: "sw-text"});
  if (last.kind === "pending" || last.kind === "refused") {
    line.classList.add(last.kind);
    text.textContent = last.text;
    line.append(metaIcon(last.kind === "refused" ? "warning" : "switch"), text);
    return line;
  }
  const why = last.why || "by hand";
  text.append(document.createTextNode(`Switched to ${last.to}`),
    Object.assign(document.createElement("span"), {className: "sw-sep"}),
    Object.assign(document.createElement("span"), {className: "sw-reason", textContent: why}));
  text.title = `Switched to ${last.to}: ${why}; running sessions pick it up within about 30 s`;
  line.append(metaIcon("switch"), text);
  if (last.auto) line.append(Object.assign(document.createElement("span"), {className: "sw-chip", textContent: "auto"}));
  const age = Object.assign(document.createElement("span"), {className: "sw-age"});
  age.append(metaIcon("clock"), document.createTextNode(reportAge(last.at)));
  age.title = clock(last.at);
  line.append(age);
  return line;
}

// The auto-switch setting, above the accounts it acts on.
function autoSwitchRow() {
  const row = Object.assign(document.createElement("div"), {className: "autosw"});
  const sw = document.createElement("button");
  sw.className = "sw";
  sw.setAttribute("role", "switch");
  sw.setAttribute("aria-checked", String(!!SETTINGS?.auto_switch));
  sw.setAttribute("aria-label", "Switch before a limit");
  sw.title = "Leave the active account before a limit stops your sessions";
  sw.addEventListener("click", () => push({auto_switch: !SETTINGS?.auto_switch}));
  row.append(Object.assign(document.createElement("span"), {textContent: "Auto-switch"}), sw);
  return row;
}

// One line, only while a switch is near: where it would go, and why. At
// rest the row says nothing, since an outlook nobody acts on is noise.
function nextSwitchLine(next) {
  if (!SETTINGS?.auto_switch || !next?.near) return null;
  const line = Object.assign(document.createElement("div"), {className: "autosw-next"});
  line.textContent = next.to ? `switching soon to ${next.to} \u00b7 ${next.why}` : `nowhere to go \u00b7 ${next.why}`;
  line.title = `${next.why}; switches at 90% or when a window is on course for 100%`;
  return line;
}

function paintAccounts(strip, store) {
  const active = store.accounts.find(a => a.active);
  if (store.accounts.length > 1) {
    strip.append(autoSwitchRow());
    const next = nextSwitchLine(store.next_switch);
    if (next) strip.append(next);
  }
  const head = Object.assign(document.createElement("div"), {className: "acct-line"});
  head.append(providerIcon("claude", "Claude"), active ? accountName(active, "acct-name")
    : Object.assign(document.createElement("span"), {className: "acct-name", textContent: "not a stored login"}));
  // The login every session runs on.
  if (active && renamingAccount !== active.id) {
    const check = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    check.setAttribute("viewBox", "0 0 256 256");
    check.setAttribute("class", "acct-badge");
    check.setAttribute("role", "img");
    check.setAttribute("aria-label", "active");
    check.innerHTML = '<path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm45.66,85.66-56,56a8,8,0,0,1-11.32,0l-24-24a8,8,0,0,1,11.32-11.32L112,148.69l50.34-50.35a8,8,0,0,1,11.32,11.32Z"/>';
    head.append(check);
  }
  strip.append(head);

  if (active) {
    const status = accountStatus(active);
    if (status) strip.append(Object.assign(document.createElement("div"), {className: "acct-status", textContent: status}));
    strip.append(...accountMeters(active));
  }
  const switched = switchLine(store.last_switch);
  if (switched) strip.append(switched);

  const list = Object.assign(document.createElement("div"), {className: "acct-list"});
  for (const account of store.accounts.filter(a => !a.active)) {
    const item = Object.assign(document.createElement("div"), {className: "acct-item"});
    const itemHead = Object.assign(document.createElement("div"), {className: "acct-item-head"});
    itemHead.append(providerIcon("claude", "Claude"), accountName(account, "acct-item-name"));
    item.append(itemHead);
    const status = accountStatus(account);
    if (status) item.append(Object.assign(document.createElement("div"), {className: "acct-status", textContent: status}));
    item.append(...accountMeters(account));
    if (active && !account.needs_login) {
      itemHead.append(switchButton(account));
      item.addEventListener("mouseenter", () => { hoveredAccount = account.id; item.classList.add("hover"); });
      item.addEventListener("mouseleave", () => {
        hoveredAccount = null; item.classList.remove("hover", "settled");
      });
      if (hoveredAccount === account.id) {
        item.classList.add("hover", "settled");
        requestAnimationFrame(() => requestAnimationFrame(() => item.classList.remove("settled")));
      }
    }
    list.append(item);
  }
  if (!active) list.append(addButton(store.live));
  if (accountNotice) list.append(Object.assign(document.createElement("div"), {className: "acct-status", textContent: accountNotice}));
  strip.append(list);
}

// Rate limits from the sessions' own status lines, for when no account is
// stored yet. Account-wide figures repeat on every session with bridge data;
// the highest is the safe reading, and a session with none is skipped.
function paintSessionBudget(strip, reporting) {
  const now = Date.now() / 1000;
  for (const w of BUDGET_WINDOWS) {
    const best = reporting.filter(d => d[w.used] != null)
      .reduce((a, d) => (a && a[w.used] >= d[w.used] ? a : d), null);
    if (!best) continue;
    const used = best[w.used];
    const at = best[w.at];
    const elapsed = at ? Math.max(0, Math.min(1, 1 - (at - now) / w.seconds)) : null;
    strip.append(meterRow(w.label, used, at, {
      tick: elapsed == null ? null : elapsed * 100,
      ahead: elapsed != null && used / 100 > elapsed && used >= 80}));
  }
}

// Provider marks (Simple Icons, CC0), in each brand's colour.
const PROVIDER_ICONS = {

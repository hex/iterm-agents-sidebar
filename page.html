// The mark for an agent that has none of its own.
const PLAIN_MARK = '<circle cx="12" cy="12" r="5"/>';

// Every agent a card can run: what to call it, and the colour its glyph takes
// where the card says which agent it is. Claude is the agent of a row that
// names none.
const AGENT_KINDS = {
  claude: {name: "Claude", colour: "#d97757"},
  openai: {name: "Codex", colour: "#10a37f"},
  omp: {name: "omp", colour: "#6d5ae6"},
};
const agentKindOf = row => row.provider || "claude";
const agentKind = row => AGENT_KINDS[agentKindOf(row)] || {name: agentKindOf(row), colour: "currentColor"};
// How a card says which agent it is: "tag", "corner", "groups" or "off".
const agentMark = () => SETTINGS?.provider_mark ?? "tag";

// A sub-head over the cards of one agent, for a list gathered by agent.
function agentHead(row, count) {
  const head = Object.assign(document.createElement("li"), {className: "phead"});
  head.style.setProperty("--agent", agentKind(row).colour);
  head.append(providerIcon(agentKindOf(row), ""),
              Object.assign(document.createElement("h3"), {textContent: agentKind(row).name}),
              Object.assign(document.createElement("span"), {className: "n", textContent: count}));
  head.firstChild.setAttribute("aria-hidden", "true");
  return head;
}

// What to call an agent's program on a row that has no model to name: the
// mark's own label, then the program.
const PROGRAMS = {
  openai: {mark: "OpenAI", name: "Codex"},
  omp: {mark: "omp", name: "omp"},
};

function providerIcon(kind, label) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("class", `provider ${kind}`);
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", label);
  svg.innerHTML = PROVIDER_ICONS[kind] || PLAIN_MARK;
  return svg;
}

// Codex's own limits, as its session logs last reported them.
function paintCodex(strip, limits) {
  const block = Object.assign(document.createElement("div"), {className: "codex"});
  block.append(Object.assign(document.createElement("div"), {className: "acct-line"}));
  block.firstChild.append(providerIcon("openai", "OpenAI"),
    Object.assign(document.createElement("span"), {className: "acct-name", textContent: "Codex"}));
  for (const w of limits.windows) {
    block.append(meterRow(w.label, w.used, w.resets_at,
      {tick: w.pace?.expected ?? null, ahead: !!w.pace?.ahead}));
  }
  strip.append(block);
}

let lastSnapshot = {groups: []};
// Countdowns move on their own; the daemon only pushes when its data changes.
setInterval(() => paintBudget(lastSnapshot), 30000);
// A stuck turn stops sending updates, so its badge has to appear on a clock.
setInterval(() => { if (lastSnapshot.groups.length) render(lastSnapshot); }, 60000);
// The report ages tick every second on their own: a snapshot arrives only
// when something changed, and a fresh report counts up in seconds.
setInterval(() => {
  for (const when of document.querySelectorAll(".task-age[data-since]")) {
    const since = Number(when.dataset.since);
    when.lastChild.textContent = reportAge(since);
    when.closest(".task").classList.toggle("stale", Date.now() / 1000 - since >= TASK_STALE_AFTER);
  }
}, 1000);
function paintBudget(snapshot) {
  lastSnapshot = snapshot;
  const strip = document.getElementById("budget");
  const reporting = (snapshot.groups || []).flatMap(g => g.rows || [])
    .map(r => r.details).filter(Boolean);
  const store = snapshot.accounts;
  if (renamingAccount && strip.contains(document.activeElement)) return;
  strip.replaceChildren();

  if (store?.error) {
    strip.append(Object.assign(document.createElement("div"), {className: "acct-status",
      textContent: `accounts hidden: ${store.error}`}));
  } else if (store?.accounts?.length) {
    paintAccounts(strip, store);
  } else {
    paintSessionBudget(strip, reporting);
    if (store) {
      strip.append(addButton(store.live));
      if (accountNotice) strip.append(Object.assign(document.createElement("div"), {className: "acct-status", textContent: accountNotice}));
    }
  }

  if (snapshot.codex?.windows?.length) paintCodex(strip, snapshot.codex);

  strip.hidden = strip.childElementCount === 0;
}

// A line that cannot fit even with its branch at two characters drops the
// branch outright. The alternative is the context figure running off the
// panel, and a branch is the one item on the line you can read elsewhere.
// A path long enough that the panel would spend the whole line on it. Shorter
// ones -- /etc/hosts -- say where they are, and keeping them whole costs
// nothing.
const LONG_PATH = /^(~|\/)\S*\/\S/;
const LONG_ENOUGH = 24;
// The last part that names something. A directory written with its trailing
// slash ends in nothing, and dropping to "" would lose the argument whole.
function tail(path) {
  const parts = path.split("/").filter(Boolean);
  return parts[parts.length - 1] || path;
}
function shortTitle(title) {
  return title.trim().split(/\s+/)
    .map(part => LONG_PATH.test(part) && part.length > LONG_ENOUGH ? tail(part) : part)
    .join(" ");
}

function fitMeta() {
  for (const line of document.querySelectorAll("#groups .model")) {
    const branch = line.querySelector(".mchip.branch");
    if (!branch) continue;
    branch.hidden = false;
    if (line.scrollWidth > line.clientWidth) branch.hidden = true;
  }
  // A label only fades when it has more text than room; measured here, with
  // the rest of the layout reads, rather than per row as it is built.
  for (const label of document.querySelectorAll("#groups .label")) {
    label.classList.toggle("clipped", label.scrollWidth > label.clientWidth + 1);
  }
}
window.addEventListener("resize", () => { fitMeta(); paintSeams(); });

// The indented block inside a card that holds its teammates, subagents and
// shells, made on first use.
function childrenOf(card) {
  let kids = card.querySelector(":scope > .children:not(.shell-rows)");
  if (!kids) {
    kids = Object.assign(document.createElement("div"), {className: "children"});
    card.insertBefore(kids, card.querySelector(":scope > .shell-sum"));
  }
  return kids;
}

// How many finished subagents a card shows as rows before it folds them, and
// the cards whose fold is open, by session id, so a repaint keeps it open.
const FOLD_FINISHED_OVER = 3;
const openFinished = new Set();

// Cards whose shells are shown the other way from the Expand shells setting,
// by session id, so a repaint keeps what you opened or closed.
const flippedShells = new Set();
// When a session's last shell ended. Its commands line stays for a few
// seconds after, quiet, so a run of short commands reads as one line whose
// count changes rather than a card that grows and shrinks on each of them.
const SHELL_LINGER_MS = 4000;
const shellsHad = new Map();      // session -> how many shells it last had
const shellsEndedAt = new Map();
let lingerTimer = null;

function childRow(parent, kind, key) {
  const b = document.createElement("button");
  b.dataset.childKey = key;
  b.type = "button";
  b.className = "row agent child " + kind;
  b.dataset.sessionId = parent.session_id;
  return b;
}

function stackOf(text, meta) {
  const stack = Object.assign(document.createElement("span"), {className: "stack"});
  stack.append(Object.assign(document.createElement("span"), {className: "label", textContent: text}));
  if (meta) {
    stack.append(Object.assign(document.createElement("span"), {className: "model", textContent: meta}));
  }
  return stack;
}

function paint(snapshot) {
  const root = document.getElementById("groups");
  const focused = document.activeElement;
  const keepId = focused && focused.dataset ? focused.dataset.sessionId : null;
  const menuFocus = openMenu && openMenu.contains(focused) ? focused : null;
  root.textContent = "";

  if (!snapshot.groups.length) {
    const p = document.createElement("p");
    p.id = "empty";
    p.textContent = "No sessions.";
    root.append(p);
    return;
  }

  for (const group of snapshot.groups) {
    // The Toolbelt already titles this panel "Agents", so the first heading
    // only repeats it. SESSIONS still earns its line: it divides two kinds of
    // row rather than naming the panel.
    const h = document.createElement("h2");
    // The data names a group in capitals; the heading reads it as a word.
    h.append(group.name.charAt(0) + group.name.slice(1).toLowerCase());
    if (group.rows.length) {
      h.append(Object.assign(document.createElement("span"),
                             {className: "n", textContent: group.rows.length}));
    }
    h.hidden = group.name === "AGENTS";
    const ul = document.createElement("ul");
    // The card the rows that follow belong to. Rows arrive parent first, then
    // its teammates, so a depth-1 row always joins the card opened just above.
    let card = null;
    for (const row of group.rows) {
      const li = row.depth && card ? card : document.createElement("li");
      if (li !== card) {
        li.className = "line card";
        li.dataset.key = row.session_id;
        // Tied to the card just above only when that card is the session
        // whose repo this worktree belongs to; anything else in between and
        // the line would join the wrong two.
        if (SESSION_COLOURS[row.colour]) li.dataset.hue = SESSION_COLOURS[row.colour];
        if (row.worktree_of && card && card.dataset.key === row.worktree_of) {
          li.classList.add("worktree");
          if (card.dataset.hue) li.style.setProperty("--family", card.dataset.hue);
          if (SESSION_COLOURS[row.colour]) li.style.setProperty("--hue", SESSION_COLOURS[row.colour]);
          li.append(document.createElementNS("http://www.w3.org/2000/svg", "svg"));
          li.lastChild.setAttribute("class", "seam");
        }
        card = li;
      }
      const b = document.createElement("button");
      b.setAttribute("aria-describedby", "row-help");
      b.className = "row " + (group.name === "AGENTS" ? "agent" : "shell")
                  + (row.depth ? " child" : "");
      b.dataset.sessionId = row.session_id;
      b.type = "button";


      const hot = IS_EXCEPTION(row.state);
      if (!hot && row.state !== "working" && !row.running) b.classList.add("quiet");
      if (hot) {
        b.classList.add("hot");
        card.classList.add("blocked");
      }

      // Identity, always, and never as the ground.
      const mark = document.createElement("span");
      // The session's colour on the row itself, so the task graphic can wear it.
      if (SESSION_COLOURS[row.colour]) b.style.setProperty("--hue", SESSION_COLOURS[row.colour]);
      // A plain terminal running a command is busy the same way an agent
      // mid-turn is, so it gets the same dots, in grey for want of a colour.
      if (row.state === "working" || row.running) {
        mark.className = "busy" + (row.depth ? " down" : "");
        mark.innerHTML = "<i></i><i></i><i></i>";
      } else if (group.name !== "AGENTS" && !row.depth) {
        // A plain terminal at its prompt: the shell mark, in its session colour.
        mark.className = "shell-mark";
        mark.append(metaIcon("shells"));
      } else {
        mark.className = "swatch" + (row.state === "unknown" ? " hollow" : "");
      }
      if (SESSION_COLOURS[row.colour]) {
        mark.style.setProperty("--hue", SESSION_COLOURS[row.colour]);
      }
      b.append(mark);

      const stack = document.createElement("span");
      stack.className = "stack";

      const label = document.createElement("span");
      label.className = "label";
      label.append(row.label);
      stack.append(label);
      // Which agent this is, said once per card: a tag after the name or a
      // mark in the row's corner. The glyph then leaves the facts line.
      const marked = group.name === "AGENTS" && !row.depth ? agentMark() : "off";
      if (marked === "tag" || marked === "corner") {
        b.style.setProperty("--agent", agentKind(row).colour);
        const glyph = providerIcon(agentKindOf(row), "");
        glyph.setAttribute("aria-hidden", "true");
        if (marked === "tag") {
          const tag = Object.assign(document.createElement("span"), {className: "ptag"});
          if (AGENT_KINDS[agentKindOf(row)]) tag.style.setProperty("--ink", `var(--ink-${agentKindOf(row)})`);
          tag.append(glyph, agentKind(row).name);
          label.append(tag);
        } else {
          glyph.classList.add("pcorner");
          b.classList.add("cornered");
          b.append(glyph);
        }
      }

      // What the session says it is doing, as it wrote it: a title, then
      // the rough percent, the activity and how old the report is.
      if (row.task && SETTINGS?.show_task !== false) {
        stack.append(taskLine(row.task));
      } else if ((row.topic || row.doing) && SETTINGS?.show_task !== false) {
        stack.append(topicLine(row.topic, row.doing));
      }

      // Branch then model, on one line under the name: both describe the
      // session rather than its state, so they belong together and behind it.
      // Each item has an icon saying which it is, and a middot between items.
      const meta = document.createElement("span");
      meta.className = "model";
      for (const [kind, value] of [["title", row.title], ["branch", row.branch], ["model", row.model]]) {
        if (!value || SETTINGS?.[`show_${kind}`] === false) continue;
        const chip = document.createElement("span");
        chip.className = "mchip";
        chip.classList.add(kind === "branch" ? "branch" : kind === "title" ? "title" : "model-name");
        if (kind === "branch") chip.style.setProperty("--floor", Math.min(value.length, 6));
        const text = Object.assign(document.createElement("span"),
                                   {className: "mtext",
                                    textContent: kind === "title" ? shortTitle(value) : value});
        // The model's mark is its provider's; a tab title wears a computer.
        if (kind === "model" && (marked === "off" || marked === "groups")) {
          chip.append(providerIcon(agentKindOf(row), agentKind(row).name));
        }
        else chip.append(metaIcon(kind === "title" ? "computer" : kind));
        chip.append(text);
        chip.title = value;
        const effort = kind === "model" && EFFORT_LETTERS[row.effort]
          ? document.createElement("span") : null;
        if (effort) {
          effort.className = "effort " + row.effort;
          if (row.effort === "max") effort.innerHTML = "<i>m</i><i>x</i>";
          else effort.textContent = EFFORT_LETTERS[row.effort];
        }
        chip.dataset.spoken = kind === "branch" ? `on branch ${value}`
          : kind === "title" ? `tab ${value}`
          : `model ${value}` + (row.effort ? `, ${row.effort} effort` : "");
        meta.append(chip);
        if (effort) meta.append(effort);
      }
      // A teammate is its own session in its own pane, so the card's own
      // badge can read idle while work goes on under it. The dots say a
      // teammate is working; the badge still speaks for this pane alone.
      if (row.busy_kids) {
        const chip = Object.assign(document.createElement("span"), {className: "mchip kids"});
        const dots = Object.assign(document.createElement("span"), {className: "busy down"});
        dots.innerHTML = "<i></i><i></i><i></i>";
        chip.append(dots, Object.assign(document.createElement("span"),
                                        {className: "mtext", textContent: String(row.busy_kids)}));
        chip.title = row.busy_kids === 1 ? "a teammate is working" : `${row.busy_kids} teammates are working`;
        chip.dataset.spoken = chip.title;
        meta.append(chip);
      }
      // A Codex terminal that has not run a turn yet has no model to carry
      // its mark, and an omp row never has one; the card would then say
      // nothing about which agent it is. The mark names the program instead.
      const program = PROGRAMS[row.provider];
      if (program && !row.model && marked !== "tag") {
        const chip = Object.assign(document.createElement("span"), {className: "mchip model-name"});
        chip.append(providerIcon(row.provider, program.mark),
                    Object.assign(document.createElement("span"), {className: "mtext", textContent: program.name}));
        chip.dataset.spoken = program.name;
        meta.append(chip);
      }
      // Context reads on this line and not the one above. It is a fact about
      // the session in the same way the branch and the model are, and every
      // other item here is an icon and a value -- a bare number on the first
      // line was the one exception, sitting against the shells count with
      // nothing between them so the two read as a single figure.
      if (typeof row.context === "number" && row.context >= speaksAt()) {
        const chip = document.createElement("span");
        chip.className = "mchip ctx" + (row.context >= 90 ? " critical" : "");
        chip.append(metaIcon("gauge"),
                    document.createTextNode(row.context + "%"));
        meta.append(chip);
      }
      // Heavy is the daemon's verdict on the session's whole process tree,
      // so a busy MCP server or build lights the session that started it.
      for (const kind of row.heavy || []) {
        const chip = document.createElement("span");
        chip.className = "mchip heavy";
        const limit = kind === "cpu" ? `${SETTINGS?.cpu_threshold ?? 100}% CPU`
                                     : `${SETTINGS?.memory_threshold ?? 2} GB of memory`;
        chip.title = `Its processes are using ${limit} or more`;
        chip.dataset.spoken = kind === "cpu" ? "high CPU" : "high memory";
        chip.append(metaIcon(kind), document.createTextNode(kind === "cpu" ? "CPU" : "Mem"));
        meta.append(chip);
      }
      if (meta.childElementCount) stack.append(meta);
      b.append(stack);

      if (row.job) {
        const job = document.createElement("span");
        job.className = "job";
        job.textContent = row.job;
        b.append(job);
      }

      if (hot) {
        const word = document.createElement("span");
        word.className = "word blocked";
        word.textContent = "waiting";
        syncBreathe(word);
        b.append(word);
      } else if (row.state === "working" && row.working_since
                 && Date.now() / 1000 - row.working_since >= LONG_TURN_SECONDS) {
        const running = Date.now() / 1000 - row.working_since;
        const word = document.createElement("span");
        word.className = "word long";
        word.textContent = `long ${duration(running)}`;
        b.append(word);
        b.classList.add("long-turn");
      } else if (row.state === "idle" && !row.depth) {
        const word = document.createElement("span");
        word.className = "word idle";
        word.textContent = "idle";
        syncShimmer(word);
        b.append(word);
        b.classList.add("resting");
      }


      // aria-label only, never title: the hover card says the same thing,
      // and the OS tooltip is drawn by the window server, above any z-index
      // this page can reach. Two of them at once is what that looks like.
      const said = row.state ? STATE_TITLES[row.state] || row.state : null;
      // One label for the whole button: a label on a span inside it is
      // never read, so the task and the facts line are spoken from here.
      b.setAttribute("aria-label",
                     [row.label, group.name === "AGENTS" ? agentKind(row).name : null, row.position, said,
                      b.classList.contains("long-turn")
                        ? `running for ${duration(Date.now() / 1000 - row.working_since)}, may be stuck` : null,
                      typeof row.context === "number" ? row.context + "% context" : null,
                      ...[...b.querySelectorAll("[data-spoken]")].map(el => el.dataset.spoken)]
                       .filter(Boolean).join(" \u2014 "));

      b.addEventListener("click", () => act(row.session_id, "focus"));
      watchForCard(b, row);
      // A repaint puts an open menu back as the same node: its position, its
      // armed second click and its keyboard focus survive, and it does not
      // unfold again.
      const keptMenu = openMenuKey === row.session_id && openMenu;
      const menu = keptMenu || menuFor(row, group);
      if (keptMenu) keptMenu.classList.add("kept");
      const host = card;       // `card` moves on with the loop; the menu stays
      if (menu) {
        b.addEventListener("contextmenu", e => openMenuAt(menu, host, e, row.session_id));
      }

      if (row.depth && li === card) {
        // A teammate: one line inside its parent's card, above the shells.
        b.classList.add("child");
        b.dataset.childKey = "mate\n" + row.session_id;
        const kids = childrenOf(card);
        kids.insertBefore(b, kids.querySelector(":scope > .tail"));
        if (menu) card.append(menu);
        continue;
      }
      li.append(b);
      if (menu) li.append(menu);
      // Gathered by agent, the daemon sends each agent's cards together; a
      // head opens each run, and a list of one agent needs none.
      if (group.name === "AGENTS" && agentMark() === "groups" && !row.worktree_of
          && new Set(group.rows.map(agentKindOf)).size > 1
          && agentKindOf(row) !== ul.dataset.lastAgent) {
        ul.dataset.lastAgent = agentKindOf(row);
        ul.append(agentHead(row, group.rows.filter(r => !r.depth && agentKindOf(r) === agentKindOf(row)).length));
      }
      ul.append(li);

      // Subagents run inside their parent's process with no terminal of their
      // own; the hook lists them with the name they were given and the model
      // they reply with, once their files say so, and by type until then.
      // Clicking one focuses the session they run in.
      const subs = SETTINGS?.show_agents !== false ? row.subagents || [] : [];
      // Subagents of one type that start in the same second, as a workflow's
      // do, are told apart by their turn among the ones alike: a key two rows
      // share makes the list measure one against the other's place and move it.
      const alike = new Map();
      // A workflow leaves dozens of finished subagents behind. Past a few,
      // they fold into one line that opens them, and the ones still running
      // stay in sight. One that failed is never folded away.
      const ended = sub => sub.ended != null
        && !(sub.provider === "codex" && ["failed", "cancelled"].includes(sub.phase));
      const folds = subs.filter(ended).length > FOLD_FINISHED_OVER;
      const folded = [];
      for (const sub of subs) {
        // A Codex job the session started through the codex plugin is keyed
        // by its job id: two rescues can start in the same second.
        const codex = sub.provider === "codex";
        const kin = `sub\n${sub.type}\n${sub.since}`;
        alike.set(kin, (alike.get(kin) || 0) + 1);
        const sb = childRow(row, "tail", codex ? `codex\n${sub.id}` : `${kin}\n${alike.get(kin)}`);
        // A finished subagent keeps its place until the next prompt, quiet,
        // with how long it ran; its key does not change, so nothing moves.
        const done = sub.ended != null;
        // A Codex job that failed or was cancelled ended, but did not finish.
        const failed = codex && done && ["failed", "cancelled"].includes(sub.phase);
        const dots = Object.assign(document.createElement("span"), {className: done ? "busy" : "busy down"});
        if (failed) dots.innerHTML = "";
        else if (done) { dots.innerHTML = ""; const mark = metaIcon("check"); mark.classList.add("done-mark"); dots.append(mark); }
        else dots.innerHTML = "<i></i><i></i><i></i>";
        if (done) sb.classList.add("finished");
        if (sub.depth) sb.style.setProperty("--depth", sub.depth);
        else sb.style.removeProperty("--depth");
        const ran = sub.since == null ? null
          : forHumans((done ? sub.ended : Date.now() / 1000) - sub.since);
        const title = codex ? `Codex ${sub.type || "job"}` : sub.name || sub.type || "subagent";
        const stack = stackOf(title);
        const meta = Object.assign(document.createElement("span"), {className: "model"});
        if (codex && sub.phase && sub.phase !== "done") {
          const chip = Object.assign(document.createElement("span"), {className: "mchip model-name"});
          chip.append(providerIcon("openai", "OpenAI"),
                      Object.assign(document.createElement("span"), {className: "mtext", textContent: sub.phase}));
          meta.append(chip);
        } else if (codex) {
          meta.append(providerIcon("openai", "OpenAI"));
        }
        if (sub.model && SETTINGS?.show_model !== false) {
          const chip = Object.assign(document.createElement("span"), {className: "mchip model-name"});
          chip.append(providerIcon(agentKindOf(row), agentKind(row).name),
                      Object.assign(document.createElement("span"), {className: "mtext", textContent: sub.model}));
          meta.append(chip);
        }
        // An omp subagent keeps a log of its own, so its row can say what
        // the session's card says: context, spend, and while it runs, the
        // intent of the tool it last started.
        if (typeof sub.context === "number" && sub.context >= speaksAt()) {
          const chip = Object.assign(document.createElement("span"),
                                     {className: "mchip ctx" + (sub.context >= 90 ? " critical" : "")});
          chip.append(metaIcon("gauge"), document.createTextNode(sub.context + "%"));
          meta.append(chip);
        }
        if (typeof sub.cost === "number" && sub.cost > 0) {
          meta.append(Object.assign(document.createElement("span"), {className: "mchip", textContent: "$" + sub.cost.toFixed(2)}));
        }
        if (ran) meta.append(Object.assign(document.createElement("span"), {className: "mchip", textContent: ran}));
        if (sub.doing && !done && SETTINGS?.show_task !== false) {
          stack.append(Object.assign(document.createElement("span"),
                                     {className: "task-activity sub-doing", textContent: sub.doing, title: sub.doing}));
        }
        if (meta.childElementCount) stack.append(meta);
        sb.append(dots, stack);
        sb.title = sub.name && sub.type ? `${sub.name} (${sub.type})` : title;
        sb.setAttribute("aria-label", [`${codex ? "" : "subagent "}${title} in ${row.label}`, sub.model,
                                       codex && sub.phase, typeof sub.context === "number" && `context ${sub.context}%`,
                                       sub.doing && !done && `doing ${sub.doing}`,
                                       ran && (failed ? `ended after ${ran}` : done ? `finished after ${ran}` : `running ${ran}`)]
                                       .filter(Boolean).join(", "));
        sb.addEventListener("click", () => act(row.session_id, "focus"));
        if (folds && ended(sub)) folded.push(sb);
        else childrenOf(li).append(sb);
      }
      if (folded.length) {
        const open = openFinished.has(row.session_id);
        const sum = document.createElement("button");
        sum.type = "button";
        sum.className = "shell-sum finished-sum";
        sum.dataset.childKey = "finished";
        const mark = metaIcon("check");
        mark.classList.add("done-mark");
        sum.append(mark,
                   Object.assign(document.createElement("span"), {textContent: `${folded.length} finished`}),
                   Object.assign(document.createElement("span"), {className: "chev", textContent: "\u203a"}));
        sum.setAttribute("aria-expanded", String(open));
        sum.setAttribute("aria-controls", "finished-" + row.session_id);
        sum.setAttribute("aria-label", `${folded.length} finished subagents in ${row.label}`);
        sum.addEventListener("click", () => {
          if (openFinished.has(row.session_id)) openFinished.delete(row.session_id);
          else openFinished.add(row.session_id);
          if (LATEST) render(LATEST);
        });
        li.append(sum);
        if (open) {
          const rows = Object.assign(document.createElement("div"),
                                     {className: "children shell-rows", id: "finished-" + row.session_id});
          rows.append(...folded);
          li.append(rows);
        }
      }

      // Background shells. Claude Code draws these in its own footer from
      // memory it never publishes, so they are read off the process tree.
      // Folded into one line that opens them; clicking a shell row shows its
      // whole command.
      const shells = SETTINGS?.show_shells !== false ? row.shells || [] : [];
      const key = row.session_id;
      if (shells.length) { shellsEndedAt.delete(key); shellsHad.set(key, shells.length); }
      else if (shellsHad.has(key)) { shellsEndedAt.set(key, [Date.now(), shellsHad.get(key)]); shellsHad.delete(key); }
      const [endedAt, hadN] = shellsEndedAt.get(key) ?? [-Infinity, 0];
      const lingering = !shells.length && Date.now() - endedAt < SHELL_LINGER_MS;
      if (lingering) {
        const sum = Object.assign(document.createElement("div"), {className: "shell-sum quiet"});
        sum.dataset.childKey = "shells";
        // What just happened, not a negative: the count it had, finished.
        sum.append(metaIcon("shells"), Object.assign(document.createElement("span"),
                                                     {textContent: `${hadN} command${hadN > 1 ? "s" : ""} finished`}));
        li.append(sum);
        clearTimeout(lingerTimer);
        lingerTimer = setTimeout(() => { if (LATEST) render(LATEST); }, SHELL_LINGER_MS + 50);
      }
      if (shells.length) {
        const open = SETTINGS?.expand_shells ? !flippedShells.has(key) : flippedShells.has(key);
        const sum = document.createElement("button");
        sum.type = "button";
        sum.className = "shell-sum";
        sum.dataset.childKey = "shells";
        const n = shells.length;
        const chev = Object.assign(document.createElement("span"),
                                   {className: "chev", textContent: "\u203a"});
        const count = Object.assign(document.createElement("span"),
                                    {className: "shimmer", textContent: `${n} command${n > 1 ? "s" : ""} running`});
        syncShimmer(count);
        sum.append(metaIcon("shells"), count, chev);
        sum.setAttribute("aria-expanded", String(open));
        sum.setAttribute("aria-controls", "shells-" + row.session_id);
        sum.setAttribute("aria-label", `${n} background shell${n > 1 ? "s" : ""} in ${row.label}`);
        sum.addEventListener("click", () => {
          if (flippedShells.has(key)) flippedShells.delete(key); else flippedShells.add(key);
          if (LATEST) render(LATEST);
        });
        li.append(sum);
        if (open) {
          const rows = Object.assign(document.createElement("div"),
                                     {className: "children shell-rows", id: "shells-" + row.session_id});
          li.append(rows);
          for (const shell of shells) {
            const sb = childRow(row, "bg-shell", "shell\n" + shell.command);
            sb.append(metaIcon("shells"), stackOf(shell.label));
            sb.setAttribute("aria-label", `shell in ${row.label}: ${shell.command}`);
            const popKey = row.session_id + "\n" + shell.command;
            // A repaint puts the open popover back as the same node, so its
            // Copy state and any selection survive, and without the unfold:
            // re-inserting an element restarts its CSS animation.
            const kept = openShellKey === popKey && openMenu;
            const pop = kept || shellPopover([shell]);
            if (kept) pop.classList.add("kept");
            const place = () => { pop.style.top = sb.offsetTop + sb.offsetHeight + "px"; };
            sb.addEventListener("pointerdown", e => e.stopPropagation());
            sb.addEventListener("click", () => {
              if (openShellKey === popKey) { closeMenu(); return; }
              place();
              openShell(pop, popKey);
            });
            rows.append(sb);
            li.append(pop);
            if (openShellKey === popKey) {
              pop.hidden = false; openMenu = pop;
              requestAnimationFrame(place);
            }
          }
        }
      }
    }
    root.append(h, ul);
  }

  // A shell that has exited, or a session that closed, took its menu with it.
  if (openMenu && !openMenu.isConnected) { openMenu = null; openShellKey = null; openMenuKey = null; }
  if (menuFocus && menuFocus.isConnected) menuFocus.focus();

  // Keep the keyboard where it was across a repaint, or the list is unusable
  // the moment anything changes.
  if (keepId) {
    const again = root.querySelector(`[data-session-id="${CSS.escape(keepId)}"]`);
    if (again) again.focus();
  }
}

// Arrows move; Enter and Space activate (free, since rows are buttons).
// Cmd+Enter (or Ctrl+Enter) sends a newline to the focused session, which is
// what unblocks a Claude Code session sitting at a prompt. NOT Shift+Enter:
// iTerm2 claims that combination and it never reaches the page. Measured
// 2026-09-07 -- Alt, Meta and Ctrl with Enter all arrive, Shift with Enter
// does not.
//
// No letter keys. iTerm2 routes printable characters to the terminal and only
// passes navigation keys and modifiers through to a Toolbelt webview, so a
// j/k binding here would be silently dead. Measured 2026-09-07: pressing j and
// k produced no keydown at all, while ArrowDown, Meta and Shift arrived.
document.addEventListener("keydown", event => {
  // An open menu owns the arrows; the list behind it must not scroll away.
  if (openMenu && openMenu.contains(document.activeElement)) return;
  const rows = [...document.querySelectorAll("button.row")];
  if (!rows.length) return;
  const at = rows.indexOf(document.activeElement);

  if (event.key === "ArrowDown") {
    event.preventDefault();
    (rows[at + 1] || rows[0]).focus();
  } else if (event.key === "ArrowUp") {
    event.preventDefault();
    (at > 0 ? rows[at - 1] : rows[rows.length - 1]).focus();
  } else if (event.key === "Enter" && (event.metaKey || event.ctrlKey) && at >= 0) {
    event.preventDefault();
    act(rows[at].dataset.sessionId, "send", "\n");
  }
});

// ---------------------------------------------------------------- settings
let SETTINGS = null;
const SETTING_ROWS = [
  {head: "Sound"},
  {k: "sound",        label: "Play sounds", master: true},
  {k: "sound_blocked",label: "When a session is blocked", needs: "sound"},
  {k: "sound_done",   label: "When one finishes", needs: "sound"},
  {k: "volume",       label: "Volume", range: [0, 1, .05], needs: "sound", pct: true},
  {head: "Notifications"},
  {k: "notify",       label: "Show macOS notifications", master: true},
  {k: "notify_blocked", label: "When a session asks a question", needs: "notify"},
  {k: "notify_done",  label: "When one finishes", needs: "notify"},
  {head: "Focus"},
  {k: "focus_blocked", label: "Bring a blocked session forward", master: true},
  {k: "return_after_blocked", label: "Go back once it resumes", needs: "focus_blocked"},
  {head: "Rows"},
  {k: "context_threshold", label: "Warn above", range: [0, 100, 5], pct: true},
  {k: "cpu_threshold", label: "CPU heavy at", range: [25, 400, 25], pct: true},
  {k: "memory_threshold", label: "Memory heavy at", range: [0.5, 8, 0.5], unit: " GB"},
  {k: "sort_by_name", label: "Sort cards by name"},
  {k: "provider_mark", label: "Provider badge",
   choices: [["tag", "Tag by the name"], ["corner", "Icon in the corner"], ["groups", "Group by provider"], ["off", "Off"]]},
  {k: "show_branch",  label: "Branch"},
  {k: "show_task",    label: "Task"},
  {k: "show_task_activity", label: "What it is doing", needs: "show_task"},
  {k: "show_task_age", label: "How old the report is", needs: "show_task"},
  {k: "show_task_bar", label: "Progress bar", needs: "show_task"},
  {k: "show_model",   label: "Model"},
  {k: "show_agents",  label: "Subagents"},
  {k: "show_shells",  label: "Background shells"},
  {k: "expand_shells", label: "Start expanded", needs: "show_shells"},
  {k: "ui_scale",     label: "Text size",
   steps: [0.8, 0.9, 1, 1.1, 1.2, 1.3, 1.4, 1.5, 1.6]},
];

// Each control keeps a closure that repaints it from SETTINGS, so a change
// updates the sheet in place: rebuilding it would cut the fold of a group
// short and drop the focus the person was holding.
let SETTING_SYNC = [];

function settingCard(title, master) {
  const card = document.createElement("div");
  card.className = "set-card";
  const head = document.createElement("div");
  head.className = "set-title";
  const t = document.createElement("span");
  t.textContent = title;
  head.append(t);
  if (master) head.append(settingSwitch(master, "ink"));
  card.append(head);
  return card;
}

// A row's children sit in a box that folds shut when the row is off: the
// options do not apply, and the sheet says so by taking them away.
function settingKids(parentKey) {
  const kids = document.createElement("div");
  kids.className = "set-kids";
  const inner = document.createElement("div");
  kids.append(inner);
  SETTING_SYNC.push(() => kids.classList.toggle("off", !SETTINGS[parentKey]));
  return {kids, inner, of: parentKey};
}

function settingSwitch(row, tone) {
  const sw = document.createElement("button");
  sw.type = "button";
  sw.className = "sw" + (tone ? " " + tone : "");
  sw.setAttribute("role", "switch");
  sw.setAttribute("aria-label", row.label);
  sw.addEventListener("click", () => push({[row.k]: !SETTINGS[row.k]}));
  SETTING_SYNC.push(() => {
    sw.setAttribute("aria-checked", String(!!SETTINGS[row.k]));
    sw.disabled = !!(row.needs && !SETTINGS[row.needs]);
  });
  return sw;
}

function settingRow(row, kind) {
  const line = document.createElement("label");
  line.className = "set " + kind;
  const name = document.createElement("span");
  name.textContent = row.label;
  line.append(name);
  const off = () => !!(row.needs && !SETTINGS[row.needs]);

  if (row.choices) {
    const pick = document.createElement("select");
    pick.className = "pick";
    for (const [value, text] of row.choices) pick.append(new Option(text, value));
    pick.addEventListener("change", () => push({[row.k]: pick.value}));
    SETTING_SYNC.push(() => { pick.value = SETTINGS[row.k]; pick.disabled = off(); });
    line.append(pick);
  } else if (row.steps) {
    // Minus, the value, plus. Nine sizes is few enough to step through and
    // too few to be worth hunting for with a dragged thumb.
    const box = document.createElement("span");
    box.className = "step";
    const back = Object.assign(document.createElement("button"),
                               {type: "button", textContent: "−"});
    const now = document.createElement("span");
    now.className = "now";
    const on = Object.assign(document.createElement("button"),
                             {type: "button", textContent: "+"});
    back.setAttribute("aria-label", `Smaller ${row.label.toLowerCase()}`);
    on.setAttribute("aria-label", `Larger ${row.label.toLowerCase()}`);

    const nearest = value =>
      row.steps.reduce((best, s) =>
        Math.abs(s - value) < Math.abs(best - value) ? s : best, row.steps[0]);
    let at = 0;
    const paint = () => {
      at = row.steps.indexOf(nearest(Number(SETTINGS[row.k])));
      now.textContent = Number(row.steps[at]).toFixed(2).replace(/0$/, "") + "×";
      back.disabled = off() || at === 0;
      on.disabled = off() || at === row.steps.length - 1;
    };
    const move = by => {
      const next = Math.max(0, Math.min(row.steps.length - 1, at + by));
      if (next === at) return;
      // Applied before it is saved, so the size you are choosing is the
      // size you are looking at.
      if (row.k === "ui_scale") applyScale(row.steps[next]);
      push({[row.k]: row.steps[next]});
    };
    back.addEventListener("click", () => move(-1));
    on.addEventListener("click", () => move(1));
    SETTING_SYNC.push(paint);
    box.append(back, now, on);
    line.append(box);
  } else if (row.range) {
    // The task bar's ticks, not a thumb on a rail: a count of fifths that
    // reads at a glance, with the number shown while it is being dragged.
    const [min, max, step] = row.range;
    const ticks = document.createElement("span");
    ticks.className = "ticks";
    const bar = document.createElement("span");
    bar.className = "bar";
    const bub = document.createElement("span");
    bub.className = "bub";
    const slider = document.createElement("input");
    Object.assign(slider, {type: "range", min, max, step});
    slider.setAttribute("aria-label", row.label);
    const read = document.createElement("span");
    read.className = "val";
    const text = v => row.pct ? Math.round(v * (max <= 1 ? 100 : 1)) + "%" : v + (row.unit || "");
    const show = v => {
      const p = (v - min) / (max - min) * 100;
      ticks.style.setProperty("--p", p + "%");
      read.textContent = bub.textContent = text(v);
    };
    slider.addEventListener("input", () => show(Number(slider.value)));
    slider.addEventListener("change", () => push({[row.k]: Number(slider.value)}));
    SETTING_SYNC.push(() => {
      slider.value = SETTINGS[row.k];
      slider.disabled = off();
      show(Number(SETTINGS[row.k]));
    });
    ticks.append(bar, bub, slider);
    // Ticks and read-out travel together: when the row wraps, a number
    // stranded on a line of its own reads as a value for the row below.
    const ctl = document.createElement("span");
    ctl.className = "ctl";
    ctl.append(ticks, read);
    line.append(ctl);
  } else {
    line.append(settingSwitch(row, kind === "plain" ? "ink" : ""));
  }
  return line;
}

function settingsBody() {
  const box = document.getElementById("settings");
  box.textContent = "";
  SETTING_SYNC = [];
  // The drawer names itself the way the list's sections do.
  const title = document.createElement("h2");
  title.className = "set-name";
  title.textContent = "Settings";
  box.append(title);
  // A head opens a card. A master row sits in the card's title with its
  // options under it; any other row with options gets a fold of its own.
  let card = null, kids = null, i = 0;
  while (i < SETTING_ROWS.length) {
    const row = SETTING_ROWS[i++];
    if (row.head) {
      const master = SETTING_ROWS[i] && SETTING_ROWS[i].master ? SETTING_ROWS[i++] : null;
      card = settingCard(master ? master.label : row.head, master);
      box.append(card);
      kids = master ? settingKids(master.k) : null;
      if (kids) card.append(kids.kids);
      continue;
    }
    if (row.needs) {
      if (!kids || kids.of !== row.needs) {
        kids = settingKids(row.needs);
        card.append(kids.kids);
      }
      kids.inner.append(settingRow(row, "child"));
      continue;
    }
    kids = null;
    card.append(settingRow(row, "plain"));
    if (SETTING_ROWS[i] && SETTING_ROWS[i].needs === row.k) {
      kids = settingKids(row.k);
      card.append(kids.kids);
    }
  }
  syncSettings();
}

function syncSettings() {
  for (const sync of SETTING_SYNC) sync();
}

// The bar's left half: the release this panel runs, and, only while the
// mirror has a newer one, that number and the button that takes it. The line
// is rebuilt only when what it would say changes, so a click's state outlives
// the repaint two seconds later.
let releaseShown = null;
let releaseState = null;   // null, "taking", "restarting", or the refusal text
function paintVersion() {
  const key = `${LATEST.version}|${LATEST.update}|${releaseState}`;
  if (key === releaseShown) return;
  releaseShown = key;
  const bar = document.getElementById("release");
  bar.replaceChildren();
  bar.append(LATEST.version || "unreleased checkout");
  if (!LATEST.update) return;
  if (releaseState === "restarting") {
    bar.append(" · restarting, reopen the panel");
    return;
  }
  const refused = releaseState && releaseState !== "taking";
  if (refused) {
    // The refusal takes the words' place: the bar has one line, and the
    // button beside it says what was refused.
    const line = releaseState.trim().split("\n").pop();
    bar.append(" · ", Object.assign(document.createElement("span"),
                                   {className: "refused", textContent: line, title: releaseState}));
  } else {
    bar.append(` · ${LATEST.update} available`);
  }
  const take = Object.assign(document.createElement("button"), {className: "take", type: "button"});
  take.textContent = releaseState === "taking" ? "Updating…" : "Update";
  take.disabled = releaseState === "taking";
  take.title = `Pull release ${LATEST.update} into this checkout, run install.sh and restart the daemon`;
  take.addEventListener("click", takeRelease);
  bar.append(take);
}

function takeRelease() {
  releaseState = "taking";
  paintVersion();
  fetch(`/update?token=${encodeURIComponent(TOKEN)}`, {method: "POST"})
    .then(async r => {
      const body = await r.json().catch(() => ({}));
      releaseState = r.ok ? "restarting" : (body.error || `update failed (${r.status})`);
    })
    .catch(err => { releaseState = String(err); })
    .then(paintVersion);
}

function push(change) {
  SETTINGS = {...SETTINGS, ...change};
  syncSettings();
  render(LATEST);
  fetch(`/settings?token=${encodeURIComponent(TOKEN)}`,
        {method: "POST", body: JSON.stringify(change)})
    .then(r => r.json())
    .then(s => { SETTINGS = s; applyScale(s.ui_scale); syncSettings(); render(LATEST); })
    .catch(err => console.log("sidebar: settings save failed", err));
}

// The panel only re-reads page.html when it is opened; this saves the reopen.
// Reload also asks the daemon for fresh account readings first, within
// the reading floor; the reloaded page then paints them.
document.getElementById("reload").addEventListener("click", () => {
  fetch(`/accounts?token=${encodeURIComponent(TOKEN)}`, {method: "POST", body: JSON.stringify({op: "read"})})
    .catch(() => {}).finally(() => location.reload());
});

const gear = document.getElementById("gear");
// Slides up out of the gear bar and back down into it. The close waits for
// its own animation before hiding, and a click mid-slide reverses it.
let drawerMotion = null;
gear.addEventListener("click", () => {
  const box = document.getElementById("settings");
  const scrim = document.getElementById("scrim");
  const open = box.hidden || drawerMotion?.closing;
  gear.setAttribute("aria-expanded", String(open));
  drawerMotion?.cancel();
  drawerMotion = null;
  if (!MOTION.matches) { box.hidden = scrim.hidden = !open; return; }
  const shut = {transform: "translateY(24px)", opacity: 0};
  const shown = {transform: "none", opacity: 1};
  if (open) {
    box.hidden = scrim.hidden = false;
    box.animate([shut, shown], {duration: 200, easing: "cubic-bezier(.16,1,.3,1)"});
    scrim.animate([{opacity: 0}, {opacity: 1}], {duration: 200, easing: "ease-out"});
    return;
  }
  drawerMotion = box.animate([shown, shut], {duration: 140, easing: "ease-in", fill: "forwards"});
  drawerMotion.closing = true;
  const mine = drawerMotion;
  scrim.animate([{opacity: 1}, {opacity: 0}], {duration: 140, easing: "ease-in", fill: "forwards"});
  mine.finished.then(() => {
    if (drawerMotion !== mine) return;
    box.hidden = scrim.hidden = true;
    mine.cancel();
    for (const a of scrim.getAnimations()) a.cancel();
    drawerMotion = null;
  }, () => {});
});
document.getElementById("scrim").addEventListener("click", () => gear.click());
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !document.getElementById("settings").hidden) gear.click();
});

fetch(`/settings?token=${encodeURIComponent(TOKEN)}`)
  .then(r => r.json())
  .then(s => { SETTINGS = s; applyScale(s.ui_scale); settingsBody(); render(LATEST); })
  .catch(() => { SETTINGS = {}; });

// ------------------------------------------------------------------- sound
// Synthesised, because the page has no network and so no audio files. WebKit
// will not start an AudioContext without a gesture, so it is created on the
// first one and the first sounds before that are simply skipped.
let audio = null;
addEventListener("pointerdown", () => {
  if (!audio) { try { audio = new AudioContext(); } catch (e) { audio = false; } }
  if (audio && audio.state === "suspended") audio.resume();
}, {once: false});

function tone(steps, gain) {
  if (!audio || !SETTINGS || !SETTINGS.sound) return;
  const level = gain * (SETTINGS.volume ?? .4);
  steps.forEach(([hz, at, len], i) => {
    const osc = audio.createOscillator();
    const amp = audio.createGain();
    osc.type = "sine";
    osc.frequency.value = hz;
    const t0 = audio.currentTime + at;
    // A short attack and an exponential tail: a click on either end is what
    // makes a synthesised tone sound cheap.
    amp.gain.setValueAtTime(0.0001, t0);
    amp.gain.exponentialRampToValueAtTime(level, t0 + .012);
    amp.gain.exponentialRampToValueAtTime(0.0001, t0 + len);
    osc.connect(amp).connect(audio.destination);
    osc.start(t0);
    osc.stop(t0 + len + .02);
  });
}

// Rising pair: a question, and it wants an answer.
const soundBlocked = () => tone([[660, 0, .16], [880, .13, .26]], .22);
// Single soft note, falling away: something ended, nothing is being asked.
const soundDone    = () => tone([[520, 0, .34]], .10);

// Sound fires on a CHANGE of state, never on the state itself: a snapshot
// arrives every few seconds and re-announcing a standing state is how a
// notification becomes noise.
let lastStates = new Map();
// When each session's current turn began, from the row; a Stop hook that runs
// a command flips the session to working for a few seconds without starting
// a turn, and that must neither re-post a finished-turn notice nor take one
// down. Only a prompt moves working_since.
const turnStarts = new Map();
const announcedTurns = new Map();
function announce(snapshot) {
  const now = new Map();
  for (const g of snapshot.groups || []) {
    for (const r of g.rows) {
      now.set(r.session_id, r.state);
      if (r.working_since) turnStarts.set(r.session_id, r.working_since);
    }
  }
  if (lastStates.size) {
    let focused = false;
    for (const [id, state] of now) {
      const before = lastStates.get(id);
      if (state === before) continue;
      const turn = turnStarts.get(id);
      const newTurn = state === "working" && turn !== undefined && turn !== announcedTurns.get(id);
      const turnDone = state === "idle" && before === "working" && turn !== announcedTurns.get(id);
      if (state === "blocked") revealAfterPaint(id);
      if (state === "blocked" && SETTINGS?.sound_blocked) soundBlocked();
      else if (state === "idle" && before === "working" && SETTINGS?.sound_done) soundDone();
      // The banner reaches you in another application, where no sound or
      // focus move can. The daemon decides whether you are already looking
      // at the session; the page only says what happened. Going back to work
      // takes a standing notice down, so the list never lies about a session
      // that has since moved on.
      if (SETTINGS?.notify) {
        if (state === "blocked" && SETTINGS.notify_blocked) act(id, "notify", "blocked");
        else if (turnDone && SETTINGS.notify_done) { act(id, "notify", "done"); announcedTurns.set(id, turn); }
        else if (before === "blocked" || newTurn) act(id, "notify", "clear");
      }
      // One session per update: two blocking at once would otherwise each
      // take focus in turn, leaving you on whichever happened to be last.
      if (state === "blocked" && SETTINGS?.focus_blocked && !focused) {
        act(id, "bring");
        focused = true;
      }
      // The daemon goes back only if it brought you here and you are still
      // here, so this can be sent for every session that stops being blocked.
      if (before === "blocked" && SETTINGS?.focus_blocked && SETTINGS?.return_after_blocked) {
        act(id, "return");
      }
    }
  }
  lastStates = now;
}

// A question asked off the bottom of the list is a question you do not see.
// After the paint that draws the card hot, bring it to the nearest edge;
// a card already on screen stays where it is.
function revealAfterPaint(id) {
  requestAnimationFrame(() => {
    const card = document.querySelector(`[data-session-id="${CSS.escape(id)}"]`);
    const list = document.getElementById("groups");
    if (!card || !list) return;
    const c = card.getBoundingClientRect(), l = list.getBoundingClientRect();
    if (c.top < l.top || c.bottom > l.bottom) card.scrollIntoView({block: "nearest", behavior: "smooth"});
  });
}

const events = new EventSource(`/events?token=${encodeURIComponent(TOKEN)}`);
// A heartbeat proves the daemon is answering; its payload says whether what
// the daemon last read is current. An unfresh one paints STALE immediately
// rather than waiting out the timer, because the daemon already knows.
events.addEventListener("heartbeat", event => {
  let fresh = true;
  try { fresh = JSON.parse(event.data || "{}").fresh !== false; } catch (err) { }
  if (fresh) markFresh();
  else document.body.classList.add("stale");
});
events.onmessage = event => {
  markFresh();
  LATEST = JSON.parse(event.data);
  announce(LATEST);
  render(LATEST);
};
events.onerror = () => document.body.classList.add("stale");
markFresh();
</script>

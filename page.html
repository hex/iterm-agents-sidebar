// A level the picker does not have gets no letter rather than a guessed one.
const EFFORT_LETTERS = {low: "l", medium: "m", high: "h", xhigh: "xh", max: "mx"};

function metaIcon(kind) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 256 256");
  svg.setAttribute("fill", "currentColor");
  svg.setAttribute("aria-hidden", "true");
  svg.classList.add("mi");
  svg.innerHTML = META_ICONS[kind];
  return svg;
}

const STATE_TITLES = {
  silent: "no state reported yet",
  working: "working",
  idle: "idle",
  blocked: "needs your permission",
  unknown: "state unknown, the last writer is gone",
};
// A turn still working after this long may be stuck: it earns a badge.
const LONG_TURN_SECONDS = 20 * 60;
// Rows are rebuilt on every update, so a shimmer starts where the clock says
// the sweep has reached; every shimmer on the page then sweeps in step.
// Matches the idle-shimmer animation duration in the CSS.
const SHIMMER_MS = 2000;
const BREATHE_MS = 1900;
function syncShimmer(el) {
  el.style.setProperty("--shimmer-delay", `-${Date.now() % SHIMMER_MS}ms`);
}
// Same for the breath: a badge rebuilt every snapshot would otherwise start
// each breath from the top, twice a second short of a full one.
function syncBreathe(el) {
  el.style.setProperty("--breathe-delay", `-${Date.now() % BREATHE_MS}ms`);
}
// Heartbeat is every 4s server-side. Two missed, plus a second of slack.
const STALE_AFTER_MS = 9000;
// Below this there is room to spare and nothing to decide.
// Overridden by the stored setting once it loads.
const CONTEXT_SPEAKS_AT = 70;
const speaksAt = () => SETTINGS?.context_threshold ?? CONTEXT_SPEAKS_AT;

// Everything in the panel is sized in px off one stylesheet, so one zoom on
// the root scales type, icons, gaps and hairlines together. Growing only the
// text would leave it rattling inside furniture that stayed put.
function applyScale(value) {
  const scale = Number(value);
  document.documentElement.style.setProperty(
    "--scale", Number.isFinite(scale) ? Math.max(0.8, Math.min(1.6, scale)) : 1);
}

let staleTimer = null;
let LATEST = {groups: []};

function markFresh() {
  document.body.classList.remove("stale");
  clearTimeout(staleTimer);
  staleTimer = setTimeout(() => document.body.classList.add("stale"), STALE_AFTER_MS);
}

function act(sessionId, verb, text) {
  fetch(`/action?token=${encodeURIComponent(TOKEN)}`, {
    method: "POST",
    body: JSON.stringify({session_id: sessionId, verb, text}),
  }).catch(err => console.log("sidebar: action failed", err));
}

// Offered only on a session that is idle and nearly full: a command typed into
// a session mid-turn lands in the middle of whatever it is doing, and on a
// session with room to spare there is nothing to fix.
const typed = cmd => row => act(row.session_id, "send", cmd + "\n");
const HOUSEKEEPING = [
  {label: "/compact", hint: "summarise the conversation and keep working", run: typed("/compact")},
  {label: "/rotate", hint: "hand off to a fresh conversation", run: typed("/rotate")},
  {label: "/clear", hint: "discard the conversation", destructive: true, run: typed("/clear")},
];
// Every row can be closed, agent or not: it is the pane that goes.
const CLOSE = {label: "Close", hint: "close this pane", destructive: true,
               run: row => act(row.session_id, "close")};

// One menu at a time, and it closes on anything that means "not this". Two
// menus were open at once because opening one never told the others to shut.
let openMenu = null;
// Whose right-click menu is open, so a repaint can put that same menu back.
let openMenuKey = null;
function closeMenu() {
  if (!openMenu) return;
  openMenu.hidden = true;
  openMenu = null;
  openShellKey = null;
  openMenuKey = null;
}
document.addEventListener("pointerdown", () => { closeMenu(); hideCard(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeMenu(); });

// The hover card. One element reused by every row: a card per row would be
// dozens of blurred slabs in the layer tree for the one that is visible.
const card = Object.assign(document.createElement("div"), {id: "card"});
card.hidden = true;
document.body.append(card);
let cardTimer = null;

// Formatted here rather than in Python so they stay true between rebuilds:
// a countdown baked into a snapshot is wrong the moment it arrives.
function forHumans(seconds) {
  if (seconds == null) return null;
  const s = Math.max(0, Math.round(seconds));
  if (s < 60) return s + "s";
  if (s < 3600) return Math.round(s / 60) + "m";
  const hours = Math.floor(s / 3600);
  if (hours < 24) {
    const mins = Math.round((s % 3600) / 60);
    return mins ? `${hours}h ${mins}m` : `${hours}h`;
  }
  return Math.round(s / 86400) + "d";
}

const until = epoch =>
  epoch == null ? null : forHumans(epoch - Date.now() / 1000);

function fieldsFor(row) {
  const d = row.details || {};
  const pairs = [];
  const add = (icon, label, value) => {
    if (value === undefined || value === null) return;
    pairs.push({icon, label, value});
  };
  const gauge = (value, at) => value == null ? null : {
    percent: value,
    text: value + "%",
    // What the number is for: whether to wait for it or work around it.
    note: at ? "in " + until(at) : null,
  };
  add("gauge", "Context", gauge(row.context));
  add("clock", "5-hour", gauge(d.five_hour, d.five_hour_at));
  add("gauge", "Weekly", gauge(d.seven_day, d.seven_day_at));
  add("uptime", "Up", forHumans(row.uptime));
  add("shells", "Shells", row.shells?.length);
  add("model", "Subagents", row.agents);
  add("cost", "Cost", d.cost != null ? "$" + d.cost.toFixed(2) : null);
  // A warm cache is unremarkable. One about to expire, with a six-figure
  // rebuild behind it, is the most actionable number on the card.
  if (d.cache_hit != null) {
    const cold = d.cache_cold_at != null && d.cache_cold_at * 1000 < Date.now();
    add("cache", "Cache", {
      percent: d.cache_hit, text: d.cache_hit + "%", invert: true,
      note: cold ? (d.recache ? "cold, " + tokens(d.recache) + " to rebuild" : "cold")
                 : d.cache_cold_at ? "warm for " + until(d.cache_cold_at) : null,
      alarm: cold,
    });
  }
  if (d.lines_added || d.lines_removed) {
    add("lines", "Lines", `+${d.lines_added || 0} \u2212${d.lines_removed || 0}`);
  }
  return pairs;
}

const tokens = n =>
  n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? Math.round(n / 1e3) + "k" : String(n);

function showCard(row) {
  const d = row.details || {};
  const pairs = fieldsFor(row);
  // Nothing to say is better said by saying nothing.
  if (!pairs.length && !d.model) return;

  card.textContent = "";
  card.dataset.row = row.session_id;
  const who = Object.assign(document.createElement("div"), {className: "who"});
  who.textContent = d.session_name || row.label;
  card.append(who);

  if (d.model) {
    const sub = Object.assign(document.createElement("div"), {className: "sub"});
    sub.textContent = d.model;
    card.append(sub);
  }

  if (pairs.length) {
    const grid = Object.assign(document.createElement("dl"), {className: "grid"});
    for (const {icon, label, value} of pairs) {
      const dt = document.createElement("dt");
      if (icon) dt.append(metaIcon(icon));
      dt.append(document.createTextNode(label));

      // Inside the label cell, pushed right: a row stays one line whether it
      // carries a note or not.
      if (value && typeof value === "object" && value.note) {
        const note = document.createElement("span");
        note.className = "note" + (value.alarm ? " urgent" : "");
        note.textContent = value.note;
        dt.append(note);
      }

      const dd = document.createElement("dd");
      if (value && typeof value === "object") {
        // A budget: the bar carries how much is gone, the colour how much
        // that matters. Under 60 is nothing to look at.
        const pct = Math.max(0, Math.min(100, value.percent));
        // The cache reads the other way: a high hit ratio is the good end,
        // so its colours run in reverse.
        const heat = value.invert ? 100 - pct : pct;
        dd.className = "gauge " + (value.alarm || heat >= 90 ? "high"
                                 : heat >= 60 ? "mid" : "low");
        dd.style.setProperty("--fill", pct + "%");
        dd.textContent = value.text;
      } else {
        dd.textContent = value;
      }
      grid.append(dt, dd);
    }
    card.append(grid);
  }

  const flags = [];
  if (d.effort) flags.push([d.effort + " effort", "effort " + d.effort]);
  if (d.thinking) flags.push(["thinking", ""]);

  if (d.fast_mode) flags.push(["fast", "hot"]);
  // Says the conversation has passed 200k, not that the model has a big
  // window -- the subtitle already carries the model's size.
  if (d.beyond_200k) flags.push(["past 200k", "warn"]);
  if (flags.length) {
    const bar = Object.assign(document.createElement("div"), {className: "flags"});
    for (const [text, tone] of flags) {
      const f = Object.assign(document.createElement("span"),
                              {className: "flag" + (tone ? " " + tone : "")});
      f.textContent = text;
      bar.append(f);
    }
    card.append(bar);
  }

  card.hidden = false;
}

// Follows the pointer, but only downward-or-up and never sideways: the panel
// is 250px and the card is 208 of them, so horizontal freedom would just mean
// horizontal clipping. Vertical tracking is the part that helps, because it
// keeps the card next to the row being read rather than pinned to where the
// pointer first landed.
// Positioned by transform rather than top/left: the browser can move a
// composited layer without laying the page out again, which is what lets it
// keep up with the pointer instead of lagging a frame behind it.
function placeCard(x, y) {
  const w = card.offsetWidth;
  const h = card.offsetHeight;
  const pad = 4;
  // Below and to the right of the cursor, flipping to whichever side has
  // room. The card never covers the pointer, so the row stays readable.
  let left = x + 14;
  if (left + w > window.innerWidth - pad) left = x - w - 14;
  let top = y + 16;
  if (top + h > window.innerHeight - pad) top = y - h - 16;
  left = Math.max(pad, Math.min(left, window.innerWidth - w - pad));
  top = Math.max(pad, Math.min(top, window.innerHeight - h - pad));
  card.style.transform = `translate3d(${Math.round(left)}px, ${Math.round(top)}px, 0)`;
}

function hideCard() {
  clearTimeout(cardTimer);
  card.hidden = true;
}

function watchForCard(button, row) {
  // The row is carried on the element so one delegated listener can serve
  // every row. The old per-row version added a mousemove handler on each
  // mouseenter and removed none of them.
  button._row = row;
  button.addEventListener("focus", () => { showCard(row); atRow(button); });
  button.addEventListener("blur", hideCard);
}

// Anchored to a row rather than the pointer, for keyboard focus.
function atRow(button) {
  const box = button.getBoundingClientRect();
  placeCard(box.left + 12, box.bottom - 8);
}

// Which row the pointer is over right now, or null. The timer below reads it
// rather than trusting the row it was armed with: leaving the panel quickly
// used to let a card appear after the pointer had already gone, and since
// hiding depended on a further mousemove that was never coming, it stayed up
// until something else disturbed it.
let hoverRow = null;

// Long enough to need intent. A card that arrives while the pointer is merely
// passing over a row is noise, and at 110ms it arrived on every crossing --
// the panel is a list you scan, so most crossings mean nothing.
const CARD_DELAY_MS = 500;

function leaveRows() {
  hoverRow = null;
  hideCard();
}

// One listener for the whole list. Following the pointer means reading it on
// every move, so this must stay cheap: no layout reads beyond the card's own
// size, and no work at all when the pointer is not over a row.
document.addEventListener("mousemove", event => {
  const button = event.target.closest ? event.target.closest("button.row") : null;
  if (!button || !button._row) {
    leaveRows();
    return;
  }
  const row = button._row;
  hoverRow = row;

  if (!card.hidden && card.dataset.row === row.session_id) {
    placeCard(event.clientX, event.clientY);        // already up: just track
    return;
  }
  if (!card.hidden) {                               // sliding to another row
    showCard(row);                                  // swap contents, no wait
    placeCard(event.clientX, event.clientY);
    return;
  }
  clearTimeout(cardTimer);
  const {clientX, clientY} = event;
  cardTimer = setTimeout(() => {
    // Still the same row under the pointer, or the wait was for nothing.
    if (hoverRow !== row) return;
    showCard(row);
    placeCard(clientX, clientY);
  }, CARD_DELAY_MS);
}, true);

// Exit events, for when they arrive. mouseleave on document does not fire; it
// has to be the root element.
document.documentElement.addEventListener("mouseleave", leaveRows);
document.addEventListener("mouseout", event => {
  if (!event.relatedTarget) leaveRows();
}, true);
window.addEventListener("blur", leaveRows);
document.addEventListener("scroll", leaveRows, true);

// And the part that actually holds, because none of the above can be relied
// on. This page is a WKWebView embedded in a native toolbelt, and a pointer
// leaving that view often produces no event in the page at all -- the moves
// simply stop. A card shown on the way out then had nothing left to dismiss
// it and sat there until something else disturbed the page.
//
// So ask instead of waiting to be told: :hover is the browser's own hit test,
// which it maintains whether or not it sends us anything. Cheap enough to poll
// -- one selector match, and only while a card is actually up.
setInterval(() => {
  if (card.hidden) return;
  if (!document.querySelector("button.row:hover")) leaveRows();
}, 200);

// Returns the menu for a row. The row opens it on right-click, which
// also fires for Shift+F10 on a focused row, so the keyboard keeps a way in.
function menuFor(row, group) {
  // Every agent row carries the housekeeping commands, whatever it is doing.
  // The menu was once gated on idle and a high context figure, which meant
  // the control was missing at the moment you went looking for it. A shell
  // has no conversation to compact, so it gets Close alone.
  const items = group.name === "AGENTS" ? [...HOUSEKEEPING, CLOSE] : [CLOSE];

  const menu = document.createElement("div");
  menu.hidden = true;
  menu.className = "menu";
  menu.setAttribute("role", "menu");

  items.forEach(({label, hint, destructive, run}, i) => {
    // A hairline before the destructive ones, so the pointer has to cross a
    // boundary to reach them rather than sliding into them.
    if (destructive && i && !items[i - 1].destructive) menu.append(Object.assign(
      document.createElement("div"), {className: "sep"}));

    const item = document.createElement("button");
    item.type = "button";
    item.setAttribute("role", "menuitem");
    item.textContent = label;
    item.title = hint;
    if (destructive) item.classList.add("danger");
    item.addEventListener("click", event => {
      event.stopPropagation();     // the row underneath focuses the session
      if (destructive && !item.classList.contains("armed")) {
        item.classList.add("armed");
        item.textContent = "click to confirm";
        setTimeout(() => {
          item.classList.remove("armed");
          item.textContent = label;
        }, 4000);
        return;
      }
      run(row);
      closeMenu();
    });
    menu.append(item);
  });

  menu.addEventListener("pointerdown", e => e.stopPropagation());
  return menu;
}

// Which shell's command is open, so a repaint can put it back. The list is
// rebuilt on every update, and a popover that vanished mid-read or mid-copy
// would be worse than having none.
let openShellKey = null;

function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(text);
  }
  const area = Object.assign(document.createElement("textarea"), {value: text});
  document.body.append(area);
  area.select();
  const ok = document.execCommand("copy");
  area.remove();
  return ok ? Promise.resolve() : Promise.reject(new Error("copy refused"));
}

// Every background shell of one session, each whole and each with its own
// Copy, under the card's summary line.
function shellPopover(shells) {
  const pop = document.createElement("div");
  pop.hidden = true;
  pop.className = "menu shell-pop";
  pop.setAttribute("role", "dialog");
  pop.setAttribute("aria-label", "background shell commands");
  for (const {command} of shells) {
    const entry = Object.assign(document.createElement("div"), {className: "cmd"});
    const code = document.createElement("code");
    code.textContent = command;
    const copy = document.createElement("button");
    copy.type = "button";
    copy.textContent = "Copy";
    copy.addEventListener("click", event => {
      event.stopPropagation();
      // Says what happened either way: a copy that silently failed would be
      // found out only at the paste.
      copyText(command).then(() => { copy.textContent = "Copied"; },
                             () => { copy.textContent = "Copy failed"; });
      setTimeout(() => { copy.textContent = "Copy"; }, 1500);
    });
    entry.append(code, copy);
    pop.append(entry);
  }
  pop.addEventListener("pointerdown", e => e.stopPropagation());
  return pop;
}

function openShell(pop, key) {
  closeMenu();
  hideCard();
  pop.classList.remove("kept");
  pop.hidden = false;
  openMenu = pop;
  openShellKey = key;
}

function openMenuAt(menu, li, event, key) {
  // Option-right-click keeps the WebView's own menu, for Reload and Inspect.
  if (event.altKey) return;
  event.preventDefault();
  closeMenu();
  hideCard();
  const box = li.getBoundingClientRect();
  // A keyboard-opened contextmenu reports no pointer; hang it off the row.
  const x = event.clientX || box.left + 12;
  const y = event.clientY || box.bottom;
  menu.hidden = false;
  // Clamp inside the panel, which is often narrower than row + menu.
  const maxX = document.documentElement.clientWidth - menu.offsetWidth - 4;
  menu.style.left = Math.max(4, Math.min(x, maxX)) - box.left + "px";
  menu.style.top = y - box.top + "px";
  menu.classList.remove("kept");
  openMenu = menu;
  openMenuKey = key;
  menu.querySelector("button").focus();
}

// The list is rebuilt whole on every update, so without this a row that
// appears shoves its neighbours down in one frame and one that leaves snaps
// them up. FLIP: measure every card and every line inside it before the
// rebuild, then play the change: what left fades out while cards resize and
// slide to where they are, and what arrived fades in as the move settles, so
// the eye reads one motion. Transform and opacity, plus a card's
// own height, which is the resize. Offsets, not client rects: the text-size
// control zooms the page, and engines disagree on whether a client rect is
// reported before or after that zoom.
const MOTION = window.matchMedia("(prefers-reduced-motion: no-preference)");
const MOVE = {duration: 180, easing: "cubic-bezier(.2,.8,.2,1)", id: "flip"};
const FADE = {duration: 120, easing: "ease-out", id: "flip"};

function measureRows() {
  // A snapshot that lands mid-motion would otherwise read heights and
  // offsets part way through the last change, and the next change would
  // start from there and jump. Settle the old one first.
  for (const a of document.getAnimations()) if (a.id === "flip") a.finish();
  const rows = new Map();
  for (const li of document.querySelectorAll("#groups li[data-key]")) {
    const lines = new Map();
    for (const el of li.querySelectorAll("[data-child-key]")) {
      lines.set(el.dataset.childKey, {el, top: el.offsetTop, holder: el.parentElement.className});
    }
    rows.set(li.dataset.key, {li, top: li.offsetTop, left: li.offsetLeft,
                              width: li.offsetWidth, height: li.offsetHeight, lines});
  }
  return rows;
}

function animateRows(before) {
  // The first paint has nothing to move from, and a list that fades in
  // row by row on open is ceremony.
  if (!MOTION.matches || !before.size) return;
  const cards = [...document.querySelectorAll("#groups li[data-key]")];
  const now = new Map(cards.map(li => [li.dataset.key, li]));

  // Plan first, so each beat knows whether the one before it happens at all.
  const leaving = [], entering = [], moving = [], resizing = [], lineMoves = [];
  for (const [key, old] of before) {
    const li = now.get(key);
    if (!li) { leaving.push({kind: "card", ...old}); continue; }
    const here = new Set();
    for (const el of li.querySelectorAll("[data-child-key]")) {
      const was = old.lines.get(el.dataset.childKey);
      here.add(el.dataset.childKey);
      if (!was) entering.push(el);
      else if (Math.abs(was.top - el.offsetTop) >= 1) lineMoves.push({el, dy: was.top - el.offsetTop});
    }
    for (const [childKey, line] of old.lines) {
      if (!here.has(childKey)) leaving.push({kind: "line", li, ...line});
    }
    const dy = old.top - li.offsetTop;
    if (Math.abs(dy) >= 1) moving.push({li, dy});
    if (Math.abs(old.height - li.offsetHeight) >= 1) resizing.push({li, from: old.height, to: li.offsetHeight});
  }
  for (const li of cards) if (!before.has(li.dataset.key)) entering.push(li);

  if (!leaving.length && !entering.length && !moving.length && !resizing.length && !lineMoves.length) return;
  // Beats overlap: what leaves fades while the rest is already moving, and
  // what arrives fades in over the move's last third, so one change reads
  // as one motion of about a quarter second rather than three in a row.
  const settleAt = 0;
  const shifts = moving.length || resizing.length || lineMoves.length;
  const arriveAt = shifts ? Math.round(MOVE.duration * 2 / 3) : (leaving.length ? FADE.duration / 2 : 0);

  // Beat one. A card that left is put back where it was, above the list; a
  // line that left is put back inside its card, in a holder with its old
  // parent's class so it keeps its indent. Both fade out there.
  for (const gone of leaving) {
    let node = gone.li;
    if (gone.kind === "card") {
      Object.assign(node.style, {position: "absolute", top: gone.top + "px", left: gone.left + "px",
                                 width: gone.width + "px", margin: 0, pointerEvents: "none", zIndex: 5});
      document.body.append(node);
    } else {
      // Out of the next measurement, or a repaint mid-fade would fade it twice.
      delete gone.el.dataset.childKey;
      node = Object.assign(document.createElement("div"), {className: gone.holder});
      Object.assign(node.style, {position: "absolute", top: gone.top + "px", left: 0, right: 0,
                                 margin: 0, pointerEvents: "none", zIndex: 1});
      node.append(gone.el);
      gone.li.append(node);
    }
    node.animate([{opacity: 1}, {opacity: 0}], {...FADE, fill: "forwards"})
      .finished.finally(() => node.remove());
  }

  // Beat two. Cards hold their old height through the fade, then ease to the
  // new one, clipped so a growing card never shows what has not arrived yet.
  for (const {li, from, to} of resizing) {
    li.style.overflow = "clip";
    li.animate([{height: from + "px"}, {height: to + "px"}], {...MOVE, delay: settleAt, fill: "backwards"})
      .finished.finally(() => { li.style.overflow = ""; });
  }
  for (const {li, dy} of moving) {
    li.animate([{transform: `translateY(${dy}px)`}, {transform: "none"}],
               {...MOVE, delay: settleAt, fill: "backwards"});
  }
  for (const {el, dy} of lineMoves) {
    el.animate([{transform: `translateY(${dy}px)`}, {transform: "none"}],
               {...MOVE, delay: settleAt, fill: "backwards"});
  }

  // Beat three.
  for (const el of entering) {
    el.animate([{opacity: 0}, {opacity: 1}], {...FADE, delay: arriveAt, fill: "backwards"});
  }
}

function render(snapshot) {
  const before = measureRows();
  paint(snapshot);
  paintQueue(snapshot);
  paintBudget(snapshot);
  fitMeta();
  animateRows(before);
}

// The session's own account of its work. Self-reported, so the age is
// part of the reading: a report over five minutes old is shown as stale.
const TASK_STALE_AFTER = 300;
function taskLine(task) {
  const stale = !task.done && task.age >= TASK_STALE_AFTER;
  const line = Object.assign(document.createElement("span"), {className: "task" + (stale ? " stale" : "")});
  const age = task.age < 60 ? `${Math.max(0, Math.round(task.age))}s` : waited(Date.now() / 1000 - task.age);
  const el = (cls, text) => Object.assign(document.createElement("span"), {className: cls, textContent: text});
  const on = key => SETTINGS?.[key] !== false;
  const title = el("task-title", task.title || "");
  title.title = task.title || "";
  line.append(title);

  // What it is doing and how old that report is. Each piece is the session's
  // own claim and each can be turned off; what is off is never drawn, so the
  // separators fall to whatever is left.
  const status = el("task-status", "");
  const spoken = [];
  if (task.done) {
    status.append(el("task-done", "Done"));
    spoken.push("Done");
  } else {
    if (task.activity && on("show_task_activity")) {
      status.append(el("task-activity", task.activity));
      spoken.push(task.activity);
    }
    if (on("show_task_age")) {
      // The age wears a clock, so it reads as "reported this long ago" and
      // not as one more figure the session claimed.
      const when = el("task-age", "");
      when.append(metaIcon("clock"), document.createTextNode(age));
      status.append(when);
      spoken.push(age);
    }
    // Staleness stays whatever else is hidden: it is the line's own warning
    // that nobody has refreshed what it says.
    if (stale) { status.append(el("task-stale", "stale")); spoken.push("stale"); }
  }
  status.title = task.done ? "The session reported this task finished"
    : `The session's own estimate, reported ${age} ago`;
  if (status.childElementCount) line.append(status);

  if (!task.done && typeof task.percent === "number" && on("show_task_bar")) {
    const pct = Math.max(0, Math.min(100, task.percent));
    const bar = el("task-bar", "");
    const fill = el("task-bar-fill", "");
    fill.style.width = pct + "%";
    bar.append(fill);
    bar.title = `about ${pct}% done, the session's own estimate`;
    line.append(bar);
    spoken.push(`about ${pct}% done`);
  }
  line.dataset.spoken = `task ${task.title || ""}: ${spoken.join(", ")}`;
  return line;
}

// Coarse on purpose: the queue orders by how long, it does not time anyone.
// Recomputed only when a snapshot repaints, so nothing on it ticks.
function waited(since) {
  if (since == null) return null;
  const s = Math.round(Date.now() / 1000 - since);
  if (s < 60) return "<1m";
  if (s < 3600) return Math.floor(s / 60) + "m";
  if (s < 86400) return Math.floor(s / 3600) + "h";
  return Math.floor(s / 86400) + "d";
}

const QUEUE_ROWS = 3;

function paintQueue(snapshot) {
  const box = document.getElementById("queue");
  box.textContent = "";
  const waiting = snapshot.groups.flatMap(g => g.rows).filter(r => IS_EXCEPTION(r.state));
  // Nothing waiting is said by the section not being there.
  box.hidden = !waiting.length;
  if (!waiting.length) return;

  // Oldest first. A row with no start time cannot claim a place in the line,
  // so it goes to the back.
  waiting.sort((a, b) => (a.blocked_since ?? Infinity) - (b.blocked_since ?? Infinity));

  const h = document.createElement("h3");
  const n = Object.assign(document.createElement("span"),
                          {className: "n", textContent: waiting.length});
  h.append("Waiting on you · ", n);
  const ul = document.createElement("ul");
  for (const row of waiting.slice(0, QUEUE_ROWS)) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "qrow";
    const mark = Object.assign(document.createElement("span"), {className: "swatch"});
    if (SESSION_COLOURS[row.colour]) mark.style.setProperty("--hue", SESSION_COLOURS[row.colour]);
    const label = Object.assign(document.createElement("span"),
                                {className: "label", textContent: row.label});
    b.append(mark, label);
    const ago = waited(row.blocked_since);
    if (ago) b.append(Object.assign(document.createElement("span"),
                                    {className: "ago", textContent: ago}));
    b.setAttribute("aria-label", [row.label, "waiting", ago && `for ${ago}`]
                                   .filter(Boolean).join(" "));
    b.addEventListener("click", () => act(row.session_id, "focus"));
    const li = document.createElement("li");
    li.append(b);
    ul.append(li);
  }
  box.append(h, ul);
  const rest = waiting.length - QUEUE_ROWS;
  if (rest > 0) {
    box.append(Object.assign(document.createElement("div"),
                             {className: "more", textContent: `+${rest} more`}));
  }
}

const BUDGET_WINDOWS = [
  {label: "5-hour", used: "five_hour", at: "five_hour_at", seconds: 5 * 3600},
  {label: "Weekly", used: "seven_day", at: "seven_day_at", seconds: 7 * 86400},
];
let accountNotice = "";

const clock = at => {
  const when = new Date(at * 1000);
  return String(when.getHours()).padStart(2, "0") + ":" + String(when.getMinutes()).padStart(2, "0");
};

// One window as a labelled hairline: fill for what is used, an optional tick
// where an even spend would be, and the reset as a clock time or a weekday.
// A span of seconds in its largest whole unit: "5d", "2h", "14m", "<1m".
function duration(seconds) {
  if (seconds >= 86400) return `${Math.floor(seconds / 86400)}d`;
  if (seconds >= 3600) return `${Math.floor(seconds / 3600)}h`;
  if (seconds >= 60) return `${Math.floor(seconds / 60)}m`;
  return "<1m";
}

// How long until a reset: "5d", "2h", "14m", or "now" once it has passed.
function untilReset(at, now) {
  return at - now <= 0 ? "now" : duration(at - now);
}

function meterRow(label, used, at, {tick = null, ahead = false} = {}) {
  used = Math.max(0, Math.min(100, used));
  const row = document.createElement("div");
  row.className = "win";
  if (ahead) row.classList.add("ahead");
  const name = Object.assign(document.createElement("span"), {className: "wl", textContent: label});
  const track = Object.assign(document.createElement("span"), {className: "track"});
  const fill = Object.assign(document.createElement("span"), {className: "fill"});
  fill.style.width = used + "%";
  if (used >= 90) row.classList.add("near");
  else if (used >= 70) row.classList.add("climbing");
  track.append(fill);
  if (tick != null) {
    const mark = Object.assign(document.createElement("span"), {className: "tick"});
    mark.style.left = Math.max(0, Math.min(100, tick)) + "%";
    track.append(mark);
  }
  const pct = Object.assign(document.createElement("span"), {className: "pct", textContent: Math.round(used) + "%"});
  if (ahead) pct.setAttribute("aria-label", `${Math.round(used)}%, ahead of pace`);
  const reset = Object.assign(document.createElement("span"), {className: "at"});
  if (at) {
    const when = new Date(at * 1000);
    reset.textContent = untilReset(at, Date.now() / 1000);
    row.title = `${label}: ${Math.round(used)}% used${ahead ? ", ahead of pace" : ""}, resets `
      + when.toLocaleString(undefined, {weekday: "short", month: "short",
          day: "numeric", hour: "2-digit", minute: "2-digit"});
  }
  row.append(name, track, pct, reset);
  return row;
}

// An account's windows: the 5-hour with its reset time, then every weekly
// window, the overall one and each per-model limit, with cswap's pace rule.
function accountMeters(account) {
  const rows = [];
  if (account.five_hour) rows.push(meterRow("5-hour", account.five_hour.used, account.five_hour.resets_at));
  const weeklies = [];
  if (account.seven_day) weeklies.push(["Weekly", account.seven_day]);
  for (const m of account.models || []) weeklies.push([m.name, m]);
  for (const [label, w] of weeklies) {
    rows.push(meterRow(label, w.used, w.resets_at,
      {tick: w.pace?.expected ?? null, ahead: !!w.pace?.ahead}));
  }
  return rows;
}

// Why an account's figures are not current, in words, or "" when they are.
function accountStatus(account) {
  if (account.needs_login) return `log in to ${account.name} again`;
  if (account.fetched_at == null) return account.outcome ? "no reading yet" : "reading...";
  if (account.outcome && account.outcome !== "ok") return `as of ${clock(account.fetched_at)}`;
  return "";
}

function addAccount() {
  accountNotice = "adding...";
  paintBudget(lastSnapshot);
  fetch(`/accounts?token=${encodeURIComponent(TOKEN)}`, {method: "POST", body: JSON.stringify({op: "add"})})
    .then(r => r.json())
    .then(reply => { accountNotice = reply.error ? `could not add: ${reply.error}` : `added ${reply.account.name}`; })
    .catch(() => { accountNotice = "could not add: the panel lost its daemon"; })
    .finally(() => paintBudget(lastSnapshot));
}

let armedSwitch = null;
let disarmTimer = null;
// The inactive account the pointer is over. WebKit leaves a rebuilt element
// without :hover until the mouse moves, so the page keeps the state itself.
let hoveredAccount = null;

// Arms on the first click and switches on the second, like Close: a switch
// changes the login of every running session. Arming changes the button in
// place; a repaint from a snapshot rebuilds it in the same state.
function switchButton(account) {
  const button = Object.assign(document.createElement("button"),
    {className: "acct-switch", type: "button"});
  const label = document.createTextNode("");
  button.innerHTML = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4h8M7.5 1.5 10 4 7.5 6.5M10 8H2M4.5 5.5 2 8l2.5 2.5"/></svg>';
  button.append(label);
  const show = () => {
    const armed = armedSwitch === account.id;
    label.textContent = armed ? "Confirm switch" : "Switch";
    button.setAttribute("aria-label", armed ? `confirm switching to ${account.name}` : `switch to ${account.name}`);
    button.classList.toggle("armed", armed);
  };
  show();
  button.addEventListener("click", () => {
    clearTimeout(disarmTimer);
    if (armedSwitch !== account.id) {
      armedSwitch = account.id;
      disarmTimer = setTimeout(() => { armedSwitch = null; show(); }, 4000);
      show();
      return;
    }
    armedSwitch = null;
    accountNotice = `switching to ${account.name}...`;
    paintBudget(lastSnapshot);
    fetch(`/accounts?token=${encodeURIComponent(TOKEN)}`,
          {method: "POST", body: JSON.stringify({op: "switch", account_id: account.id})})
      .then(r => r.json())
      .then(reply => {
        accountNotice = reply.error ? `not switched: ${reply.error}`
          : `switched to ${reply.account.name}; running sessions pick it up within about 30 s`;
      })
      .catch(() => { accountNotice = "not switched: the panel lost its daemon"; })
      .finally(() => paintBudget(lastSnapshot));
  });
  return button;
}

// Which account's name is being edited. A repaint leaves the strip alone
// while its field has focus, so a snapshot arriving mid-typing keeps the text.
let renamingAccount = null;

function renameAccount(account, text) {
  renamingAccount = null;
  accountNotice = "renaming...";
  paintBudget(lastSnapshot);
  fetch(`/accounts?token=${encodeURIComponent(TOKEN)}`,
        {method: "POST", body: JSON.stringify({op: "rename", account_id: account.id, alias: text})})
    .then(r => r.json())
    .then(reply => { accountNotice = reply.error ? `not renamed: ${reply.error}` : `renamed to ${reply.account.name}`; })
    .catch(() => { accountNotice = "not renamed: the panel lost its daemon"; })
    .finally(() => paintBudget(lastSnapshot));
}

// An account's name; clicking it turns it into a field. Enter saves, Escape
// or leaving the field cancels, and an empty name goes back to the default.
function accountName(account, className, suffix = "") {
  if (renamingAccount === account.id) {
    const field = Object.assign(document.createElement("input"),
      {className: `${className} acct-rename`, type: "text", value: account.alias ?? "",
       placeholder: account.default_name, maxLength: 40});
    field.setAttribute("aria-label", `nickname for ${account.name}`);
    field.addEventListener("keydown", event => {
      event.stopPropagation();
      if (event.key === "Enter") renameAccount(account, field.value);
      else if (event.key === "Escape") { renamingAccount = null; paintBudget(lastSnapshot); }
    });
    field.addEventListener("blur", () => {
      if (renamingAccount !== account.id) return;
      renamingAccount = null;
      paintBudget(lastSnapshot);
    });
    requestAnimationFrame(() => { field.focus(); field.select(); });
    return field;
  }
  const name = Object.assign(document.createElement("button"),
    {className, type: "button", textContent: account.name + suffix, title: "Click to rename"});
  name.addEventListener("click", event => {
    event.stopPropagation();
    renamingAccount = account.id;
    paintBudget(lastSnapshot);
  });
  return name;
}

function addButton() {
  const add = Object.assign(document.createElement("button"),
    {className: "acct-add", type: "button", textContent: "Add this account"});
  add.title = "Store the login Claude Code is using now, so the panel can meter it";
  add.addEventListener("click", addAccount);
  return add;
}

// The account the sessions run on, then every other stored account with its
// own meters. Figures come from the daemon's own readings.
function paintAccounts(strip, store) {
  const active = store.accounts.find(a => a.active);
  const head = Object.assign(document.createElement("div"), {className: "acct-line"});
  head.append(providerIcon("claude", "Claude"), active ? accountName(active, "acct-name")
    : Object.assign(document.createElement("span"), {className: "acct-name", textContent: "not a stored login"}));
  // The login every session runs on.
  if (active && renamingAccount !== active.id) {
    const check = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    check.setAttribute("viewBox", "0 0 256 256");
    check.setAttribute("class", "acct-badge");
    check.setAttribute("role", "img");
    check.setAttribute("aria-label", "active");
    check.innerHTML = '<path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm45.66,85.66-56,56a8,8,0,0,1-11.32,0l-24-24a8,8,0,0,1,11.32-11.32L112,148.69l50.34-50.35a8,8,0,0,1,11.32,11.32Z"/>';
    head.append(check);
  }
  strip.append(head);

  if (active) {
    const status = accountStatus(active);
    if (status) strip.append(Object.assign(document.createElement("div"), {className: "acct-status", textContent: status}));
    strip.append(...accountMeters(active));
  }

  const list = Object.assign(document.createElement("div"), {className: "acct-list"});
  for (const account of store.accounts.filter(a => !a.active)) {
    const item = Object.assign(document.createElement("div"), {className: "acct-item"});
    const itemHead = Object.assign(document.createElement("div"), {className: "acct-item-head"});
    itemHead.append(providerIcon("claude", "Claude"), accountName(account, "acct-item-name"));
    item.append(itemHead);
    const status = accountStatus(account);
    if (status) item.append(Object.assign(document.createElement("div"), {className: "acct-status", textContent: status}));
    item.append(...accountMeters(account));
    if (active && !account.needs_login) {
      const veil = Object.assign(document.createElement("div"), {className: "acct-veil"});
      veil.append(switchButton(account));
      item.append(veil);
      item.addEventListener("mouseenter", () => { hoveredAccount = account.id; item.classList.add("hover"); });
      item.addEventListener("mouseleave", () => {
        hoveredAccount = null; item.classList.remove("hover", "settled");
      });
      if (hoveredAccount === account.id) {
        item.classList.add("hover", "settled");
        requestAnimationFrame(() => requestAnimationFrame(() => item.classList.remove("settled")));
      }
    }
    list.append(item);
  }
  if (!active) list.append(addButton());
  if (accountNotice) list.append(Object.assign(document.createElement("div"), {className: "acct-status", textContent: accountNotice}));
  strip.append(list);
}

// Rate limits from the sessions' own status lines, for when no account is
// stored yet. Account-wide figures repeat on every session with bridge data;
// the highest is the safe reading, and a session with none is skipped.
function paintSessionBudget(strip, reporting) {
  const now = Date.now() / 1000;
  for (const w of BUDGET_WINDOWS) {
    const best = reporting.filter(d => d[w.used] != null)
      .reduce((a, d) => (a && a[w.used] >= d[w.used] ? a : d), null);
    if (!best) continue;
    const used = best[w.used];
    const at = best[w.at];
    const elapsed = at ? Math.max(0, Math.min(1, 1 - (at - now) / w.seconds)) : null;
    strip.append(meterRow(w.label, used, at, {
      tick: elapsed == null ? null : elapsed * 100,
      ahead: elapsed != null && used / 100 > elapsed && used >= 80}));
  }
}

function providerIcon(kind, label) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("class", `provider ${kind}`);
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", label);
  svg.innerHTML = PROVIDER_ICONS[kind];
  return svg;
}

// Codex's own limits, as its session logs last reported them.
function paintCodex(strip, limits) {
  const block = Object.assign(document.createElement("div"), {className: "codex"});
  block.append(Object.assign(document.createElement("div"), {className: "acct-line"}));
  block.firstChild.append(providerIcon("openai", "OpenAI"),
    Object.assign(document.createElement("span"), {className: "acct-name", textContent: "Codex"}));
  for (const w of limits.windows) {
    block.append(meterRow(w.label, w.used, w.resets_at,
      {tick: w.pace?.expected ?? null, ahead: !!w.pace?.ahead}));
  }
  strip.append(block);
}

let lastSnapshot = {groups: []};
// Countdowns move on their own; the daemon only pushes when its data changes.
setInterval(() => paintBudget(lastSnapshot), 30000);
// A stuck turn stops sending updates, so its badge has to appear on a clock.
setInterval(() => { if (lastSnapshot.groups.length) render(lastSnapshot); }, 60000);
function paintBudget(snapshot) {
  lastSnapshot = snapshot;
  const strip = document.getElementById("budget");
  const reporting = (snapshot.groups || []).flatMap(g => g.rows || [])
    .map(r => r.details).filter(Boolean);
  const store = snapshot.accounts;
  if (renamingAccount && strip.contains(document.activeElement)) return;
  strip.replaceChildren();

  if (store?.error) {
    strip.append(Object.assign(document.createElement("div"), {className: "acct-status",
      textContent: `accounts hidden: ${store.error}`}));
  } else if (store?.accounts?.length) {
    paintAccounts(strip, store);
  } else {
    paintSessionBudget(strip, reporting);
    if (store) {
      strip.append(addButton());
      if (accountNotice) strip.append(Object.assign(document.createElement("div"), {className: "acct-status", textContent: accountNotice}));
    }
  }

  if (snapshot.codex?.windows?.length) paintCodex(strip, snapshot.codex);

  strip.hidden = strip.childElementCount === 0;
  paintCost(reporting);
}

// The bar's left half: what the sessions have spent, and how many say so.
function paintCost(reporting) {
  const cost = document.getElementById("cost");
  cost.replaceChildren();
  const costs = reporting.filter(d => d.cost != null);
  cost.hidden = !costs.length;
  if (costs.length) {
    const total = costs.reduce((sum, d) => sum + d.cost, 0);
    const n = costs.length;
    const spent = Object.assign(document.createElement("span"), {className: "mchip"});
    spent.append(metaIcon("cost"), document.createTextNode(`$${total.toFixed(2)}`));
    spent.title = "Cost so far of the running Claude Code sessions, at API prices";
    const count = Object.assign(document.createElement("span"), {className: "mchip"});
    count.append(metaIcon("shells"), document.createTextNode(`${n} session${n === 1 ? "" : "s"}`));
    count.title = `${n} Claude Code session${n === 1 ? " reports" : "s report"} a cost`;
    cost.append(spent, count);
    cost.setAttribute("aria-label", `$${total.toFixed(2)} spent at API prices across ${n} session${n === 1 ? "" : "s"}`);
  }
}

// A line that cannot fit even with its branch at two characters drops the
// branch outright. The alternative is the context figure running off the
// panel, and a branch is the one item on the line you can read elsewhere.
function fitMeta() {
  for (const line of document.querySelectorAll("#groups .model")) {
    const branch = line.querySelector(".mchip.branch");
    if (!branch) continue;
    branch.hidden = false;
    if (line.scrollWidth > line.clientWidth) branch.hidden = true;
  }
}
window.addEventListener("resize", fitMeta);

// The indented block inside a card that holds its teammates, subagents and
// shells, made on first use.
function childrenOf(card) {
  let kids = card.querySelector(":scope > .children:not(.shell-rows)");
  if (!kids) {
    kids = Object.assign(document.createElement("div"), {className: "children"});
    card.insertBefore(kids, card.querySelector(":scope > .shell-sum"));
  }
  return kids;
}

// Cards whose shells are shown the other way from the Expand shells setting,
// by session id, so a repaint keeps what you opened or closed.
const flippedShells = new Set();
// When a session's last shell ended. Its commands line stays for a few
// seconds after, quiet, so a run of short commands reads as one line whose
// count changes rather than a card that grows and shrinks on each of them.
const SHELL_LINGER_MS = 4000;
const shellsHad = new Map();      // session -> how many shells it last had
const shellsEndedAt = new Map();
let lingerTimer = null;

function childRow(parent, kind, key) {
  const b = document.createElement("button");
  b.dataset.childKey = key;
  b.type = "button";
  b.className = "row agent child " + kind;
  b.dataset.sessionId = parent.session_id;
  return b;
}

function stackOf(text, meta) {
  const stack = Object.assign(document.createElement("span"), {className: "stack"});
  stack.append(Object.assign(document.createElement("span"), {className: "label", textContent: text}));
  if (meta) {
    stack.append(Object.assign(document.createElement("span"), {className: "model", textContent: meta}));
  }
  return stack;
}

function paint(snapshot) {
  const root = document.getElementById("groups");
  const focused = document.activeElement;
  const keepId = focused && focused.dataset ? focused.dataset.sessionId : null;
  const menuFocus = openMenu && openMenu.contains(focused) ? focused : null;
  root.textContent = "";

  if (!snapshot.groups.length) {
    const p = document.createElement("p");
    p.id = "empty";
    p.textContent = "No sessions.";
    root.append(p);
    return;
  }

  for (const group of snapshot.groups) {
    // The Toolbelt already titles this panel "Agents", so the first heading
    // only repeats it. SESSIONS still earns its line: it divides two kinds of
    // row rather than naming the panel.
    const h = document.createElement("h2");
    h.textContent = group.name;
    h.hidden = group.name === "AGENTS";
    const ul = document.createElement("ul");
    // The card the rows that follow belong to. Rows arrive parent first, then
    // its teammates, so a depth-1 row always joins the card opened just above.
    let card = null;
    for (const row of group.rows) {
      const li = row.depth && card ? card : document.createElement("li");
      if (li !== card) {
        li.className = "line card";
        li.dataset.key = row.session_id;
        card = li;
      }
      const b = document.createElement("button");
      b.className = "row " + (group.name === "AGENTS" ? "agent" : "shell")
                  + (row.depth ? " child" : "");
      b.dataset.sessionId = row.session_id;
      b.type = "button";


      const hot = IS_EXCEPTION(row.state);
      if (!hot && row.state !== "working" && !row.running) b.classList.add("quiet");
      if (hot) {
        b.classList.add("hot");
        card.classList.add("blocked");
      }

      // Identity, always, and never as the ground.
      const mark = document.createElement("span");
      // The session's colour on the row itself, so the task graphic can wear it.
      if (SESSION_COLOURS[row.colour]) b.style.setProperty("--hue", SESSION_COLOURS[row.colour]);
      // A plain terminal running a command is busy the same way an agent
      // mid-turn is, so it gets the same dots, in grey for want of a colour.
      if (row.state === "working" || row.running) {
        mark.className = "busy" + (row.depth ? " down" : "");
        mark.innerHTML = "<i></i><i></i><i></i>";
      } else if (group.name !== "AGENTS" && !row.depth) {
        // A plain terminal at its prompt: the shell mark, in its session colour.
        mark.className = "shell-mark";
        mark.append(metaIcon("shells"));
      } else {
        mark.className = "swatch" + (row.state === "unknown" ? " hollow" : "");
      }
      if (SESSION_COLOURS[row.colour]) {
        mark.style.setProperty("--hue", SESSION_COLOURS[row.colour]);
      }
      b.append(mark);

      const stack = document.createElement("span");
      stack.className = "stack";

      const label = document.createElement("span");
      label.className = "label";
      label.append(row.label);
      stack.append(label);

      // What the session says it is doing, as it wrote it: a title, then
      // the rough percent, the activity and how old the report is.
      if (row.task && SETTINGS?.show_task !== false) {
        stack.append(taskLine(row.task));
      }

      // Branch then model, on one line under the name: both describe the
      // session rather than its state, so they belong together and behind it.
      // Each item has an icon saying which it is, and a middot between items.
      const meta = document.createElement("span");
      meta.className = "model";
      for (const [kind, value] of [["title", row.title], ["branch", row.branch], ["model", row.model]]) {
        if (!value || SETTINGS?.[`show_${kind}`] === false) continue;
        const chip = document.createElement("span");
        chip.className = "mchip";
        chip.classList.add(kind === "branch" ? "branch" : kind === "title" ? "title" : "model-name");
        const text = Object.assign(document.createElement("span"),
                                   {className: "mtext", textContent: value});
        // The model's mark is its provider's; a tab title wears a computer.
        if (kind === "model") chip.append(providerIcon(row.provider || "claude", row.provider === "openai" ? "OpenAI" : "Claude"));
        else chip.append(metaIcon(kind === "title" ? "computer" : kind));
        chip.append(text);
        chip.title = value;
        const effort = kind === "model" && EFFORT_LETTERS[row.effort]
          ? document.createElement("span") : null;
        if (effort) {
          effort.className = "effort " + row.effort;
          if (row.effort === "max") effort.innerHTML = "<i>m</i><i>x</i>";
          else effort.textContent = EFFORT_LETTERS[row.effort];
        }
        chip.dataset.spoken = kind === "branch" ? `on branch ${value}`
          : kind === "title" ? `tab ${value}`
          : `model ${value}` + (row.effort ? `, ${row.effort} effort` : "");
        meta.append(chip);
        if (effort) meta.append(effort);
      }
      // Context reads on this line and not the one above. It is a fact about
      // the session in the same way the branch and the model are, and every
      // other item here is an icon and a value -- a bare number on the first
      // line was the one exception, sitting against the shells count with
      // nothing between them so the two read as a single figure.
      if (typeof row.context === "number" && row.context >= speaksAt()) {
        const chip = document.createElement("span");
        chip.className = "mchip ctx" + (row.context >= 90 ? " critical" : "");
        chip.append(metaIcon("gauge"),
                    document.createTextNode(row.context + "%"));
        meta.append(chip);
      }
      if (meta.childElementCount) stack.append(meta);
      b.append(stack);

      if (row.job) {
        const job = document.createElement("span");
        job.className = "job";
        job.textContent = row.job;
        b.append(job);
      }

      if (hot) {
        const word = document.createElement("span");
        word.className = "word blocked";
        word.textContent = "waiting";
        syncBreathe(word);
        b.append(word);
      } else if (row.state === "working" && row.working_since
                 && Date.now() / 1000 - row.working_since >= LONG_TURN_SECONDS) {
        const running = Date.now() / 1000 - row.working_since;
        const word = document.createElement("span");
        word.className = "word long";
        word.textContent = `long ${duration(running)}`;
        b.append(word);
        b.classList.add("long-turn");
      } else if (row.state === "idle" && !row.depth) {
        const word = document.createElement("span");
        word.className = "word idle";
        word.textContent = "idle";
        syncShimmer(word);
        b.append(word);
        b.classList.add("resting");
      }


      // aria-label only, never title: the hover card says the same thing,
      // and the OS tooltip is drawn by the window server, above any z-index
      // this page can reach. Two of them at once is what that looks like.
      const said = row.state ? STATE_TITLES[row.state] || row.state : null;
      // One label for the whole button: a label on a span inside it is
      // never read, so the task and the facts line are spoken from here.
      b.setAttribute("aria-label",
                     [row.label, row.provider === "openai" ? "Codex" : null, row.position, said,
                      b.classList.contains("long-turn")
                        ? `running for ${duration(Date.now() / 1000 - row.working_since)}, may be stuck` : null,
                      typeof row.context === "number" ? row.context + "% context" : null,
                      ...[...b.querySelectorAll("[data-spoken]")].map(el => el.dataset.spoken)]
                       .filter(Boolean).join(" \u2014 "));

      b.addEventListener("click", () => act(row.session_id, "focus"));
      watchForCard(b, row);
      // A repaint puts an open menu back as the same node: its position, its
      // armed second click and its keyboard focus survive, and it does not
      // unfold again.
      const keptMenu = openMenuKey === row.session_id && openMenu;
      const menu = keptMenu || menuFor(row, group);
      if (keptMenu) keptMenu.classList.add("kept");
      const host = card;       // `card` moves on with the loop; the menu stays
      if (menu) {
        b.addEventListener("contextmenu", e => openMenuAt(menu, host, e, row.session_id));
      }

      if (row.depth && li === card) {
        // A teammate: one line inside its parent's card, above the shells.
        b.classList.add("child");
        b.dataset.childKey = "mate\n" + row.session_id;
        const kids = childrenOf(card);
        kids.insertBefore(b, kids.querySelector(":scope > .tail"));
        if (menu) card.append(menu);
        continue;
      }
      li.append(b);
      if (menu) li.append(menu);
      ul.append(li);

      // Subagents run inside their parent's process with no terminal of their
      // own; the hook lists them with the name they were given and the model
      // they reply with, once their files say so, and by type until then.
      // Clicking one focuses the session they run in.
      const subs = SETTINGS?.show_agents !== false ? row.subagents || [] : [];
      for (const sub of subs) {
        const sb = childRow(row, "tail", `sub\n${sub.type}\n${sub.since}`);
        // A finished subagent keeps its place until the next prompt, quiet,
        // with how long it ran; its key does not change, so nothing moves.
        const done = sub.ended != null;
        const dots = Object.assign(document.createElement("span"), {className: done ? "busy" : "busy down"});
        if (done) dots.innerHTML = '<svg class="done-mark" viewBox="0 0 8 8" aria-hidden="true"><path d="M.8 4.3 3 6.5 7.2 1.5"/></svg>';
        else dots.innerHTML = "<i></i><i></i><i></i>";
        if (done) sb.classList.add("finished");
        const ran = sub.since == null ? null
          : forHumans((done ? sub.ended : Date.now() / 1000) - sub.since);
        const title = sub.name || sub.type || "subagent";
        const stack = stackOf(title);
        const meta = Object.assign(document.createElement("span"), {className: "model"});
        if (sub.model && SETTINGS?.show_model !== false) {
          const chip = Object.assign(document.createElement("span"), {className: "mchip model-name"});
          chip.append(providerIcon("claude", "Claude"),
                      Object.assign(document.createElement("span"), {className: "mtext", textContent: sub.model}));
          meta.append(chip);
        }
        if (ran) meta.append(Object.assign(document.createElement("span"), {className: "mchip", textContent: ran}));
        if (meta.childElementCount) stack.append(meta);
        sb.append(dots, stack);
        sb.title = sub.name && sub.type ? `${sub.name} (${sub.type})` : title;
        sb.setAttribute("aria-label", [`subagent ${title} in ${row.label}`, sub.model,
                                       ran && (done ? `finished after ${ran}` : `running ${ran}`)]
                                       .filter(Boolean).join(", "));
        sb.addEventListener("click", () => act(row.session_id, "focus"));
        childrenOf(li).append(sb);
      }

      // Background shells. Claude Code draws these in its own footer from
      // memory it never publishes, so they are read off the process tree.
      // Folded into one line that opens them; clicking a shell row shows its
      // whole command.
      const shells = SETTINGS?.show_shells !== false ? row.shells || [] : [];
      const key = row.session_id;
      if (shells.length) { shellsEndedAt.delete(key); shellsHad.set(key, shells.length); }
      else if (shellsHad.has(key)) { shellsEndedAt.set(key, [Date.now(), shellsHad.get(key)]); shellsHad.delete(key); }
      const [endedAt, hadN] = shellsEndedAt.get(key) ?? [-Infinity, 0];
      const lingering = !shells.length && Date.now() - endedAt < SHELL_LINGER_MS;
      if (lingering) {
        const sum = Object.assign(document.createElement("div"), {className: "shell-sum quiet"});
        sum.dataset.childKey = "shells";
        // What just happened, not a negative: the count it had, finished.
        sum.append(metaIcon("shells"), Object.assign(document.createElement("span"),
                                                     {textContent: `${hadN} command${hadN > 1 ? "s" : ""} finished`}));
        li.append(sum);
        clearTimeout(lingerTimer);
        lingerTimer = setTimeout(() => { if (LATEST) render(LATEST); }, SHELL_LINGER_MS + 50);
      }
      if (shells.length) {
        const open = SETTINGS?.expand_shells ? !flippedShells.has(key) : flippedShells.has(key);
        const sum = document.createElement("button");
        sum.type = "button";
        sum.className = "shell-sum";
        sum.dataset.childKey = "shells";
        const n = shells.length;
        const chev = Object.assign(document.createElement("span"),
                                   {className: "chev", textContent: "\u203a"});
        const count = Object.assign(document.createElement("span"),
                                    {className: "shimmer", textContent: `${n} command${n > 1 ? "s" : ""} running`});
        syncShimmer(count);
        sum.append(metaIcon("shells"), count, chev);
        sum.setAttribute("aria-expanded", String(open));
        sum.setAttribute("aria-controls", "shells-" + row.session_id);
        sum.setAttribute("aria-label", `${n} background shell${n > 1 ? "s" : ""} in ${row.label}`);
        sum.addEventListener("click", () => {
          if (flippedShells.has(key)) flippedShells.delete(key); else flippedShells.add(key);
          if (LATEST) render(LATEST);
        });
        li.append(sum);
        if (open) {
          const rows = Object.assign(document.createElement("div"),
                                     {className: "children shell-rows", id: "shells-" + row.session_id});
          li.append(rows);
          for (const shell of shells) {
            const sb = childRow(row, "bg-shell", "shell\n" + shell.command);
            sb.append(metaIcon("shells"), stackOf(shell.label));
            sb.setAttribute("aria-label", `shell in ${row.label}: ${shell.command}`);
            const popKey = row.session_id + "\n" + shell.command;
            // A repaint puts the open popover back as the same node, so its
            // Copy state and any selection survive, and without the unfold:
            // re-inserting an element restarts its CSS animation.
            const kept = openShellKey === popKey && openMenu;
            const pop = kept || shellPopover([shell]);
            if (kept) pop.classList.add("kept");
            const place = () => { pop.style.top = sb.offsetTop + sb.offsetHeight + "px"; };
            sb.addEventListener("pointerdown", e => e.stopPropagation());
            sb.addEventListener("click", () => {
              if (openShellKey === popKey) { closeMenu(); return; }
              place();
              openShell(pop, popKey);
            });
            rows.append(sb);
            li.append(pop);
            if (openShellKey === popKey) {
              pop.hidden = false; openMenu = pop;
              requestAnimationFrame(place);
            }
          }
        }
      }
    }
    root.append(h, ul);
  }

  // A shell that has exited, or a session that closed, took its menu with it.
  if (openMenu && !openMenu.isConnected) { openMenu = null; openShellKey = null; openMenuKey = null; }
  if (menuFocus && menuFocus.isConnected) menuFocus.focus();

  // Keep the keyboard where it was across a repaint, or the list is unusable
  // the moment anything changes.
  if (keepId) {
    const again = root.querySelector(`[data-session-id="${CSS.escape(keepId)}"]`);
    if (again) again.focus();
  }
}

// Arrows move; Enter and Space activate (free, since rows are buttons).
// Cmd+Enter (or Ctrl+Enter) sends a newline to the focused session, which is
// what unblocks a Claude Code session sitting at a prompt. NOT Shift+Enter:
// iTerm2 claims that combination and it never reaches the page. Measured
// 2026-09-07 -- Alt, Meta and Ctrl with Enter all arrive, Shift with Enter
// does not.
//
// No letter keys. iTerm2 routes printable characters to the terminal and only
// passes navigation keys and modifiers through to a Toolbelt webview, so a
// j/k binding here would be silently dead. Measured 2026-09-07: pressing j and
// k produced no keydown at all, while ArrowDown, Meta and Shift arrived.
document.addEventListener("keydown", event => {
  // An open menu owns the arrows; the list behind it must not scroll away.
  if (openMenu && openMenu.contains(document.activeElement)) return;
  const rows = [...document.querySelectorAll("button.row")];
  if (!rows.length) return;
  const at = rows.indexOf(document.activeElement);

  if (event.key === "ArrowDown") {
    event.preventDefault();
    (rows[at + 1] || rows[0]).focus();
  } else if (event.key === "ArrowUp") {
    event.preventDefault();
    (at > 0 ? rows[at - 1] : rows[rows.length - 1]).focus();
  } else if (event.key === "Enter" && (event.metaKey || event.ctrlKey) && at >= 0) {
    event.preventDefault();
    act(rows[at].dataset.sessionId, "send", "\n");
  }
});

// ---------------------------------------------------------------- settings
let SETTINGS = null;
const SETTING_ROWS = [
  {head: "Sound"},
  {k: "sound",        label: "Play sounds"},
  {k: "sound_blocked",label: "When a session is blocked", sub: true, needs: "sound"},
  {k: "sound_done",   label: "When one finishes", sub: true, needs: "sound"},
  {k: "volume",       label: "Volume", range: [0, 1, .05], needs: "sound", pct: true},
  {k: "muted",        label: "Mute everything"},
  {head: "Notifications"},
  {k: "notify",       label: "Show macOS notifications"},
  {k: "notify_blocked", label: "When a session asks a question", sub: true, needs: "notify"},
  {k: "notify_done",  label: "When one finishes", sub: true, needs: "notify"},
  {head: "Focus"},
  {k: "focus_blocked", label: "Bring a blocked session forward"},
  {k: "return_after_blocked", label: "Go back once it resumes", sub: true, needs: "focus_blocked"},
  {head: "Rows"},
  {k: "context_threshold", label: "Warn above", range: [0, 100, 5], pct: true},
  {k: "show_branch",  label: "Show branch"},
  {k: "show_task",    label: "Show task"},
  {k: "show_task_activity", label: "What it is doing", sub: true, needs: "show_task"},
  {k: "show_task_age", label: "How old the report is", sub: true, needs: "show_task"},
  {k: "show_task_bar", label: "Progress bar", sub: true, needs: "show_task"},
  {k: "show_model",   label: "Show model"},
  {k: "show_agents",  label: "Show subagents"},
  {k: "show_shells",  label: "Show background shells"},
  {k: "expand_shells", label: "Start expanded", sub: true, needs: "show_shells"},
  {k: "ui_scale",     label: "Text size",
   steps: [0.8, 0.9, 1, 1.1, 1.2, 1.3, 1.4, 1.5, 1.6]},
];

function settingsBody() {
  const box = document.getElementById("settings");
  box.textContent = "";
  for (const row of SETTING_ROWS) {
    if (row.head) {
      const h = document.createElement("div");
      h.className = "set-head";
      h.textContent = row.head;
      box.append(h);
      continue;
    }
    const line = document.createElement("label");
    line.className = "set" + (row.sub ? " sub" : "");
    const name = document.createElement("span");
    name.textContent = row.label;
    line.append(name);

    // A switch is disabled, not hidden, when its parent is off: the option
    // stays where the eye already learned to find it.
    const off = row.needs && !SETTINGS[row.needs];

    if (row.steps) {
      // Minus, the value, plus. Nine sizes is few enough to step through and
      // too few to be worth hunting for with a dragged thumb.
      const box = document.createElement("span");
      box.className = "step";
      const back = Object.assign(document.createElement("button"),
                                 {type: "button", textContent: "\u2212"});
      const now = document.createElement("span");
      now.className = "now";
      const on = Object.assign(document.createElement("button"),
                               {type: "button", textContent: "+"});
      back.setAttribute("aria-label", `Smaller ${row.label.toLowerCase()}`);
      on.setAttribute("aria-label", `Larger ${row.label.toLowerCase()}`);

      const nearest = value =>
        row.steps.reduce((best, s) =>
          Math.abs(s - value) < Math.abs(best - value) ? s : best, row.steps[0]);
      let at = row.steps.indexOf(nearest(Number(SETTINGS[row.k])));

      const paint = () => {
        const value = row.steps[at];
        now.textContent = Number(value).toFixed(2).replace(/0$/, "") + "\u00d7";
        back.disabled = off || at === 0;
        on.disabled = off || at === row.steps.length - 1;
      };
      const move = by => {
        const next = Math.max(0, Math.min(row.steps.length - 1, at + by));
        if (next === at) return;
        at = next;
        paint();
        // Applied before it is saved, so the size you are choosing is the
        // size you are looking at.
        if (row.k === "ui_scale") applyScale(row.steps[at]);
        push({[row.k]: row.steps[at]});
      };
      back.addEventListener("click", () => move(-1));
      on.addEventListener("click", () => move(1));
      paint();
      box.append(back, now, on);
      line.append(box);
    } else if (row.range) {
      const [min, max, step] = row.range;
      const slider = document.createElement("input");
      Object.assign(slider, {type: "range", min, max, step, value: SETTINGS[row.k],
                             disabled: off});
      slider.setAttribute("aria-label", row.label);
      const read = document.createElement("span");
      read.className = "val";
      const show = v => read.textContent = row.times
        ? Number(v).toFixed(2).replace(/0$/, "") + "\u00d7"
        : row.pct ? Math.round(v * (max <= 1 ? 100 : 1)) + "%" : v;
      show(SETTINGS[row.k]);
      slider.addEventListener("input", () => {
        show(slider.value);
        if (row.k === "ui_scale") applyScale(slider.value);
      });
      slider.addEventListener("change", () => push({[row.k]: Number(slider.value)}));
      // Slider and read-out travel together: when the row wraps, a number
      // stranded on a line of its own reads as a value for the row below.
      const ctl = document.createElement("span");
      ctl.className = "ctl";
      ctl.append(slider, read);
      line.append(ctl);
    } else {
      const sw = document.createElement("button");
      sw.type = "button";
      sw.className = "sw";
      sw.setAttribute("role", "switch");
      sw.setAttribute("aria-label", row.label);
      sw.setAttribute("aria-checked", String(!!SETTINGS[row.k]));
      sw.disabled = off;
      sw.addEventListener("click", () => push({[row.k]: !SETTINGS[row.k]}));
      line.append(sw);
    }
    box.append(line);
  }
}

function push(change) {
  SETTINGS = {...SETTINGS, ...change};
  settingsBody();
  render(LATEST);
  fetch(`/settings?token=${encodeURIComponent(TOKEN)}`,
        {method: "POST", body: JSON.stringify(change)})
    .then(r => r.json())
    .then(s => { SETTINGS = s; applyScale(s.ui_scale); settingsBody(); render(LATEST); })
    .catch(err => console.log("sidebar: settings save failed", err));
}

// The panel only re-reads page.html when it is opened; this saves the reopen.
// Reload also asks the daemon for fresh account readings first, within
// the reading floor; the reloaded page then paints them.
document.getElementById("reload").addEventListener("click", () => {
  fetch(`/accounts?token=${encodeURIComponent(TOKEN)}`, {method: "POST", body: JSON.stringify({op: "read"})})
    .catch(() => {}).finally(() => location.reload());
});

const gear = document.getElementById("gear");
// Slides up out of the gear bar and back down into it. The close waits for
// its own animation before hiding, and a click mid-slide reverses it.
let drawerMotion = null;
gear.addEventListener("click", () => {
  const box = document.getElementById("settings");
  const open = box.hidden || drawerMotion?.closing;
  gear.setAttribute("aria-expanded", String(open));
  drawerMotion?.cancel();
  drawerMotion = null;
  if (!MOTION.matches) { box.hidden = !open; return; }
  const shut = {transform: "translateY(24px)", opacity: 0};
  const shown = {transform: "none", opacity: 1};
  if (open) {
    box.hidden = false;
    box.animate([shut, shown], {duration: 200, easing: "cubic-bezier(.16,1,.3,1)"});
    return;
  }
  drawerMotion = box.animate([shown, shut], {duration: 140, easing: "ease-in", fill: "forwards"});
  drawerMotion.closing = true;
  const mine = drawerMotion;
  mine.finished.then(() => {
    if (drawerMotion !== mine) return;
    box.hidden = true;
    mine.cancel();
    drawerMotion = null;
  }, () => {});
});

fetch(`/settings?token=${encodeURIComponent(TOKEN)}`)
  .then(r => r.json())
  .then(s => { SETTINGS = s; applyScale(s.ui_scale); settingsBody(); render(LATEST); })
  .catch(() => { SETTINGS = {}; });

// ------------------------------------------------------------------- sound
// Synthesised, because the page has no network and so no audio files. WebKit
// will not start an AudioContext without a gesture, so it is created on the
// first one and the first sounds before that are simply skipped.
let audio = null;
addEventListener("pointerdown", () => {
  if (!audio) { try { audio = new AudioContext(); } catch (e) { audio = false; } }
  if (audio && audio.state === "suspended") audio.resume();
}, {once: false});

function tone(steps, gain) {
  if (!audio || !SETTINGS || SETTINGS.muted || !SETTINGS.sound) return;
  const level = gain * (SETTINGS.volume ?? .4);
  steps.forEach(([hz, at, len], i) => {
    const osc = audio.createOscillator();
    const amp = audio.createGain();
    osc.type = "sine";
    osc.frequency.value = hz;
    const t0 = audio.currentTime + at;
    // A short attack and an exponential tail: a click on either end is what
    // makes a synthesised tone sound cheap.
    amp.gain.setValueAtTime(0.0001, t0);
    amp.gain.exponentialRampToValueAtTime(level, t0 + .012);
    amp.gain.exponentialRampToValueAtTime(0.0001, t0 + len);
    osc.connect(amp).connect(audio.destination);
    osc.start(t0);
    osc.stop(t0 + len + .02);
  });
}

// Rising pair: a question, and it wants an answer.
const soundBlocked = () => tone([[660, 0, .16], [880, .13, .26]], .22);
// Single soft note, falling away: something ended, nothing is being asked.
const soundDone    = () => tone([[520, 0, .34]], .10);

// Sound fires on a CHANGE of state, never on the state itself: a snapshot
// arrives every few seconds and re-announcing a standing state is how a
// notification becomes noise.
let lastStates = new Map();
// When each session's current turn began, from the row; a Stop hook that runs
// a command flips the session to working for a few seconds without starting
// a turn, and that must neither re-post a finished-turn notice nor take one
// down. Only a prompt moves working_since.
const turnStarts = new Map();
const announcedTurns = new Map();
function announce(snapshot) {
  const now = new Map();
  for (const g of snapshot.groups || []) {
    for (const r of g.rows) {
      now.set(r.session_id, r.state);
      if (r.working_since) turnStarts.set(r.session_id, r.working_since);
    }
  }
  if (lastStates.size) {
    let focused = false;
    for (const [id, state] of now) {
      const before = lastStates.get(id);
      if (state === before) continue;
      const turn = turnStarts.get(id);
      const newTurn = state === "working" && turn !== undefined && turn !== announcedTurns.get(id);
      const turnDone = state === "idle" && before === "working" && turn !== announcedTurns.get(id);
      if (state === "blocked" && SETTINGS?.sound_blocked) soundBlocked();
      else if (state === "idle" && before === "working" && SETTINGS?.sound_done) soundDone();
      // The banner reaches you in another application, where no sound or
      // focus move can. The daemon decides whether you are already looking
      // at the session; the page only says what happened. Going back to work
      // takes a standing notice down, so the list never lies about a session
      // that has since moved on.
      if (SETTINGS?.notify) {
        if (state === "blocked" && SETTINGS.notify_blocked) act(id, "notify", "blocked");
        else if (turnDone && SETTINGS.notify_done) { act(id, "notify", "done"); announcedTurns.set(id, turn); }
        else if (before === "blocked" || newTurn) act(id, "notify", "clear");
      }
      // One session per update: two blocking at once would otherwise each
      // take focus in turn, leaving you on whichever happened to be last.
      if (state === "blocked" && SETTINGS?.focus_blocked && !focused) {
        act(id, "bring");
        focused = true;
      }
      // The daemon goes back only if it brought you here and you are still
      // here, so this can be sent for every session that stops being blocked.
      if (before === "blocked" && SETTINGS?.focus_blocked && SETTINGS?.return_after_blocked) {
        act(id, "return");
      }
    }
  }
  lastStates = now;
}

const events = new EventSource(`/events?token=${encodeURIComponent(TOKEN)}`);
// A heartbeat proves the daemon is answering; its payload says whether what
// the daemon last read is current. An unfresh one paints STALE immediately
// rather than waiting out the timer, because the daemon already knows.
events.addEventListener("heartbeat", event => {
  let fresh = true;
  try { fresh = JSON.parse(event.data || "{}").fresh !== false; } catch (err) { }
  if (fresh) markFresh();
  else document.body.classList.add("stale");
});
events.onmessage = event => {
  markFresh();
  LATEST = JSON.parse(event.data);
  announce(LATEST);
  render(LATEST);
};
events.onerror = () => document.body.classList.add("stale");
markFresh();
</script>
